ações\n- Evitar exposição ao sol e atividade física nas horas mais quentes por 48 horas.\n- Usar roupas leves e claras.\n- Ingerir líquidos com frequência, mesmo sem sede.\n\nRetorno ao PS, se:\n- Confusão mental ou desmaio.\n- Febre alta.\n- Vômitos persistentes.\n- Urina escura ou ausente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "exposicao-ao-sol-calor-desidratacao"}, {"id": "cinetose-enjoo-de-movimento", "nome": "Cinetose (enjoo de movimento)", "cid": "T75.3", "categoria": "clinica-geral", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Dimenidrinato 50 mg [Dramin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, 30 a 60 minutos antes da viagem. Pode repetir de 6/6 horas, se necessário (máximo 8 comprimidos por dia).\n\nOU\nMeclizina 25 mg [Meclin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, 1 hora antes da viagem, 1 vez ao dia.\n\nOrientações\n- Causa sonolência: não dirigir após o uso.\n- Sentar na frente do carro ou próximo às asas no avião.\n- Olhar para o horizonte; evitar ler durante a viagem.\n- Refeições leves antes da viagem."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tontura-sindrome-vestibular"}, {"id": "reacao-local-febre-apos-vacina", "nome": "Reação local / febre após vacina", "cid": "T88.1", "categoria": "clinica-geral", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOU\nParacetamol 750 mg [Tylenol®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nSe coceira local:\n2) Bilastina 20 mg [Alektos®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum (1 hora antes ou 2 horas após alimentos), por 5 dias.\n\nOrientações\n- Compressas frias no local nas primeiras 24 a 48 horas.\n- Os sintomas costumam passar em 2 a 3 dias.\n- Notificar o evento supostamente atribuível à vacinação (ESAVI).\n- Na maioria dos casos, não contraindica as próximas doses.\n\nRetorno ao PS, se:\n- Falta de ar, inchaço no rosto ou lábios.\n- Febre por mais de 48 horas.\n- Vermelhidão que se espalha, com calor e pus.\n- Fraqueza nas pernas ou convulsão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "urticaria-aguda-reacao-alergica-cutanea"}, {"id": "constipacao-induzida-por-opioide", "nome": "Constipação induzida por opioide", "cid": "K59.0", "categoria": "clinica-geral", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Macrogol 3350 17 g [Muvinlax®] ------------------------ 01 caixa\nDissolver 1 sachê em 200 mL de água e tomar 1 a 2 vezes ao dia, enquanto usar o opioide.\n2) Bisacodil 5 mg [Dulcolax®] ------------------------ 20 comprimidos\nTomar 1 a 2 comprimidos, via oral, à noite, se sem evacuar há 2 dias.\n\nOU\nLactulose 667 mg/mL [Lactulona®] ------------------------ 01 frasco\nTomar 15 a 30 mL, via oral, 1 a 2 vezes ao dia.\n\nOrientações\n- Iniciar o laxante junto com o opioide e manter durante todo o uso.\n- Ingerir 2 litros de água por dia.\n- Fibras isoladas podem piorar sem hidratação adequada.\n\nRetorno ao PS, se:\n- Sem evacuar e sem eliminar gases por mais de 3 dias.\n- Dor ou distensão abdominal importante.\n- Vômitos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "constipacao-distensao-abdominal"}, {"id": "caibras-musculares-noturnas", "nome": "Cãibras musculares noturnas", "cid": "R25.2", "categoria": "clinica-geral", "abas": [{"nome": "Receita", "texto": "OUTROS\n1) Alongamento da panturrilha ------------------------ uso contínuo\nAlongar por 30 segundos, 3 vezes, antes de dormir.\n\nOrientações\n- Manter boa hidratação.\n- Revisar medicações que causam cãibras (diuréticos, estatinas).\n- Colher potássio, magnésio, cálcio, função renal, glicemia e TSH.\n- Evitar quinina (risco de efeitos graves).\n- Durante a cãibra, esticar o pé puxando os dedos para cima.\n\nRetorno ao PS, se:\n- Fraqueza muscular ou urina escura.\n- Dor e inchaço em uma perna.\n- Cãibras com palpitações."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "intoxicacao-alcoolica-leve-alta-sintomas-residuais", "nome": "Intoxicação alcoólica leve — alta (sintomas residuais)", "cid": "F10.0", "categoria": "clinica-geral", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Tiamina 300 mg [Benerva®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 30 dias.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas.\n3) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor de cabeça.\n\nOrientações\n- Hidratação com água e alimentação leve.\n- Não dirigir hoje.\n- Ficar acompanhado nas próximas horas.\n- Se uso frequente de álcool, procurar a UBS ou o CAPS AD.\n\nRetorno ao PS, se:\n- Vômitos com sangue.\n- Confusão, sonolência excessiva ou convulsão.\n- Tremores intensos, suor e agitação (abstinência).\n- Dor abdominal intensa."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "intoxicacao-exogena"}, {"id": "picada-de-cobra-acidente-ofidico", "nome": "Picada de cobra (acidente ofídico)", "cid": "T63.0", "categoria": "clinica-geral", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Manter o membro em repouso e elevado; retirar anéis e pulseiras.\n2) Não fazer torniquete, cortes, sucção ou uso de substâncias no local.\n3) Hidratação venosa e controle de diurese.\n4) Tempo de coagulação (TC), hemograma, creatinina, CPK e urina tipo I.\n\nUSO ENDOVENOSO\n5) Soro antiofídico específico (conforme gênero e gravidade — MS) ------------------------ ampolas\nDiluir em SF 0,9% e infundir em 20 a 60 minutos, em ambiente com material de reanimação.\n- Botrópico (jararaca): leve 3, moderado 6, grave 12 ampolas.\n- Crotálico (cascavel): leve 5, moderado 10, grave 20 ampolas.\n- Laquético (surucucu): moderado 10, grave 20 ampolas.\n- Elapídico (coral): 10 ampolas (sempre considerado grave).\n6) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, se dor.\n\nProfilaxia de tétano conforme situação vacinal.\n\nOrientações\n- Notificação compulsória.\n- Observação e internação conforme gravidade; repetir TC 12 e 24 horas após o soro.\n- Contato com o centro de informação toxicológica (CIATox) se dúvida."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "picada-acidente-com-animal-peconhento"}, {"id": "lombociatalgia-aguda", "nome": "Lombociatalgia aguda", "cid": "M54.4", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n3) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nSe dor radicular intensa (não associar ao anti-inflamatório):\nPrednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 2 comprimidos, via oral, pela manhã, por 5 dias.\n\nOrientações\n- Evitar repouso absoluto; caminhar dentro do tolerado.\n- Compressas mornas na região lombar.\n- Evitar carregar peso nos primeiros dias.\n- Fisioterapia se a dor persistir por mais de 2 semanas.\n\nRetorno ao PS, se:\n- Fraqueza nas pernas.\n- Dormência na região genital ou anal.\n- Perda do controle da urina ou das fezes.\n- Febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "lombalgia-mecanica-aguda-lombociatalgia"}, {"id": "cervicalgia-aguda", "nome": "Cervicalgia aguda", "cid": "M54.2", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n3) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nOrientações\n- Compressas mornas por 15 a 20 minutos, 3 vezes ao dia.\n- Manter boa postura ao usar celular e computador.\n- Alongamentos suaves conforme tolerado.\n\nRetorno ao PS, se:\n- Fraqueza ou dormência nos braços.\n- Febre ou rigidez de nuca com dor de cabeça.\n- Dor após trauma.\n- Dificuldade para andar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "torcicolo-agudo", "nome": "Torcicolo agudo", "cid": "M43.6", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no pescoço, 3 vezes ao dia, por 7 dias.\n\nOrientações\n- Calor local por 15 a 20 minutos, 3 vezes ao dia.\n- Movimentar o pescoço suavemente dentro do tolerado.\n- Usar travesseiro baixo.\n\nRetorno ao PS, se:\n- Febre ou dor de cabeça intensa.\n- Fraqueza ou dormência nos braços.\n- Dificuldade para engolir."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "contratura-dor-muscular", "nome": "Contratura / dor muscular", "cid": "M79.1", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Leve", "texto": "USO TÓPICO\n\n1) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada sobre a área dolorosa, via tópica, 3 a 4 vezes ao dia, por 7 dias.\n\nUSO ORAL\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\n3) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nOrientações\n- Aplicar gelo nas primeiras 48 horas.\n- Evitar exercícios intensos até melhora dos sintomas.\n- Manter hidratação adequada.\n- Retornar gradualmente às atividades físicas.\n\nRetorno ao PS, se:\n- Fraqueza muscular importante.\n- Urina escura.\n- Febre.\n- Edema importante.\n- Trauma importante associado.\n- Perda progressiva de força."}, {"nome": "Moderada", "texto": "USO TÓPICO\n\n1) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada sobre a região dolorosa, via tópica, 3 a 4 vezes ao dia, por 7 dias.\n\nUSO ORAL\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\n4) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nOrientações\n- Aplicar gelo nas primeiras 48 horas.\n- Após 48 horas, calor local pode aliviar espasmos musculares.\n- Manter hidratação adequada.\n- Evitar exercícios intensos até melhora dos sintomas.\n\nRetorno ao PS, se:\n- Fraqueza muscular importante.\n- Urina escura.\n- Febre.\n- Edema importante.\n- Perda progressiva de força."}, {"nome": "Moderada com espasmo", "texto": "USO TÓPICO\n\n1) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada sobre a região dolorosa, via tópica, 3 a 4 vezes ao dia, por 7 dias.\n\nUSO ORAL\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n3) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nOrientações\n- Aplicar gelo nas primeiras 48 horas.\n- Após 48 horas, calor local pode aliviar espasmos musculares.\n- Evitar exercícios intensos até melhora dos sintomas.\n- Retornar gradualmente às atividades físicas.\n\nRetorno ao PS, se:\n- Fraqueza muscular importante.\n- Urina escura.\n- Febre.\n- Edema importante.\n- Perda progressiva de força."}, {"nome": "Intensa", "texto": "USO TÓPICO\n\n1) Adesivo de Diclofenaco 140 mg [Flector®] ------------------------ 01 caixa\nAplicar 1 adesivo sobre a região dolorosa, via tópica, de 12/12 horas, por 7 dias.\n\nUSO ORAL\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "entorse-de-tornozelo", "nome": "Entorse de tornozelo", "cid": "S93.4", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no local, 3 vezes ao dia, por 7 dias.\n\nOUTROS\n4) Tornozeleira elástica ou imobilizador (bota/órtese) ------------------------ 01 unidade\nUsar durante o dia por 1 a 2 semanas, conforme dor.\n\nOrientações\n- Gelo por 20 minutos, 3 a 4 vezes ao dia, nas primeiras 48 horas (protegido por um pano).\n- Elevar o pé acima do nível do coração quando deitado.\n- Apoiar o pé conforme tolerado; usar muletas se necessário.\n- Fisioterapia se dor ou instabilidade persistirem.\n\nRetorno ao PS, se:\n- Incapacidade de apoiar o pé após 48 horas.\n- Dedos frios, roxos ou dormentes.\n- Dor intensa que não melhora.\n- Dor e inchaço na panturrilha."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "trauma-fechado-de-extremidade-contusao-entorse"}, {"id": "entorse-de-joelho", "nome": "Entorse de joelho", "cid": "S83.6", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no local, 3 vezes ao dia, por 7 dias.\n\nOrientações\n- Gelo por 20 minutos, 3 a 4 vezes ao dia, nas primeiras 48 horas.\n- Elevar a perna e evitar esforço; muletas se dor ao apoiar.\n- Encaminhar ao ortopedista se inchaço importante, falseio ou travamento.\n\nRetorno ao PS, se:\n- Joelho travado ou muito inchado.\n- Incapacidade de apoiar a perna.\n- Dor e inchaço na panturrilha.\n- Febre com joelho quente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "trauma-fechado-de-extremidade-contusao-entorse"}, {"id": "contusao-trauma-de-partes-moles", "nome": "Contusão / trauma de partes moles", "cid": "T14.0", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no local, 3 vezes ao dia, por 7 dias.\n\nOrientações\n- Gelo por 20 minutos, 3 a 4 vezes ao dia, nas primeiras 48 horas.\n- Depois de 48 horas, compressas mornas.\n- Manchas roxas podem aumentar e mudar de cor: é esperado.\n\nRetorno ao PS, se:\n- Inchaço que aumenta muito, com pele tensa e dor intensa.\n- Dormência ou extremidade fria.\n- Deformidade ou incapacidade de mover."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "trauma-fechado-de-extremidade-contusao-entorse"}, {"id": "tendinopatia-do-ombro-manguito-rotador", "nome": "Tendinopatia do ombro (manguito rotador)", "cid": "M75.1", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no ombro, 3 vezes ao dia, por 7 dias.\n\nOrientações\n- Gelo por 15 a 20 minutos após atividades.\n- Evitar movimentos acima da cabeça e carregar peso.\n- Não imobilizar o ombro por muito tempo.\n- Encaminhamento para fisioterapia e ortopedia se persistir.\n\nRetorno ao PS, se:\n- Perda súbita de força para levantar o braço.\n- Febre com ombro quente e inchado.\n- Dor no peito ou falta de ar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "bursite-de-ombro", "nome": "Bursite de ombro", "cid": "M75.5", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Gelo por 15 a 20 minutos, 3 vezes ao dia.\n- Repouso relativo, evitando elevar o braço acima da cabeça.\n- Fisioterapia; avaliar infiltração com ortopedista se refratária.\n\nRetorno ao PS, se:\n- Febre com ombro vermelho e quente.\n- Perda de força no braço.\n- Dor no peito ou falta de ar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "epicondilite-lateral-cotovelo-de-tenista", "nome": "Epicondilite lateral (cotovelo de tenista)", "cid": "M77.1", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no cotovelo, 3 vezes ao dia, por 14 dias.\n\nUSO ORAL\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nOUTROS\n3) Braçadeira para epicondilite (órtese de contraforça) ------------------------ 01 unidade\nUsar 2 a 3 cm abaixo do cotovelo durante atividades.\n\nOrientações\n- Evitar movimentos repetitivos de punho e de pegar peso com a palma para baixo.\n- Gelo após atividades.\n- Fisioterapia com exercícios excêntricos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "tenossinovite-de-de-quervain", "nome": "Tenossinovite de De Quervain", "cid": "M65.4", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nUSO TÓPICO\n2) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar fina camada no punho, 3 vezes ao dia, por 14 dias.\n\nOUTROS\n3) Órtese tipo spica para polegar e punho ------------------------ 01 unidade\nUsar durante o dia e à noite por 3 a 4 semanas.\n\nOrientações\n- Evitar movimentos de pinça e de torcer (torcer roupa, segurar bebê com o polegar aberto).\n- Gelo por 15 minutos, 3 vezes ao dia.\n- Encaminhar ao ortopedista para infiltração se não melhorar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "fascite-plantar", "nome": "Fascite plantar", "cid": "M72.2", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nOUTROS\n2) Calcanheira de silicone ------------------------ 01 par\nUsar nos dois calçados.\n\nOrientações\n- Alongar panturrilha e sola do pé ao acordar e antes de dormir.\n- Rolar uma garrafa gelada sob o pé por 10 minutos, 2 vezes ao dia.\n- Evitar andar descalço e usar calçados com bom amortecimento.\n- Perda de peso, se sobrepeso.\n- A melhora pode levar semanas a meses."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "ascite-descompensacao-de-hepatopatia"}, {"id": "osteoartrite-de-joelho-crise-de-dor", "nome": "Osteoartrite de joelho — crise de dor", "cid": "M17.9", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Paracetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor. Máximo de 4 comprimidos por dia.\n\nOU\nDipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nSe sem contraindicação a anti-inflamatório:\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar no joelho, 3 a 4 vezes ao dia (preferir em idosos).\n\nOrientações\n- Exercícios de fortalecimento da coxa e fisioterapia.\n- Perda de peso, se sobrepeso.\n- Usar bengala do lado oposto ao joelho dolorido, se necessário.\n- Calor local alivia a rigidez.\n\nRetorno ao PS, se:\n- Joelho vermelho, quente e muito inchado.\n- Febre.\n- Incapacidade de apoiar a perna."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "crise-aguda-de-gota", "nome": "Crise aguda de gota", "cid": "M10.9", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "PRESCRIÇÃO PS\n\nUSO ENDOVENOSO / INTRAMUSCULAR\n\n1) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, AGORA.\n\nPRESCRIÇÃO CASA\n\nUSO ORAL\n\n1) Colchicina 0,6 mg [Colchis®] ------------------------ 03 comprimidos\nTomar 2 comprimidos, via oral, AGORA e 1 comprimido após 1 hora.\n\nOU\nPrednisona 20 mg [Meticorten®] ------------------------ 08 comprimidos\nTomar 2 comprimidos, via oral, 1 vez ao dia, por 5 dias.\n\n2) Naproxeno 500 mg [Flanax®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 a 7 dias.\n\n3) Omeprazol 20 mg [Losec®] ------------------------ 07 cápsulas\nTomar 1 cápsula, via oral, pela manhã, por 7 dias.\n\n4) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Fazer repouso da articulação acometida.\n- Aplicar gelo local por 20 a 30 minutos, 4 vezes ao dia.\n- Manter hidratação adequada.\n- Evitar bebidas alcoólicas.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Calafrios.\n- Incapacidade de apoiar o membro.\n- Vermelhidão extensa.\n- Dor intensa associada a mal-estar.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "monoartrite-aguda"}, {"id": "rinossinusite-aguda-viral", "nome": "Rinossinusite aguda viral", "cid": "J01.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nUSO NASAL\n\n2) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 01 frasco\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 14 dias.\n\nOrientações\n- Realizar lavagem nasal com soro fisiológico 0,9% várias vezes ao dia.\n- Manter hidratação adequada.\n- Evitar fumaça, poeira e ambientes com ar-condicionado excessivo.\n- Não utilizar oximetazolina por mais de 3 dias.\n- Fazer repouso relativo.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Dor facial intensa ou progressiva.\n- Falta de ar.\n- Edema ou vermelhidão ao redor dos olhos.\n- Vômitos persistentes.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "rinossinusite-congestao-nasal-e-dor-facial"}, {"id": "pneumonia-viral-influenza", "nome": "Pneumonia viral / influenza", "cid": "J12.9", "categoria": "pneumologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se febre ou dor.\n\nSe tosse seca e intensa:\n\n2) Levodropropizina 6 mg/mL [Antux®] ------------------------ 01 frasco\nTomar 10 mL, via oral, de 8/8 horas, se necessário.\n\nOU\nSe tosse com secreção que dificulta a expectoração:\nGuaifenesina + Oxomemazina [Expec®] ------------------------ 01 frasco\nTomar 5 mL, via oral, de 4/4 horas, se necessário.\n\n3) Fosfato de Oseltamivir 75 mg [Tamiflu®] ------------------------ 10 cápsulas\nTomar 1 cápsula, via oral, de 12/12 horas, por 5 dias.\n\nUSO NASAL\n\n4) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 01 frasco\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 14 dias.\nAplicar direcionando o spray para a parede lateral da narina.\n\n5) Soro fisiológico 0,9% ------------------------ 01 frasco\nAplicar 20 a 50 mL em cada narina, via nasal, de 3 a 6 vezes ao dia.\n\nOrientações\n- Manter hidratação adequada.\n- Realizar repouso relativo nos primeiros dias.\n- Alimentação fracionada e rica em proteínas.\n- Evitar tabagismo ativo e passivo.\n- Utilizar máscara enquanto houver tosse intensa ou febre.\n- Manter vacinação para Influenza e COVID-19 atualizada.\n- Não utilizar antibióticos sem prescrição médica.\n\nRetorno ao PS, se:\n- Falta de ar ou piora da dispneia.\n- Febre persistente , dose única.\nReavaliar glicemia capilar após 2 horas.\nGlicemia capilar > 450 mg/dL\n\n1) Insulina Regular ------------------------ 8 UI\nAplicar 8 UI, via subcutânea, dose única.\nReavaliar glicemia capilar em 1 a 2 horas.\n\n2) Soro Fisiológico 0,9% ------------------------ 500 mL\nInfundir 500 mL, via endovenosa, em 1 hora.\nRestringir hidratação vigorosa se:\nInsuficiência cardíaca descompensada.\nDRC avançada.\nIdosos frágeis.\n\nSe esqueceu doses habituais\n\n3) Retomar imediatamente a insulina basal habitual\n(NPH, Glargina, Degludeca ou Detemir).\n\nPACIENTE DIABÉTICO SEM INSULINOTERAPIA PRÉVIA\nGlicemia capilar entre 250 e 350 mg/dL\n\n1) Soro Fisiológico 0,9% ------------------------ 500 mL\nInfundir 500 mL EV em 1 hora.\n\n2) Insulina Regular ------------------------ 4 UI\nAplicar 4 UI, via subcutânea, dose única.\nReavaliar glicemia em 2 horas.\nGlicemia capilar entre 351 e 450 mg/dL\n\n1) Soro Fisiológico 0,9% ------------------------ 500 a 1000 mL\nInfundir EV em 1 a 2 horas.\n\n2) Insulina Regular ------------------------ 6 UI\nAplicar 6 UI, via subcutânea.\nReavaliar glicemia em 2 horas.\nGlicemia capilar > 450 mg/dL\n\n1) Soro Fisiológico 0,9% ------------------------ 1000 mL\nInfundir EV em 2 horas.\n\n2) Insulina Regular ------------------------ 8 UI\nAplicar 8 UI, via subcutânea.\nReavaliar glicemia em 1 hora.\n\nPara Casa\nDIAGNÓSTICO NOVO DE DM2\n\n1) Metformina 500 mg ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, após o jantar, por 7 dias.\n\nPACIENTE JÁ EM USO DE METFORMINA EM DOSE BAIXA\n\nPara Casa\n\n1) Metformina 850 mg ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, de 12 em 12 horas.\nTomar junto ou logo após as refeições.\n\nPACIENTE EM USO DE INSULINA BASAL\n\nPara Casa\n\n1) Manter a insulina basal habitual\n(NPH, Glargina, Degludeca ou Detemir).\nNunca suspender a insulina basal por conta própria.\n\nSe hiperglicemia recorrente\nAumentar a dose basal em 10-20%\n\nOU\nAdicionar 2 a 4 a.\n\nOrientações\n- Manter hidratação adequada.\n- Evitar alimentos gordurosos.\n- Fazer refeições leves e fracionadas.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Vômitos persistentes.\n- Dor intensa.\n- Icterícia.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-abdominal-suspeita-de-abdome-agudo"}, {"id": "colecistite-apendicite-aguda-conduta-no-ps", "nome": "Colecistite / apendicite aguda — conduta no PS", "cid": "K81.0", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "NO PS\n\nUSO ENDOVENOSO\n\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\n\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\nSe dor moderada ou intensa:\n\n3) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%.\nAplicar 2 mg, via endovenosa lenta.\nRepetir 2 mg a cada 5 a 10 minutos.\nDose usual total: 4 a 10 mg.\n\nSe contraindicação a AINE:\n\n4) Paracetamol 1 g/100 mL [Paracetamol Fresenius Kabi®] ------------------------ 01 frasco\nAplicar 1 g, via endovenosa.\nInfundir em 15 minutos.\n\nOrientações\n- Manter jejum até definição da conduta.\n\nRetorno ao PS, se:\n- Dor intensa.\n- Febre persistente ou recorrente.\n- Vômitos persistentes.\n- Sonolência excessiva.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-abdominal-suspeita-de-abdome-agudo"}, {"id": "dor-abdominal-refrataria", "nome": "Dor abdominal refratária", "cid": "R10.4", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "NO PS\n\nUSO ENDOVENOSO\n\n1) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%.\nAplicar 2 mg, via endovenosa lenta.\nRepetir a cada 5 a 10 minutos at "tontura-sindrome-vestibular"}, {"id": "tromboembolismo-pulmonar-tep", "nome": "Tromboembolismo pulmonar (TEP)", "cid": "I26.9", "categoria": "pneumologia", "abas": [{"nome": "Baixo risco", "texto": "NO PS\n\nUSO ORAL\n\n1) Rivaroxabana 15 mg [Xarelto®] ------------------------ 01 comprimido\nAdministrar 1 comprimido, via oral, de 12/12 horas, junto com alimentos.\n\nUSO SUBCUTÂNEO\n\n2) Enoxaparina 80 mg/0,8 mL [Clexane®] ------------------------ 01 seringa pré-enchida\nAplicar 80 mg, via subcutânea, dose única.\n\nSe ClCr < 30 mL/min:\n\n3) Enoxaparina 80 mg/0,8 mL [Clexane®] ------------------------ 01 seringa pré-enchida\nAplicar 80 mg, via subcutânea, 1 vez ao dia.\n\nOU\nUSO ENDOVENOSO\n\n4) Heparina Não Fracionada 5.000 UI/mL [Hemofol®] ------------------------ 01 frasco\nAplicar bólus de 5.000 UI, via endovenosa.\nApós, iniciar infusão contínua conforme protocolo institucional.\n\nUSO INALATÓRIO\n\n5) Oxigênio suplementar ------------------------ Conforme necessidade\nAdministrar por cateter nasal, de 2 a 5 L/min, para manter saturação adequada.\n\nOrientações\n- Não interromper anticoagulante sem orientação médica.\n- Evitar anti-inflamatórios.\n- Evitar esportes de contato.\n- Informar uso de anticoagulante em qualquer atendimento médico.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Dor torácica.\n- Tosse com sangue.\n- Sangramento.\n- Tontura ou desmaio.\n- Piora importante do estado geral."}, {"nome": "Risco intermediário", "texto": "NO PS\n\nUSO INALATÓRIO\n\n1) Oxigênio suplementar ------------------------ Conforme necessidade\nAdministrar para manter saturação adequada.\n\nUSO ORAL\n\n2) Rivaroxabana 15 mg [Xarelto®] ------------------------ 01 comprimido\nAdministrar 1 comprimido, via oral, de 12/12 horas, junto com alimentos.\n\nUSO SUBCUTÂNEO\n\n3) Enoxaparina 80 mg/0,8 mL [Clexane®] ------------------------ 01 seringa pré-enchida\nAplicar 80 mg, via subcutânea, dose única.\n\nSe ClCr < 30 mL/min:\n\n4) Enoxaparina 80 mg/0,8 mL [Clexane®] ------------------------ 01 seringa pré-enchida\nAplicar 80 mg, via subcutânea, 1 vez ao dia.\n\nOU\nUSO ENDOVENOSO\n\n5) Heparina Não Fracionada 5.000 UI/mL [Hemofol®] ------------------------ 01 frasco\nAplicar bólus de 5.000 UI, via endovenosa.\nApós, iniciar infusão contínua conforme protocolo institucional."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-toracica-precordialgia-aguda"}, {"id": "trombose-venosa-profunda-tvp", "nome": "Trombose venosa profunda (TVP)", "cid": "I80.2", "categoria": "cardiologia", "abas": [{"nome": "Receita", "texto": "NO PS\n\nUSO ORAL\n\n1) Rivaroxabana 15 mg [Xarelto®] ------------------------ 01 comprimido\nAdministrar 1 comprimido, via oral, de 12/12 horas, junto com alimentos.\n\nUSO SUBCUTÂNEO\n\n2) Enoxaparina 80 mg/0,8 mL [Clexane®] ------------------------ 01 seringa pré-enchida\nAplicar 80 mg, via subcutânea, dose única.\n\nSe ClCr < 30 mL/min:\n\nUSO SUBCUTÂNEO\n\n3) Enoxaparina 80 mg/0,8 mL [Clexane®] ------------------------ 01 seringa pré-enchida\nAplicar 80 mg, via subcutânea, 1 vez ao dia.\n\nOU\nUSO ENDOVENOSO\n\n4) Heparina Não Fracionada 5.000 UI/mL [Hemofol®] ------------------------ 01 frasco\nAplicar bólus de 5.000 UI, via endovenosa.\nApós, iniciar infusão contínua conforme protocolo institucional.\n\nUSO ENDOVENOSO\n\n5) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, dose única.\nPode repetir de 6/6 horas, se dor.\n\nOrientações\n- Não massagear o membro acometido.\n- Evitar imobilização prolongada.\n- Manter uso regular do anticoagulante.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Dor torácica.\n- Tosse com sangue.\n- Sangramento.\n- Tontura ou desmaio.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-e-edema-em-membro-inferior"}, {"id": "hemoptise", "nome": "Hemoptise", "cid": "R04.2", "categoria": "pneumologia", "abas": [{"nome": "Receita", "texto": "HEMOPTISE LEVE (<30 mL/24h)\n\nUSO INALATÓRIO\n\n1) Ácido Tranexâmico 500 mg/5 mL [Transamin®] ------------------------ 01 ampola\nNebulizar 500 mg diluído em 5 mL de SF 0,9%.\nRepetir de 8/8 horas, conforme necessidade.\nPreferir a via nebulizada devido à maior taxa de cessação do sangramento e menor necessidade de procedimentos invasivos.\n\nUSO INALATÓRIO\n\n2) Oxigênio suplementar ------------------------ Conforme necessidade\nAdministrar por cateter nasal, de 2-5 L/min, se SatO₂ < 92%.\nObjetivo: manter SatO 2 entre 92-96%.\n\nPARA CASA\n\nUSO ORAL\n\n3) Ácido Tranexâmico 250 mg [Transamin®] ------------------------ 24 comprimidos\nTomar 2 comprimidos (500 mg), via oral, de 8/8 horas, por 3 a 5 dias.\n\nEvitar se:\n- Trombose venosa recente.\n- Trombose arterial recente.\n- Coagulação intravascular disseminada.\n- Hematúria macroscópica.\n\nOrientações\n- Evitar esforço físico intenso.\n- Evitar tabagismo.\n- Não utilizar anti-inflamatórios sem orientação médica.\n- Procurar acompanhamento para investigação da causa do sangramento.\n\nRetorno ao PS, se:\n- Aumento do volume de sangue.\n- Falta de ar.\n- Dor torácica.\n- Tontura ou desmaio.\n- Febre persistente ou recorrente.\n- Piora importante do estado geral.\nHEMOPTISE MODERADA (30-200 mL/24h)\n\nNO PS\n\nUSO ENDOVENOSO\n\n1) Ácido Tranexâmico 1 g [Transamin®] ------------------------ 02 ampolas\nAplicar 1 g, via endovenosa.\nDiluir em 100 mL de SF 0,9%.\nInfundir em 10 minutos.\nDose de ataque única.\n\nUSO INALATÓRIO\n\n2) Ácido Tranexâmico 500 mg/5 mL [Transamin®] ------------------------ 01 ampola\nNebulizar 500 mg diluído em 5 mL de SF 0,9%.\nRepetir de 8/8 horas.\n\n3) Oxigênio suplementar ------------------------ Conforme necessidade\nAdministrar por cateter nasal, de 2-5 L/min, se SatO₂ < 92%.\nObjetivo: manter SatO₂ entre 92-96%.\n\nOrientações\n- Preferir internação hospitalar para investigação etiológica.\n- Manter repouso relativo.\n- Evitar esforço físico.\n\nRetorno ao PS, se:\n- Aumento do sangramento.\n- Falta de ar.\n- Dor torácica.\n- Tontura ou desmaio.\n- Sonolência excessiva.\n- Piora importante do estado geral."}, {"nome": "Associada à tosse irritativa", "texto": "PARA CASA\n\nUSO ORAL\n\n1) Dextrometorfano 15 mg [Bisoltussin®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tosse seca intensa, por até 3 dias.\nPreferir ao uso de codeína pelo melhor perfil de segurança.\n\nOrientações\n- Manter hidratação adequada.\n- Evitar tabagismo e exposição à fumaça.\n- Evitar esforços físicos intensos.\n\nRetorno ao PS, se:\n- Sangramento persistente ou recorrente.\n- Falta de ar.\n- Dor torácica.\n- Febre persistente ou recorrente.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "hemoptise"}, {"id": "solucos-persistentes", "nome": "Soluços persistentes", "cid": "R06.6", "categoria": "clinica-geral", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Metoclopramida 10 mg [Plasil®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 5 dias.\n\n2) Omeprazol 20 mg [Losec®] ------------------------ 14 cápsulas\nTomar 1 cápsula, via oral, em jejum, 1 vez ao dia, por 14 dias.\n\nOrientações\n- Fracionar as refeições em pequenos volumes.\n- Evitar bebidas gaseificadas e álcool.\n- Evitar refeições volumosas, alimentos muito condimentados e excesso de cafeína.\n- Manter hidratação adequada.\n- Evitar deitar-se logo após as refeições.\n- Procurar assistência médica caso os soluços persistam apesar do tratamento.\n\nRetorno ao PS, se:\n- Persistência dos soluços por mais de 48 horas ou piora dos sintomas.\n- Incapacidade de ingerir alimentos ou líquidos.\n- Vômitos persistentes.\n- Dor torácica ou abdominal intensa.\n- Falta de ar.\n- Alteração do estado de consciência.\n- Fraqueza importante ou déficit neurológico.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "queixa-inespecifica-sem-sinais-de-alarme"}, {"id": "espasmos-musculares", "nome": "Espasmos musculares", "cid": "M62.8", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\n\nEm caso de dor, tomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\n2) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\nOrientações\n- Manter repouso relativo da musculatura acometida nas primeiras 24 a 48 horas.\n- Realizar alongamentos leves conforme melhora da dor.\n- Aplicar compressas mornas por 15 a 20 minutos, 3 a 4 vezes ao dia.\n- Manter hidratação adequada.\n- Evitar esforços físicos intensos até melhora dos sintomas.\n- Não dirigir veículos ou operar máquinas durante o uso da ciclobenzaprina devido ao risco de sonolência.\n- Evitar consumo de bebidas alcoólicas durante o tratamento.\n\nRetorno ao PS, se:\n- Dor intensa ou progressiva.\n- Fraqueza muscular importante.\n- Perda de sensibilidade no membro acometido.\n- Incapacidade de movimentar o membro.\n- Febre persistente ou recorrente.\n- Inchaço importante, vermelhidão ou calor local.\n- Perda do controle urinário ou intestinal.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "hipercalemia", "nome": "Hipercalemia", "cid": "E87.5", "categoria": "emergencia", "abas": [{"nome": "No PS", "texto": "K+ 5,5–6,4 mEq/L SEM ALTERAÇÕES NO ECG\n\nNO PS\n\nUSO ENDOVENOSO\n\n1) SF 0,9% ------------------------ 500 mL\nInfundir 250 a 500 mL, via endovenosa, em 1 a 2 horas, se hipovolemia.\n\n2) Insulina Regular 100 UI/mL------------------------ 01 frasco\nAplicar 10 UI, via endovenosa, em bólus.\n\n+\n\n3) Glicose 50% [Isofarma®] ------------------------ 02 ampolas\nAplicar 50 mL, via endovenosa, imediatamente após a insulina.\n\nUSO INALATÓRIO\n\n4) Salbutamol spray 100 mcg/dose [Aerolin®] ------------------------ 01 frasco\nFazer 10 a 20 jatos, via inalatória, utilizando espaçador.\n\nOrientações\n- Manter monitorização cardíaca.\n- Repetir potássio sérico após tratamento.\n\nRetorno ao PS, se:\n- Fraqueza muscular.\n- Palpitações.\n- Dor torácica.\n- Piora importante do estado geral.\nK+ ≥ 6,5 mEq/L OU ALTERAÇÕES NO ECG\n\nNO PS\n\nUSO ENDOVENOSO\n\n1) Gluconato de Cálcio 10%------------------------ 02 ampolas\nAplicar 10 a 20 mL, via endovenosa lenta, em 2 a 5 minutos.\nPode repetir após 5 a 10 minutos.\n\n2) Insulina Regular 100 UI/mL------------------------ 01 frasco\nAplicar 10 UI, via endovenosa, em bólus.\n\n3) Glicose 50% ------------------------ 02 ampolas\nAplicar 50 mL, via endovenosa, imediatamente após a insulina.\n\nUSO INALATÓRIO\n\n4) Salbutamol spray 100 mcg/dose [Aerolin®] ------------------------ 01 frasco\nFazer 10 a 20 jatos, via inalatória, utilizando espaçador.\n\nSe acidose metabólica:\n\nUSO ENDOVENOSO\n\n5) Bicarbonato de Sódio 8,4% ------------------------ 02 ampolas\nAdministrar 50 a 100 mEq, via endovenosa.\nDiluir em 100 a 150 mL de SF 0,9%.\nInfundir em 30 a 60 minutos.\n\nOrientações\n- Manter monitorização cardíaca contínua.\n- Repetir eletrólitos após tratamento.\n\nRetorno ao PS, se:\n- Palpitações.\n- Fraqueza muscular.\n- Dor torácica.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "alteracao-laboratorial-disturbio-hidroeletrolitico"}, {"id": "hipocalemia", "nome": "Hipocalemia", "cid": "E87.6", "categoria": "emergencia", "abas": [{"nome": "No PS", "texto": "K+ 3,0–3,4 mEq/L\n\nUSO ORAL\n\n1) Cloreto de Potássio 600 mg (8 mEq) [Slow-K®] ------------------------ 30 comprimidos\nTomar 2 comprimidos, via oral, de 8/8 horas, por 3 a 5 dias.\n\nOrientações\n- Manter hidratação adequada.\n- Realizar reavaliação laboratorial.\n\nRetorno ao PS, se:\n- Fraqueza muscular.\n- Palpitações.\n- Câimbras intensas.\n- Piora importante do estado geral.\nK+ 2,5–2,9 mEq/L\n\nNO PS\n\nUSO ENDOVENOSO\n\n1) Cloreto de Potássio 19,1% (2 mEq/mL) ------------------------ 02 ampolas\nAdministrar 20 a 40 mEq.\nDiluir em 500 mL de SF 0,9%.\nInfundir em 4 a 6 horas.\n\nOrientações\n- Manter monitorização cardíaca.\n\nRetorno ao PS, se:\n- Palpitações.\n- Fraqueza muscular.\n- Dor torácica.\n- Piora importante do estado geral.\nK+ < 2,5 mEq/L OU ECG ALTERADO\n\nNO PS\n\nUSO ENDOVENOSO\n\n1) Cloreto de Potássio 19,1% (2 mEq/mL) [Isofarma®] ------------------------ 04 ampolas\nDiluir 40 mL em 500 mL de SF 0,9%.\nInfundir em 4 horas.\n\nSe arritmia ventricular ou paralisia muscular:\n\n2) Cloreto de Potássio 19,1% (2 mEq/mL) ------------------------ 01 ampola\nDiluir 5 mL em 100 mL de SF 0,9%.\nInfundir em 15 a 30 minutos.\nPode repetir conforme resposta clínica.\n\nSe hipomagnesemia associada:\n\n3) Sulfato de Magnésio 10% ------------------------ 02 ampolas\nDiluir 20 mL em 80 mL de SF 0,9%.\nInfundir em 1 hora.\n\nOrientações\n- Manter monitorização cardíaca contínua.\n\nRetorno ao PS, se:\n- Palpitações.\n- Fraqueza muscular.\n- Dor torácica.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "alteracao-laboratorial-disturbio-hidroeletrolitico"}, {"id": "hiponatremia", "nome": "Hiponatremia", "cid": "E87.1", "categoria": "emergencia", "abas": [{"nome": "No PS", "texto": "HIPONATREMIA LEVE/MODERADA\n\n1) Restrição hídrica ------------------------ 1.000 a 1.500 mL/dia\nManter até definição etiológica.\n\nHIPONATREMIA GRAVE SINTOMÁTICA\n\nNO PS\n\nUSO ENDOVENOSO\n\n1) Cloreto de Sódio 3% [Halex Istar®] ------------------------ 01 bolsa\nAplicar 100 mL, via endovenosa, em 10 minutos.\n\nOU\nAplicar 150 mL, via endovenosa, em 20 minutos.\nPode repetir até 2 vezes se persistência dos sintomas.\nPersistência dos sintomas:\n\n2) Cloreto de Sódio 3% [Halex Istar®] ------------------------ 01 bolsa\nInfundir em bomba de infusão.\nVelocidade inicial:\n1 a 2 mL/kg/h.\n\nSe correção excessiva:\n\n3) Desmopressina 4 mcg/mL [DDAVP®] ------------------------ 01 ampola\nAplicar 2 a 4 mcg, via endovenosa ou subcutânea.\nPode repetir a cada 8 horas.\n\n4) SG 5% ------------------------ 500 mL\nInfundir, via endovenosa.\n\nOrientações\n- Manter monitorização contínua.\n- Realizar controle seriado do sódio sérico.\n\nRetorno ao PS, se:\n- Convulsões.\n- Sonolência excessiva.\n- Confusão mental.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "alteracao-laboratorial-disturbio-hidroeletrolitico"}, {"id": "hipernatremia", "nome": "Hipernatremia", "cid": "E87.0", "categoria": "emergencia", "abas": [{"nome": "No PS", "texto": "NO PS\n\nHIPERNATREMIA HIPOVOLÊMICA\n\nUSO ENDOVENOSO\n\n1) SF 0,9% ------------------------ 1.000 mL\nInfundir em 30 a 60 minutos.\nPode repetir conforme resposta clínica.\nApós estabilização:\n\n2) SG 5% ------------------------ 500 mL\nInfundir, via endovenosa.\n\nOU\nSF 0,45% ------------------------ 500 mL\nInfundir, via endovenosa.\n\nHIPERNATREMIA EUVOLÊMICA\n\n3) SG 5% ------------------------ 500 mL\nInfundir, via endovenosa.\n\nHIPERNATREMIA POR DIABETES INSIPIDUS CENTRAL\n\n4) Desmopressina 4 mcg/mL [DDAVP®] ------------------------ 01 ampola\nAplicar 1 a 2 mcg, via endovenosa ou subcutânea.\nPode repetir a cada 12 horas.\n\nOrientações\n- Manter hidratação conforme orientação médica.\n- Realizar controle seriado do sódio sérico.\n\nRetorno ao PS, se:\n- Sonolência excessiva.\n- Confusão mental.\n- Convulsões.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "alteracao-laboratorial-disturbio-hidroeletrolitico"}, {"id": "protocolo-de-analgesia", "nome": "Protocolo de analgesia", "cid": "R52", "categoria": "emergencia", "abas": [{"nome": "Dor leve (EVA 1-3)", "texto": "USO ORAL\n\n1) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOU\nParacetamol 750 mg [Tylenol®] ------------------------ 12 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\nMáximo de 3 g por dia.\n\nSe componente inflamatório:\n\n2) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n\nUSO ENDOVENOSO\n\n3) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, em 3 a 5 minutos."}, {"nome": "Dor moderada (EVA 4-6)", "texto": "USO ENDOVENOSO\n\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\n\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg, via endovenosa lenta.\nPersistência da dor:\n\n3) Tramadol 50 mg/mL [Tramal®] ------------------------ 01 ampola\nDiluir em 100 mL de SF 0,9%.\nInfundir, via endovenosa, em 20 minutos.\nPode repetir após 6 horas.\n\nUSO ORAL\n\n1) Paracetamol 1 g [Tylenol®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, agora.\n\n2) Naproxeno 500 mg [Flanax®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, agora.\n\nOrientações\n- Evitar automedicação com múltiplos analgésicos.\n- Evitar uso prolongado de anti-inflamatórios.\n- Manter hidratação adequada.\n\nRetorno ao PS, se:\n- Dor intensa.\n- Febre persistente ou recorrente.\n- Náuseas ou vômitos persistentes.\n- Sonolência excessiva.\n- Piora importante do estado geral."}, {"nome": "Dor intensa (EVA 7-10)", "texto": "USO ENDOVENOSO\n\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\n\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\n3) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%.\nAplicar 2 mg, via endovenosa lenta.\nRepetir 2 mg a cada 5 a 10 minutos até analgesia adequada.\n\nOU\nFentanil 50 mcg/mL [Fentanest®] ------------------------ 01 ampola\nAplicar 50 mcg, via endovenosa lenta.\nPode repetir após 5 minutos.\nDose habitual: 50 a 100 mcg.\nPreferir em:\n- Trauma.\n- Instabilidade hemodinâmica.\n- Insuficiência renal.\n- Idosos frágeis.\n\nOrientações\n- Permanecer em observação após uso de opioides.\n- Evitar dirigir ou operar máquinas após alta.\n\nRetorno ao PS, se:\n- Sonolência excessiva.\n- Falta de ar.\n- Dor intensa persistente.\n- Náuseas ou vômitos persistentes.\n- Piora importante do estado geral."}, {"nome": "Náuseas e vômitos", "texto": "USO ENDOVENOSO\n\n1) Ondansetrona 8 mg/4 mL [Vonau®] ------------------------ 01 ampola\nAplicar 8 mg, via endovenosa lenta.\n\nOU\nMetoclopramida 10 mg/2 mL [Plasil®] ------------------------ 01 ampola\nDiluir em 10 mL de SF 0,9%.\nAplicar, via endovenosa, lentamente em 2 a 3 minutos.\nNáusea vestibular:\n\n1) Dimenidrinato 50 mg + Piridoxina 10 mg [Dramin B6®] ------------------------ 01 ampola\nAplicar, via endovenosa lenta, dose única.\nNáusea refratária:\n\n1) Haloperidol 5 mg/mL [Haldol®] ------------------------ 01 ampola\nDiluir 0,5 mL (2,5 mg) em 10 mL de SF 0,9%.\nAplicar, via endovenosa lenta.\n\nOrientações\n- Manter hidratação adequada.\n- Preferir dieta leve até melhora dos sintomas.\n\nRetorno ao PS, se:\n- Vômitos persistentes.\n- Incapacidade de ingerir líquidos.\n- Sonolência excessiva.\n- Dor abdominal intensa.\n- Piora importante do estado geral."}, {"nome": "AINEs no PS", "texto": "USO ORAL\n\n1) Cetoprofeno 100 mg [Profenid®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por até 5 dias.\n\n2) Tenoxicam 20 mg [Tilatil®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por até 5 dias.\n\n3) Cetorolaco 10 mg [Toragesic®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\nMáximo de 40 mg por dia, por no máximo 5 dias.\n\n4) Diclofenaco Potássico 50 mg [Cataflam®] ------------------------ 15 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por até 5 dias.\n\nOU\nDiclofenaco Sódico 50 mg [Voltaren®] ------------------------ 15 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por até 5 dias.\n\n5) Celecoxibe 200 mg [Celebra®] ------------------------ 10 cápsulas\nTomar 1 cápsula, via oral, de 12/12 horas, por até 5 dias.\n\nOU\nTomar 1 cápsula, via oral, 1 vez ao dia, por até 7 dias.\n\n6) Ibuprofeno 400 mg [Alivium®] ------------------------ 15 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, após as refeições, por até 5 dias.\n\n7) Naproxeno Sódico 550 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por até 5 dias.\n\nUSO ENDOVENOSO\n\n8) Cetoprofeno 100 mg/2 mL [Profenid®] ------------------------ 01 ampola\nAplicar 100 mg, via endovenosa.\nDiluir em 100 mL de SF 0,9%.\nInfundir em 20 a 30 minutos.\nPode repetir de 12/12 horas.\n\n9) Tenoxicam 20 mg [Tilatil®] ------------------------ 01 frasco-ampola\nAplicar 20 mg, via endovenosa lenta.\nDiluir conforme fabricante.\nPode repetir 1 vez ao dia.\n\n10) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg, via endovenosa lenta.\nPode repetir de 6/6 horas.\nDose máxima:\n- Adultos menores de 65 anos: 120 mg por dia.\n- Adultos com 65 anos ou mais: 60 mg por dia.\n- Insuficiência renal: 60 mg por dia.\nTempo máximo de uso: 5 dias.\n\n11) Diclofenaco Sódico 75 mg/3 mL [Voltaren®] ------------------------ 01 ampola\nAplicar 75 mg, via endovenosa.\nDiluir em 100 mL de SF 0,9% ou SG 5%.\nInfundir em 30 minutos.\nPode repetir após 12 horas.\nDose máxima: 150 mg por dia.\n\nNÃO FAZER\n❌ Associar dois AINEs simultaneamente.\n❌ Prescrever cetorolaco por mais de 5 dias.\n❌ Utilizar opioide isoladamente sem analgesia multimodal.\n❌ Administrar morfina em bolus rápido.\n❌ Prescrever tramadol em pacientes com epilepsia ou uso de ISRS/ISRSN sem cautela."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-aguda-intensa"}, {"id": "tungiase-bicho-de-pe", "nome": "Tungíase (bicho-de-pé)", "cid": "B88.1", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Ivermectina 6 mg [Revectina®] ------------------------ 04 comprimidos\nTomar 2 comprimidos, via oral, em dose única.\nRepetir 2 comprimidos, via oral, após 7 dias, caso mantenha o quadro.\n\nOrientações\n- Usar calçados fechados em locais contaminados.\n- Utilizar repelentes à base de óleo de coco, 2 vezes ao dia.\n- Evitar manipular as lesões.\n- Manter os pés limpos e secos.\n\nRetorno ao PS, se:\n- Dor intensa.\n- Surgimento de feridas.\n- Presença de pus local.\n- Vermelhidão extensa.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "prurido-lesoes-pruriginosas"}, {"id": "aftas-lesoes-aftosas", "nome": "Aftas / lesões aftosas", "cid": "K12.0", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n\n1) Triancinolona acetonida 1 mg/g [Omcilon-A Orabase®] ------------------------ 01 bisnaga\nAplicar fina camada sobre a lesão, via tópica, preferencialmente à noite, antes de dormir.\nAplicar a cada 8 horas, por 7 dias, após as refeições.\n\nUSO ORAL\n\n2) Prednisolona 20 mg [Predsim®] ------------------------ 05 comprimidos\nSomente em caso de múltiplas lesões intensas.\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n\nOrientações\n- Fazer higiene oral com escova macia.\n- Evitar trauma local.\n- Evitar alimentos e bebidas ácidas.\n- Evitar limão, refrigerantes e café enquanto houver dor.\n\nRetorno ao PS, se:\n- Dificuldade para alimentação.\n- Lesões extensas.\n- Febre persistente ou recorrente.\n- Ausência de melhora.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "faringite-faringoamigdalite-aguda"}, {"id": "delirium-confusao-mental-aguda-no-idoso", "nome": "Delirium / confusão mental aguda no idoso", "cid": "F05.9", "categoria": "emergencia", "abas": [{"nome": "Fase 1 — medidas iniciais", "texto": "1) SF 0,9% ------------------------ 500 mL\nCorrer, via endovenosa, em 30-60 minutos.\nRepetir conforme volemia e comorbidades.\n\n2) Glicose 50% ------------------------ 01 ampola\nAplicar 20-40 mL, via endovenosa, em bólus.\nSomente se glicemia < 70 mg/dL.\n\n3) Tiamina 100 mg/mL ------------------------ 01 ampola\nAplicar 100 mg, via endovenosa lenta, dose única.\nPreferencialmente antes da glicose em alcoólatras ou desnutridos."}, {"nome": "Fase 2 — agitação leve a moderada", "texto": "USO ORAL\n\n1) Quetiapina 25 mg [Seroquel®] ------------------------ 30 comprimidos\nTomar 12,5-25 mg, via oral.\nPode repetir a cada 8-12 horas.\nDose inicial máxima: 50 mg/dia.\n\nOU\nRisperidona 1 mg [Risperdal®] ------------------------ 30 comprimidos\nTomar 0,25-0,5 mg, via oral.\nPode repetir a cada 12 horas.\nDose usual: 0,5-2 mg/dia.\n\nOU\nOlanzapina 5 mg [Zyprexa®] ------------------------ 30 comprimidos\nTomar 2,5-5 mg, via oral.\nDose máxima inicial: 10 mg/dia.\n\nUSO ENDOVENOSO\n\n2) Haloperidol 5 mg/mL [Haldol®] ------------------------ 01 ampola\nDiluir 0,5 mL em 10 mL de SF 0,9%.\nAplicar 0,5-1 mg, via endovenosa lenta.\nPode repetir a cada 20-30 minutos."}, {"nome": "Fase 3 — agitação importante", "texto": "USO INTRAMUSCULAR\n\n1) Olanzapina 10 mg [Zyprexa IM®] ------------------------ 01 ampola\nAplicar 2,5-5 mg, via intramuscular.\nPode repetir após 2 horas.\nDose máxima: 10 mg/dia.\n\nOU\nHaloperidol 5 mg/mL [Haldol®] ------------------------ 01 ampola\nAplicar 0,5-2 mg, via intramuscular.\nPode repetir após 30-60 minutos.\nAssociação para agitação grave:\n\n2) Haloperidol 5 mg/mL [Haldol®] ------------------------ 01 ampola\nAplicar 0,5-1 mg, via intramuscular.\n\n3) Lorazepam 2 mg/mL [Lorax®] ------------------------ 01 ampola\nAplicar 0,5-1 mg, via intramuscular.\nAdministrar simultaneamente.\nPode repetir após 30-60 minutos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "agitacao-psicomotora"}, {"id": "crise-tireotoxica-tempestade-tireoidiana", "nome": "Crise tireotóxica (tempestade tireoidiana)", "cid": "E05.5", "categoria": "endocrinologia", "abas": [{"nome": "No PS", "texto": "1) Monitorização contínua (ECG, oximetria e pressão arterial) + dois acessos venosos periféricos calibrosos.\n\n2) SF 0,9% ------------------------ 1000 mL\nInfundir 500–1000 mL EV na primeira hora. Reavaliar volemia, diurese e função cardíaca antes de novas infusões.\n\n3) Paracetamol 500 mg [Tylenol®] ------------------------ 20 comprimidos\n\nEm caso de febre, administrar 500–1000 mg VO de 6/6 horas, se necessário.\nEvitar AAS, pois aumenta a fração livre dos hormônios tireoidianos.\n\n4) Propranolol 40 mg [Inderal®] ------------------------ 30 comprimidos\nAdministrar 40–80 mg VO a cada 4–6 horas, titulando para frequência cardíaca <100 bpm, se não houver contraindicações.\n\nSe via oral inviável:\nPropranolol 1 mg EV lento, repetindo 1 mg a cada 10–15 minutos até controle da frequência cardíaca (máximo 5 mg), sob monitorização contínua.\n\nSe contraindicação ao propranolol (asma grave, broncoespasmo ou IC agudamente descompensada):\nEsmolol EV em infusão contínua, titulado conforme frequência cardíaca.\n\n5) Propiltiouracil 100 mg ------------------------ 100 comprimidos\nAdministrar 500–1000 mg VO (dose de ataque), seguido de 250 mg VO a cada 4 horas.\n\nSe PTU indisponível:\nMetimazol 10 mg [Tapazol®]\nAdministrar 20 mg VO a cada 4–6 horas (dose total diária de 40–60 mg).\nUma hora após a primeira dose do antitireoidiano:\n\n6) Lugol 5% ------------------------ 01 frasco\nAdministrar 8–10 gotas VO a cada 6 horas.\n\nOU\nIodeto de Potássio Saturado (SSKI) ------------------------ 01 frasco\nAdministrar 5 gotas VO a cada 6 horas.\n\n7) Hidrocortisona 100 mg ------------------------ 04 frascos-ampola\nAdministrar 100 mg EV imediatamente, seguido de 100 mg EV a cada 8 horas.\nAlternativa:\nDexametasona 4 mg/mL ------------------------ 04 ampolas\nAdministrar 2 mg EV a cada 6 horas.\n\n8) Tratar imediatamente o fator desencadeante (infecção, suspensão de antitireoidiano, IAM, TEP, AVC, cetoacidose, trauma, cirurgia, entre outros).\n\n9) Oxigenoterapia se houver hipoxemia.\n\n10) Controle rigoroso de temperatura com medidas físicas (compressas frias, cobertores térmicos resfriados, ambiente climatizado).\n\n11) Solicitar imediatamente:\n- Hemograma.\n- Eletrólitos.\n- Função renal.\n- Função hepática.\n- Glicemia.\n- Gasometria.\n- TSH, T4 livre e T3.\n- ECG.\n- Radiografia de tórax.\n- Exames direcionados conforme suspeita do fator precipitante.\n\n12) Internação imediata em UTI.\n\nSe refratária apesar da terapia máxima:\n\n13) Colestiramina 4 g ------------------------ 20 sachês\nAdministrar 4 g VO a cada 6 horas.\n\n14) Acionar Endocrinologia e Cirurgia para avaliação de plasmaférese e tireoidectomia de urgência em casos refratários."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "palpitacoes-taquicardia"}, {"id": "crise-algica-anemia-falciforme", "nome": "Crise álgica — anemia falciforme", "cid": "D57.0", "categoria": "hematologia", "abas": [{"nome": "No PS", "texto": "NO PS\n- Administrar a primeira dose de opioide em até 30-60 minutos da chegada.\n- Preferir dose individualizada conforme histórico prévio de analgesia.\n- Reavaliar a dor a cada 15-30 minutos.\n\nDOR LEVE (EVA 1-3)\n\nUSO ENDOVENOSO\n\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\nPode repetir de 6/6 horas.\n\nOU\nUSO ORAL\n\n2) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n\nDOR MODERADA (EVA 4-6)\n\nUSO ENDOVENOSO\n\n3) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 5 mg em 9 mL de SF 0,9%.\nAplicar 2-5 mg, via endovenosa lenta.\nReavaliar após 15-20 minutos.\nDose inicial: 0,1 mg/kg, via endovenosa, se não houver plano analgésico prévio.\nAssociar:\n\n4) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, de 6/6 horas.\n\n5) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg, via endovenosa lenta.\nDose máxima: 120 mg/dia.\n\nDOR INTENSA (EVA 7-10)\n\nUSO ENDOVENOSO\n\n6) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 10 mg em 9 mL de SF 0,9%.\nAplicar 5-10 mg, via endovenosa lenta.\nReavaliar após 15-20 minutos.\nDose inicial: 0,1-0,15 mg/kg, via endovenosa.\n\nSe dor persistente:\n\n7) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nAplicar 2-5 mg, via endovenosa lenta.\nPode repetir a cada 15-30 minutos até analgesia adequada.\nAssociar:\n\n8) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, de 6/6 horas.\n\n9) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg, via endovenosa lenta, de 8/8 horas.\n\nDOR REFRATÁRIA\n\nUSO ENDOVENOSO\n\n10) Cetamina 50 mg/mL [Ketamin®] ------------------------ 01 ampola\nDiluir em SF 0,9%.\nAplicar 0,1-0,3 mg/kg, via endovenosa, em 10-15 minutos.\nPode repetir conforme resposta clínica.\n\nHIDRATAÇÃO\n\nUSO ENDOVENOSO\n\n11) SF 0,9% [Equiplex®] ------------------------ 500 mL\nCorrer, via endovenosa, em 2-4 horas.\nManutenção:\n\n12) SF 0,9% [Equiplex®] ------------------------ 500 mL\nCorrer, via endovenosa.\nVelocidade: 1-1,5 mL/kg/h.\n\nOXIGÊNIO\n\nUSO INALATÓRIO\n\n13) Oxigênio suplementar ------------------------ Conforme necessidade\nAdministrar somente se:\n- Saturação < 92%.\n- Hipoxemia documentada.\n\nINFECÇÃO OU SÍNDROME TORÁCICA AGUDA\n\nUSO ENDOVENOSO\n\n14) Ceftriaxona 2 g [Rocefin®] ------------------------ 01 frasco-ampola\nDiluir em 100 mL de SF 0,9%.\nInfundir, via endovenosa, em 30 minutos.\nAplicar 2 g, 1 vez ao dia.\n\n15) Azitromicina 500 mg [Zitromax IV®] ------------------------ 01 frasco-ampola\nDiluir em 250 mL de SF 0,9%.\nInfundir, via endovenosa, em 1 hora.\nAplicar 500 mg, 1 vez ao dia.\n\nTRANSFUSÃO SIMPLES\n\n16) Concentrado de Hemácias ------------------------ 01-02 unidades\nTransfundir, via endovenosa.\nIndicações:\n- Queda da hemoglobina maior que 2 g/dL do basal.\n- Hemoglobina menor que 5 g/dL.\n- Anemia aguda sintomática.\n- Crise aplástica.\n- Sequestro esplênico.\nMeta:\n- Não exceder a hemoglobina basa"}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-aguda-intensa"}, {"id": "estado-hiperosmolar-hiperglicemico-ehh", "nome": "Estado hiperosmolar hiperglicêmico (EHH)", "cid": "E11.0", "categoria": "endocrinologia", "abas": [{"nome": "No PS", "texto": "FASE 1 – EXPANSÃO VOLÊMICA\n\n1) SF 0,9% ------------------------ 1.000 mL\nCorrer 1.000 mL, via endovenosa, na primeira hora.\nApós a primeira hora:\n\n2) SF 0,45% ------------------------ 500-1.000 mL\nCorrer 250-500 mL/h, via endovenosa.\nDéficit hídrico estimado: 100-200 mL/kg.\n\nFASE 2 – REPOSIÇÃO DE POTÁSSIO\n\nSe K+ < 3,3 mEq/L:\n\n3) Cloreto de Potássio 19,1% (2 mEq/mL) ------------------------ 03 ampolas\nAdicionar 40-60 mEq em 1 litro de SF.\nCorrer, via endovenosa.\nSuspender insulina até K+ > 3,3 mEq/L.\n\nSe K+ 3,3-5,2 mEq/L:\n\n4) Cloreto de Potássio 19,1% (2 mEq/mL) ------------------------ 02 ampolas\nAdicionar 20-40 mEq em 1 litro de SF.\nCorrer, via endovenosa.\n\nSe K+ > 5,2 mEq/L:\nNão repor potássio inicialmente.\n\nFASE 3 – INSULINOTERAPIA\n\n5) Insulina Regular 100 UI/mL ------------------------ 01 frasco\nDiluir 50 UI em 50 mL de SF 0,9%.\nCorrer, via endovenosa, em bomba de infusão contínua.\nVelocidade inicial: 0,05 UI/kg/h.\n\nFASE 4 – QUANDO GLICEMIA < 300 mg/dL\n\n6) SG 5% ------------------------ 500 mL\nAssociar ao soro em infusão endovenosa.\n\n7) Insulina Regular 100 UI/mL ------------------------ 01 frasco\nManter infusão endovenosa.\nReduzir para 0,02-0,05 UI/kg/h.\n\nFASE 5 – TRANSIÇÃO PARA INSULINA SC\n\n8) Insulina Glargina 100 UI/mL [Lantus®] ------------------------ 01 caneta\nAplicar 0,2-0,3 UI/kg, via subcutânea, 1 vez ao dia.\nAdministrar 2-4 horas antes de suspender a insulina endovenosa.\n\n9) Insulina Aspart 100 UI/mL [NovoRapid®] ------------------------ 01 caneta\nAplicar 0,05-0,1 UI/kg, via subcutânea, antes das refeições.\nManter insulina endovenosa por 30-60 minutos após a primeira dose."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "hiperglicemia-descompensacao-diabetica-leve"}, {"id": "delirium-tremens", "nome": "Delirium tremens", "cid": "F10.4", "categoria": "saude-mental", "abas": [{"nome": "No PS", "texto": "NO PS\n\nUSO ENDOVENOSO\n\n1) Diazepam 10 mg/2 mL [Diazepam Hipolabor®] ------------------------ Doses repetidas\nAdministrar 10 a 20 mg, via endovenosa.\nRepetir a cada 5 a 15 minutos conforme resposta clínica.\nObjetivos:\n- Sedação leve.\n- Controle autonômico.\n- Prevenção de convulsões.\nCasos refratários:\n\n2) Fenobarbital 100 mg/mL [Gardenal®] ------------------------ Conforme protocolo institucional\nUtilizar somente com monitorização contínua e suporte avançado."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "agitacao-psicomotora"}, {"id": "agitacao-psicomotora-contencao-quimica", "nome": "Agitação psicomotora / contenção química", "cid": "R45.1", "categoria": "emergencia", "abas": [{"nome": "No PS", "texto": "USO INTRAMUSCULAR\n\n1) Haloperidol 5 mg/mL [Haldol®] ------------------------ 01 ampola\nAplicar 5 mg, via intramuscular, dose única.\n-\n\n2) Prometazina 25 mg/mL [Fenergan®] ------------------------ 01 ampola\nAplicar 25 mg, via intramuscular, dose única.\n\nSe suspeita de intoxicação por cocaína, crack, anfetaminas ou MDMA:\n\n3) Midazolam 5 mg/mL [Dormonid®] ------------------------ 01 ampola\nAplicar 5 mg, via intramuscular.\n\nSe agitação intensa:\nAplicar 10 mg, via intramuscular."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "agitacao-psicomotora"}, {"id": "doenca-hemorroidaria", "nome": "Doença hemorroidária", "cid": "K64.9", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO / ANAL\n\n1) Policresuleno + Cloridrato de Cinchocaína (Proctyl®) ------------------------- 1 pomada\nAplicar até 3 vezes ao dia, em região anal, por 7 dias.\nSeguir as orientações da bula para aplicação correta.\n\n2) Banho em assento com água morna\nRealizar 2 a 3 vezes por dia, após as evacuações.\nColocar água morna em uma bacia e sentar-se nu, permitindo que a água entre em contato com a lesão por pelo menos 15 minutos ou até esfriar.\n\nUSO ORAL\n\n3) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nOrientações\n- Evitar o uso de papel higiênico. Lave-se durante o banho ou com ducha higiênica.\n- Evitar esforço evacuatório intenso, assim como ficar longos períodos sentado no vaso sanitário.\n- Fazer dieta rica em fibras: frutas, verduras e grãos integrais.\n- Evitar alimentos condimentados: pimenta, chocolate e frituras.\n- Se houver sangramento, geralmente este é autolimitado, sendo necessário somente compressão local por alguns minutos.\n\nRetorne em caso de:\n- Sangramento de grande volume ou com aspecto de sangue escuro (\"borra de café\").\n- Dor abdominal intensa.\n- Febre.\n- Calafrios.\n- Piora do estado geral.\n- Queda na pressão, tonturas ou mal-estar.\n- Dor anal intensa que não melhora com as medicações prescritas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-anal-doenca-orificial"}, {"id": "violencia-sexual-profilaxias", "nome": "Violência sexual — profilaxias", "cid": "T74.2", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "*(Complementa a seção de PEP já existente no guia)*\nConduta: PS\nProfilaxia HIV\n\n1) Tenofovir/Lamivudina (TDF/3TC) 300 mg/300 mg ------------------------- 28 comprimidos\nTomar 1 comprimido, via oral, uma vez ao dia, por 28 dias.\n\n2) Dolutegravir (DTG) 50 mg ------------------------- 28 comprimidos\nTomar 1 comprimido, via oral, uma vez ao dia, por 28 dias.\nTomar junto com a medicação acima.\n\n3) Ceftriaxona 500 mg ------------------------ 1 ampola\nDiluir em 2 mL de lidocaína 1%.Aplicar 500 mg IM, dose única.\n\n4) Doxiciclina 100 mg ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\n5) Penicilina G Benzatina 1.200.000 UI ------------------------ 2 ampolas\nAplicar 2.400.000 UI, via IM. Administrar 1.200.000 UI em cada glúteo, dose única.\n\n6) Metronidazol 500 mg ------------------------ 4 comprimidos\nTomar 4 comprimidos (2 g), via oral, dose única.\nAvaliar conforme quadro clínico.\nContracepção de Emergência\n\n1) Levonorgestrel 1,5 mg ------------------------ 1 comprimido\nTomar dose única, via oral, o quanto antes.\nAvaliar a possibilidade de gravidez precoce antes de administrar.\nVacina e Imunoglobulina contra Hepatite B\n\nSe esquema vacinal incompleto ou desconhecido:\n- Iniciar esquema vacinal contra hepatite B.\n- Associar imunoglobulina específica, conforme protocolo institucional.\n\nOrientações\n- Realizar acolhimento em ambiente reservado e sem julgamentos.\n- A vítima não é obrigada a registrar boletim de ocorrência para receber atendimento médico.\n- Realizar notificação compulsória (SINAN) em todos os casos.\n- Comunicar o Conselho Tutelar se vítima menor de 18 anos.\n- Encaminhar para acompanhamento psicossocial e infectológico.\n- Solicitar sorologias para:\n- HIV;\n- Sífilis;\n- Hepatite B;\n- Hepatite C.\n- Programar reavaliação e repetição das sorologias em 30, 90 e 180 dias.\nNão dar alta sem:\n- Iniciar profilaxias indicadas.\n- Orientar retorno ambulatorial.\n- Garantir seguimento adequado.\n- Registrar detalhadamente os achados em prontuário."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "exposicao-de-risco-profilaxia"}, {"id": "urgencia-hipertensiva", "nome": "Urgência hipertensiva", "cid": "I10", "categoria": "cardiologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Captopril 50 mg [Capoten®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, dose única.\n\nOrientações\n- Fazer repouso relativo.\n- Reduzir ingestão de sal.\n- Evitar consumo excessivo de álcool.\n- Manter uso regular das medicações anti-hipertensivas.\n- Realizar acompanhamento ambulatorial.\n\nRetorno ao PS, se:\n- Dor torácica.\n- Falta de ar.\n- Fraqueza ou perda de força em membros.\n- Alteração da fala.\n- Alteração visual súbita.\n- Confusão mental.\n- Convulsões.\n- Cefaleia intensa ou progressiva.\n\nSe ansiedade associada:\n\n2) Clonazepam 0,5 mg [Rivotril®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, dose única.\n\nUSO ENDOVENOSO\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa. Diluir em 100 mL de SF 0,9% e infundir em 15 a 20 minutos.\n\nUSO ORAL\n\n4) Losartana Potássica 50 mg [Cozaar®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "elevacao-pressorica-assintomatica"}, {"id": "pseudocrise-hipertensiva", "nome": "Pseudocrise hipertensiva", "cid": "I10", "categoria": "cardiologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Diazepam 5 mg [Valium®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, dose única.\n\nUSO ENDOVENOSO\n\nSe dor:\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa. Diluir em 100 mL de SF 0,9% e infundir em 15 a 20 minutos.\n\n3) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\nOrientações\n- Manter rigorosamente as medicações anti-hipertensivas já prescritas.\n- Tratar adequadamente a causa dos sintomas.\n- Realizar medidas domiciliares da pressão arterial em repouso.\n- Agendar reavaliação ambulatorial.\n\nRetorno ao PS, se:\n- Dor torácica.\n- Falta de ar.\n- Fraqueza ou perda de força em membros.\n- Alteração da fala.\n- Alteração visual súbita.\n- Confusão mental.\n- Convulsões.\n- Cefaleia súbita e intensa."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "elevacao-pressorica-assintomatica"}, {"id": "dor-aguda-intensa", "nome": "Dor aguda intensa", "cid": "R52", "categoria": "emergencia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nSe dor intensa, apesar da dipirona (escolher uma opção):\n2) Paracetamol 500 mg + Codeína 30 mg [Tylex® 30 mg] ------------------------ 12 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor intensa, por até 3 dias.\n\nOU\nTramadol 50 mg [Tramal®] ------------------------ 12 cápsulas\nTomar 1 cápsula, via oral, de 8/8 horas, se dor intensa, por até 3 dias. Máximo de 400 mg por dia.\n3) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas.\n\nOrientações\n- Codeína e tramadol exigem receituário de controle especial (2 vias).\n- Podem causar sonolência, tontura, náuseas e intestino preso: não dirigir e não ingerir bebidas alcoólicas.\n- Não tomar outros remédios com paracetamol junto com o Tylex®.\n\nRetorno ao PS, se:\n- Dor que não melhora com as medicações.\n- Sonolência excessiva ou respiração lenta.\n- Vômitos persistentes.\n- Febre ou piora do quadro inicial."}, {"nome": "No PS", "texto": "USO ENDOVENOSO\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 02 ampolas\nAplicar 2 g, via endovenosa, diluída em 100 mL de SF 0,9%, em 15 a 20 minutos.\n\nSe sem contraindicação a anti-inflamatório:\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n3) Tramadol 50 mg/mL [Tramal®] ------------------------ 01 ampola de 2 mL\nDiluir 100 mg em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos.\n4) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa lenta, antes do tramadol.\n\nSe dor refratária:\n5) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9% (1 mg/mL). Aplicar 2 a 3 mg, via endovenosa lenta, a cada 5 a 10 minutos, até controle da dor. Monitorar FR, SpO2 e nível de consciência."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-aguda-intensa"}, {"id": "emergencia-hipertensiva-conduta-no-ps", "nome": "Emergência hipertensiva — conduta no PS", "cid": "I16.1", "categoria": "cardiologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Monitorização contínua, acesso venoso, ECG, troponina, função renal, eletrólitos, urina tipo I e fundo de olho. Identificar a lesão de órgão-alvo.\n2) Meta geral: reduzir a PAM em até 25% na primeira hora, depois para cerca de 160x100 mmHg em 2 a 6 horas (exceto dissecção de aorta e AVC).\n\nUSO ENDOVENOSO\n\nEdema agudo de pulmão / síndrome coronariana:\n3) Nitroglicerina 5 mg/mL [Tridil®] ------------------------ 01 ampola de 10 mL\nDiluir 50 mg em 240 mL de SG 5% (200 mcg/mL). Iniciar 5 a 10 mcg/min em bomba de infusão e aumentar 5 a 10 mcg/min a cada 5 minutos, conforme PA.\n\nEncefalopatia hipertensiva / demais emergências:\n4) Nitroprussiato de sódio 50 mg/2 mL [Nipride®] ------------------------ 01 ampola\nDiluir 50 mg em 248 mL de SG 5% (200 mcg/mL), protegido da luz. Iniciar 0,3 mcg/kg/min em bomba de infusão e titular a cada 5 minutos (máximo 10 mcg/kg/min).\n\nDissecção de aorta (associar ao vasodilatador, betabloqueador primeiro):\n5) Metoprolol 5 mg/5 mL [Seloken®] ------------------------ 03 ampolas\nAplicar 5 mg, via endovenosa lenta, a cada 5 minutos, até 15 mg. Meta: FC abaixo de 60 bpm e PAS abaixo de 120 mmHg em 20 minutos.\n\nSe congestão:\n6) Furosemida 20 mg/2 mL [Lasix®] ------------------------ 02 ampolas\nAplicar 40 mg, via endovenosa, em bolus."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-toracica-precordialgia-aguda"}, {"id": "has-cronica-mal-controlada", "nome": "HAS crônica mal controlada", "cid": "I10", "categoria": "cardiologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Losartana 50 mg [Cozaar®] ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, de uso contínuo.\n2) Anlodipino 5 mg [Norvasc®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, de uso contínuo.\n\nSe ainda fora da meta (associar):\n3) Hidroclorotiazida 25 mg [Clorana®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, pela manhã, de uso contínuo.\n\nOrientações\n- Reduzir o sal da alimentação, praticar atividade física e evitar álcool e cigarro.\n- Medir a pressão em casa e anotar os valores.\n- Agendar consulta na UBS em até 30 dias com os registros, creatinina e potássio.\n- Não suspender os remédios por conta própria.\n\nRetorno ao PS, se:\n- Dor no peito ou falta de ar.\n- Fraqueza ou dormência no corpo, alteração da fala ou da visão.\n- Dor de cabeça súbita e muito intensa."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "elevacao-pressorica-assintomatica"}, {"id": "insuficiencia-cardiaca-descompensada-no-ps", "nome": "Insuficiência cardíaca descompensada — no PS", "cid": "I50.9", "categoria": "cardiologia", "abas": [{"nome": "Perfil B (quente e úmido)", "texto": "Medidas gerais:\n1) Cabeceira elevada, oxigênio se SpO2 abaixo de 90%, monitorização, ECG, troponina, BNP, função renal e eletrólitos. Considerar VNI se desconforto respiratório.\n\nUSO ENDOVENOSO\n2) Furosemida 20 mg/2 mL [Lasix®] --------
