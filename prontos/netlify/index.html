  const r = pal.res[i]; if (!r) return;
  if (tipo === 'copy') { copy(palTexto(r.s, r.it), copiadoMsg(r.it, `${r.s === 'prescricoes' ? 'Prescrição' : r.s === 'hdas' ? 'HDA' : 'Documento'} copiada: ${r.it.nome}`, r.s), copiadoMs(r.it, r.s)); addRecente(r.s, r.it.id); closeModal(); }
  if (tipo === 'hda') { const t = palHda(r.it); if (t) { copy(t, 'HDA copiada'); closeModal(); } }
  if (tipo === 'open') { closeModal(); sec = r.s; cat = 'todas'; q = ''; const qi = $('#q'); if (qi) qi.value = ''; sel[r.s] = r.it.id; ui.sec = sec; lsSet('plantaorx:ui', ui); addRecente(r.s, r.it.id); renderAll(); scrollTo({top:0}); }
}
function abrirPaleta(){
  pal = {q:'', i:0, res:[]};
  openModal(`<div class="pal"><input id="palQ" placeholder="Buscar prescrição, HDA ou documento…" autocomplete="off" aria-label="Busca universal">
    <div id="palRes" class="pal-res" role="listbox"></div>
    <p class="hint" style="margin:0">↑ ↓ para escolher · Enter copia · Shift+Enter abre · Esc fecha</p></div>`);
  $('#layer .modal').classList.add('pal-modal');
  palRender(); setTimeout(() => $('#palQ')?.focus(), 20);
  const m = $('#layer .modal');
  m.addEventListener('input', e => { if (e.target.id === 'palQ') { pal.q = e.target.value; pal.i = 0; palRender(); } });
  m.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); pal.i = Math.min(pal.i + 1, pal.res.length - 1); palRender(); m.querySelector('.pal-it.on')?.scrollIntoView({block:'nearest'}); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); pal.i = Math.max(pal.i - 1, 0); palRender(); m.querySelector('.pal-it.on')?.scrollIntoView({block:'nearest'}); }
    else if (e.key === 'Enter') { e.preventDefault(); palAcao(e.shiftKey ? 'open' : 'copy', pal.i); }
  });
  m.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b?.dataset.palcopy) return palAcao('copy', +b.dataset.palcopy);
    if (b?.dataset.palhda) return palAcao('hda', +b.dataset.palhda);
    if (b?.dataset.palopen) return palAcao('open', +b.dataset.palopen);
    const it = e.target.closest('[data-pali]'); if (it) { pal.i = +it.dataset.pali; palRender(); }
  });
  m.addEventListener('dblclick', e => { const it = e.target.closest('[data-pali]'); if (it) palAcao('copy', +it.dataset.pali); });
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if ($('#palQ')) closeModal(); else abrirPaleta(); }
  if (e.key === 'Escape' && $('#palQ')) closeModal();
});
document.addEventListener('click', e => { if (e.target.closest('#btnPal')) abrirPaleta(); });

/* ---------- eventos do prontuário (novos) ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('#pront button'); if (!b) return;
  if (b.dataset.pendadd) { if (addPend(pr, b.dataset.pendadd)) { renderPront(); toast('Pendência adicionada'); } }
  if (b.dataset.pendnova) { const i = $('#pendNova'); if (!i.value.trim()) { i.focus(); return; } if (addPend(pr, i.value)) { renderPront(); toast('Pendência adicionada'); setTimeout(() => $('#pendNova')?.focus(), 20); } }
  if (b.dataset.penddel) { pr.pend = (pr.pend || []).filter(p => p.id !== b.dataset.penddel); renderPront(); }
  if (b.dataset.escid) { pr.esc = {id:b.dataset.escid, v:{}}; renderPront(); }
  if (b.dataset.escchk) { const v = pr.esc.v; v[b.dataset.escchk] = !v[b.dataset.escchk]; b.setAttribute('aria-pressed', !!v[b.dataset.escchk]); atualizarSaida(); }
  if (b.dataset.escsel) { const [k, p] = b.dataset.escsel.split(':'); pr.esc.v[k] = +p; b.parentElement.querySelectorAll('[data-escsel]').forEach(x => x.setAttribute('aria-pressed', x === b)); atualizarSaida(); }
  if (b.dataset.tcond) { const t = $('#tOut')?.value.trim(); if (!t) return; registrarEscore(); enviarParaCondutas(t); }
  if (b.dataset.decidir) avaliarDecisao();
  if (b.dataset.decpend) { const x = pr.decisao?.exames?.[+b.dataset.decpend]; if (x && addPend(pr, 'Aguardando ' + x.exame.charAt(0).toLowerCase() + x.exame.slice(1))) { renderPront(); toast('Adicionado às pendências'); } }
  if (b.dataset.chatq) { ui.sideTab = 'chat'; lsSet('plantaorx:ui', ui); enviarChat(b.dataset.chatq); }
  if (b.dataset.chatgo) { const i = $('#chatIn'); const t = i.value; if (!t.trim()) { i.focus(); return; } i.value = ''; ui.sideTab = 'chat'; lsSet('plantaorx:ui', ui); enviarChat(t); }
  if (b.dataset.chatcopy) { const m = pr.chat?.[+b.dataset.chatcopy]; if (m) copy(m.content, 'Resposta copiada'); }
  if (b.dataset.chatlimpar) { pr.chat = []; renderSide(); }
  if (b.dataset.sidetab) abrirPainel(b.dataset.sidetab === 'chat' ? 'chat' : 'decisao');
  if (b.dataset.painel) {
    const k = b.dataset.painel, antes = ui.painel, alterna = b.classList.contains('rail-btn') || b.classList.contains('img-h') || b.classList.contains('ri-btn') || b.classList.contains('fly-x');
    if (alterna && antes === k) { ui.painel = null; lsSet('plantaorx:ui', ui); antes === 'imagem' ? renderPront() : renderSide(); }
    else if (k === 'imagem' || antes === 'imagem') { ui.painel = k; lsSet('plantaorx:ui', ui); renderPront(); if (!alterna || k === 'imagem') document.getElementById('painel-' + k)?.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    else abrirPainel(k, !alterna);
  }
  if (b.dataset.passagem1) abrirPassagem(pr);
  if (b.dataset.saida) abrirSaida(b.dataset.saida);
  if (b.dataset.docpac) abrirDocsPaciente();
});
document.addEventListener('change', e => {
  if (e.target.id === 'pendSel') { const v = e.target.value; if (v && addPend(pr, v)) { renderPront(); toast('Pendência adicionada'); } else e.target.value = ''; return; }
  const t = e.target; if (!t.dataset?.pendok) return;
  const p = (pr.pend || []).find(x => x.id === t.dataset.pendok); if (!p) return;
  p.ok = t.checked; p.feito = t.checked ? 'feito às ' + horaAgora() : ''; renderPront();
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset?.escnum || !pr.esc) return;
  pr.esc.v[t.dataset.escnum] = t.value; atualizarSaida();
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'pendNova' && e.key === 'Enter') { e.preventDefault(); $('[data-pendnova]')?.click(); }
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('[data-chatgo]')?.click(); }
});

/* ---------------- início ---------------- */
if (ui.theme) document.documentElement.dataset.theme = ui.theme;
rebuild(); renderAll();
store.init(() => {
  rebuild();
  try { mesclarCasosRemotos(); } catch (e) { console.warn(e); }
  const a = document.activeElement;
  if (sec === 'prontuario' || sec === 'gerar') renderSections();
  else if (a && $('#detail').contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) { renderSections(); renderChips(); renderList(); }
  else renderAll();
});
})();
</script>
</body></html>
