até 16 semanas.\n\nOrientações\n- Não usar na gestação.\n- Pode haver vermelhidão e ardor no local.\n- Encaminhar para tratamento ambulatorial (crioterapia, ácido tricloroacético) se lesões extensas.\n- Usar preservativo; testar HIV, sífilis e hepatites.\n- Vacina HPV conforme calendário."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "cancro-mole", "nome": "Cancro mole", "cid": "A57", "categoria": "ist", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Azitromicina 500 mg [Zitromax®] ------------------------ 02 comprimidos\nTomar 2 comprimidos (1 g), via oral, em dose única.\n\nOU\nUSO INTRAMUSCULAR\nCeftriaxona 500 mg [Rocefin®] ------------------------ 01 frasco-ampola\nAplicar 250 mg, via intramuscular, dose única.\n\nOU\nUSO ORAL\nCiprofloxacino 500 mg [Cipro®] ------------------------ 06 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 3 dias.\n\nOrientações\n- Parcerias sexuais devem ser avaliadas e tratadas.\n- Testar HIV, sífilis e hepatites.\n- Reavaliar em 3 a 7 dias."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "linfogranuloma-venereo", "nome": "Linfogranuloma venéreo", "cid": "A55", "categoria": "ist", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Doxiciclina 100 mg [Vibramicina®] ------------------------ 42 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 21 dias.\n\nOU\nAzitromicina 500 mg [Zitromax®] ------------------------ 06 comprimidos\nTomar 2 comprimidos (1 g), via oral, 1 vez por semana, por 3 semanas.\n\nOrientações\n- Parcerias sexuais devem ser tratadas.\n- Testar HIV, sífilis e hepatites.\n- Linfonodos com flutuação podem precisar de aspiração."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "donovanose", "nome": "Donovanose", "cid": "A58", "categoria": "ist", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Doxiciclina 100 mg [Vibramicina®] ------------------------ 42 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por no mínimo 21 dias ou até a cicatrização completa.\n\nOU\nAzitromicina 500 mg [Zitromax®] ------------------------ 06 comprimidos\nTomar 2 comprimidos (1 g), via oral, 1 vez por semana, por no mínimo 3 semanas ou até a cicatrização.\n\nOrientações\n- Manter o tratamento até o desaparecimento das lesões.\n- Testar HIV, sífilis e hepatites."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "ulcera-genital-abordagem-sindromica", "nome": "Úlcera genital — abordagem sindrômica", "cid": "A64", "categoria": "ist", "abas": [{"nome": "Receita", "texto": "Tratamento para sífilis + cancroide (e herpes, se lesões vesiculares ou história sugestiva):\n\nUSO INTRAMUSCULAR\n1) Penicilina G Benzatina 1.200.000 UI [Benzetacil®] ------------------------ 02 frascos-ampola\nAplicar 2.400.000 UI, via intramuscular, dose única (1.200.000 UI em cada glúteo).\n\nUSO ORAL\n2) Azitromicina 500 mg [Zitromax®] ------------------------ 02 comprimidos\nTomar 2 comprimidos (1 g), via oral, em dose única.\n\nSe vesículas ou história de herpes:\n3) Aciclovir 400 mg [Zovirax®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 7 dias.\n\nSe úlcera há mais de 4 semanas (cobrir donovanose e LGV):\n4) Doxiciclina 100 mg [Vibramicina®] ------------------------ 42 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 21 dias.\n\nOrientações\n- Testar HIV, sífilis (teste rápido) e hepatites.\n- Parcerias sexuais devem ser avaliadas.\n- Reavaliar em 7 dias; biópsia se não houver melhora."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "lombalgia-aguda", "nome": "Lombalgia aguda", "cid": "M54.5", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "No PS", "texto": "Prescrição\n\nNo PS\n\nUSO ENDOVENOSO\n\n1) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\n2) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 ampola, via EV lento, diluída em 10 mL de SF 0,9%.\n\nSe dor intensa refratária:\n\n1) Tramadol 50 mg/mL [Tramal®] ------------------------ 01 ampola\nDiluir 1 ampola em 100 mL de SF 0,9%.\nInfundir via EV em 1 hora.\n\n2) Diprospan® (betametasona 7 mg/1 mL) ------------------------ 1 ampola\n- Aplicar 1 mL IM profundo, em dose única\n\n3) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 10 mL de SF 0,9%.\nAdministrar 2 mg EV lentamente.\nPode repetir 2 mg a cada 5-10 minutos até analgesia adequada."}, {"nome": "Receita de alta", "texto": "USO ORAL\n\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, se dor, por até 5 dias.\n\nOU\nCelecoxibe 200 mg [Celebra®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\n2) Ciclobenzaprina 5 mg [Miosan®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, à noite, por 5 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nSe dor intensa e refratária ao uso da dipirona e AINES:\n\n4) Tramadol 50 mg [Tramal®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por até 3 dias, se dor intensa refratária.\n\nOrientações\n- Fazer compressa morna na região lombar por 15 a 20 minutos, 3 a 4 vezes ao dia.\n- Evitar repouso absoluto.\n- Retornar gradualmente às atividades habituais conforme tolerado.\n- Evitar carregar peso e movimentos bruscos nos primeiros dias.\n- Suspender o AINE e procurar atendimento se apresentar dor epigástrica intensa, vômitos com sangue, fezes enegrecidas ou redução importante da diurese.\n\nRetorno ao PS, se:\n- Fraqueza nas pernas.\n- Dormência em região perineal.\n- Perda do controle urinário ou fecal.\n- Febre.\n- Dor progressiva ou incapacitante.\n- História recente de trauma importante."}, {"nome": "Outras opções de AINE", "texto": "NO PS\n\nUSO ENDOVENOSO\n\n1) Ibuprofeno EV 400-800 mg [Alivium®] ------------------------ 01 frasco\nAdministrar via EV em 30 minutos.\nPode repetir de 6/6 horas.\nDose máxima: 3.200 mg/dia.\n\nOU\nDiclofenaco EV 37,5 mg [Voltaren®] ------------------------ 01 ampola\nAplicar via EV em bolus lento (≈15 segundos), dose única.\n\nOU\nCetoprofeno 100 mg [Profenid®] ------------------------ 01 ampola\nDiluir 1 ampola em 100 mL de SF 0,9%.\nInfundir via EV em 20-30 minutos.\n\nPARA CASA\n\nUSO ORAL\n\n1) Celecoxibe 200 mg [Celebra®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\n2) Ibuprofeno 600 mg [Alivium®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 12/12 horas, após alimentação, por 5 dias.\n\n3) Diclofenaco 50 mg [Cataflam®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 8/8 horas, após alimentação, por até 5 dias.\n\n4) Cetoprofeno 100 mg [Profenid®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 12/12 horas, após alimentação, por até 5 dias.\n\nOU\nDiclofenaco Sódico 50 mg + Tiamina 50 mg + Piridoxina 50 mg + Cianocobalamina 1 mg [Alginac®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, após as refeições, por 5 dias."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "lombalgia-mecanica-aguda-lombociatalgia"}, {"id": "cefaleia-tensional", "nome": "Cefaleia tensional", "cid": "G44.2", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\n\nEm caso de dor, tomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\n3) Metoclopramida 10 mg [Plasil®] ------------------------ 01 caixa\n\nEm caso de enjoo ou vômitos:\nTomar 1 comprimido, via oral, de 8/8 horas, se necessário.\n\nOrientações\n- Evitar álcool e drogas recreativas.\n- Manter sono regular.\n- Evitar privação de sono.\n- Evitar situações de estresse excessivo.\n- Hidratar-se adequadamente.\n- Reduzir exposição prolongada a telas quando piorarem os sintomas.\n- Não utilizar opioides (tramadol, codeína ou morfina) sem indicação médica.\n\nRetorno ao PS, se:\n- Primeira cefaleia da vida e muito intensa.\n- Cefaleia súbita (\"pior dor da vida\").\n- Alteração do nível de consciência.\n- Fraqueza ou dormência em membros.\n- Alteração da fala.\n- Perda visual.\n- Convulsões.\n- Febre alta.\n- Rigidez de nuca.\n- Dor que não melhora com as medicações prescritas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "cefaleia-primaria-recorrente"}, {"id": "enxaqueca-crise", "nome": "Enxaqueca (crise)", "cid": "G43.9", "categoria": "neurologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n\n1) Naproxeno 500 mg [Flanax®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n\n2) Sumatriptano 50 mg [Sumax®] ------------------------ 01 caixa\n\nEm caso de crise intensa:\nTomar 1 comprimido, via oral, ao início da crise, junto ao naproxeno.\nPode repetir após 2 horas, se necessário.\n\nOU\nNaratriptano 2,5 mg [Naramig®] ------------------------ 02 comprimidos\nTomar 1 comprimido, via oral, ao início da crise de enxaqueca. Se houver recorrência da dor após melhora inicial, tomar mais 1 comprimido após 4 horas. Não exceder 2 comprimidos em 24 horas.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\n\nEm caso de dor, tomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\n4) Metoclopramida 10 mg [Plasil®] ------------------------ 01 caixa\n\nEm caso de enjoo ou vômitos:\nTomar 1 comprimido, via oral, de 8/8 horas, se necessário.\n\nOrientações\n- Permanecer em ambiente silencioso e pouco iluminado.\n- Dormir e alimentar-se em horários regulares.\n- Evitar álcool.\n- Identificar e evitar gatilhos individuais (jejum prolongado, privação de sono, estresse, alguns alimentos).\n- Não usar opioides (tramadol ou codeína), pois aumentam o risco de cefaleia por abuso de medicação.\n- Alteração do nível de consciência.\n- Fraqueza ou dormência em membros.\n- Alteração da fala, perda visual, convulsões, febre alta, rigidez de nuca, dor que não melhora com as medicações prescritas."}, {"nome": "No PS", "texto": "USO ENDOVENOSO\n\n1) Dipirona 1 g [Novalgina®] ------------------------ 01 ampola\nAdministrar 1 ampola, via endovenosa, diluída em 100 mL de SF 0,9%, em 15 a 20 minutos.\n\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\n3) Metoclopramida 10 mg [Plasil®] ------------------------ 01 ampola\nAdministrar 1 ampola, via endovenosa lenta, em 2 a 3 minutos.\n\n4) Dexametasona 10 mg [Decadron®] ------------------------ 01 ampola\nAdministrar 1 ampola, via endovenosa lenta.\n\nSe refratária:\n\n1) Clorpromazina 40 mg/mL [Amplictil®] ------------------------ 01 frasco\nTomar 2 gotas, via oral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "cefaleia-primaria-recorrente"}, {"id": "enxaqueca-tratamento-profilatico", "nome": "Enxaqueca — tratamento profilático", "cid": "G43.9", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Amitriptilina 25 mg [Amytril®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, à noite, por 7 dias. Depois, 1 comprimido à noite.\n\nOU (se sem asma, bradicardia ou hipotensão)\nPropranolol 40 mg [Inderal®] ------------------------ 60 comprimidos\nTomar ½ comprimido, via oral, de 12/12 horas, por 7 dias. Depois, 1 comprimido de 12/12 horas.\n\nOU\nTopiramato 25 mg [Topamax®] ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, à noite, por 7 dias. Depois, 1 comprimido de 12/12 horas.\n\nOrientações\n- O efeito preventivo aparece após 4 a 8 semanas; não suspender antes.\n- Fazer diário da dor de cabeça.\n- Limitar analgésicos a no máximo 2 a 3 dias por semana.\n- Amitriptilina pode causar sonolência e boca seca.\n- Acompanhamento na UBS ou com neurologista.\n\nRetorno ao PS, se:\n- Dor de cabeça súbita e muito intensa.\n- Febre com rigidez de nuca.\n- Fraqueza, dormência, alteração da fala ou da visão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "cefaleia-primaria-recorrente"}, {"id": "cefaleia-em-salvas", "nome": "Cefaleia em salvas", "cid": "G44.0", "categoria": "neurologia", "abas": [{"nome": "No PS", "texto": "USO INALATÓRIO\n1) Oxigênio 100% em máscara não reinalante ------------------------ 12 a 15 L/min\nAdministrar por 15 a 20 minutos, com o paciente sentado.\n\nUSO SUBCUTÂNEO (se disponível)\n2) Sumatriptano 6 mg/0,5 mL ------------------------ 01 seringa\nAplicar 6 mg, via subcutânea, dose única."}, {"nome": "Receita de alta", "texto": "USO ORAL\n\nTerapia de transição:\n1) Prednisona 20 mg [Meticorten®] ------------------------ 25 comprimidos\nTomar 3 comprimidos, via oral, pela manhã, por 5 dias. Depois, reduzir ½ comprimido a cada 2 dias até suspender.\n\nProfilaxia (iniciar junto):\n2) Verapamil 80 mg [Dilacoron®] ------------------------ 90 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas. Realizar ECG antes e durante o uso.\n\nOrientações\n- Evitar álcool durante o período de crises.\n- Encaminhamento ao neurologista.\n- Manter horários regulares de sono.\n\nRetorno ao PS, se:\n- Dor de cabeça diferente do habitual.\n- Fraqueza, alteração da fala ou da visão.\n- Febre com rigidez de nuca.\n- Tontura, desmaio ou batimentos muito lentos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "cefaleia-primaria-recorrente"}, {"id": "cefaleia-por-uso-excessivo-de-analgesicos", "nome": "Cefaleia por uso excessivo de analgésicos", "cid": "G44.4", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\nTerapia de transição (por 7 a 10 dias):\n1) Naproxeno 500 mg [Flanax®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por até 10 dias.\n\nProfilaxia:\n2) Amitriptilina 25 mg [Amytril®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, à noite, por 7 dias. Depois, 1 comprimido à noite.\n\nOrientações\n- Suspender o analgésico usado em excesso (ou reduzir aos poucos se opioide ou benzodiazepínico).\n- A dor pode piorar nos primeiros dias da retirada.\n- Fazer diário da dor de cabeça.\n- Acompanhamento com neurologista ou na UBS.\n\nRetorno ao PS, se:\n- Dor de cabeça súbita e muito intensa.\n- Febre com rigidez de nuca.\n- Fraqueza, alteração da fala ou da visão.\n- Vômitos persistentes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "cefaleia-primaria-recorrente"}, {"id": "paralisia-facial-periferica-bell", "nome": "Paralisia facial periférica (Bell)", "cid": "G51.0", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Prednisona 20 mg [Meticorten®] ------------------------ 02 caixas\nTomar 3 comprimidos, via oral, pela manhã, por 5 dias. Após, tomar 2 comprimidos por 2 dias. Após, tomar 1 comprimido por 2 dias. Após, tomar 1/2 comprimido por 1 dia.\n\n2) Valaciclovir 500 mg [Valtrex®] ------------------------ 42 comprimidos\nTomar 2 comprimidos, via oral, de 8/8 horas, por 7 dias.\n\nOU\nAciclovir 400 mg [Zovirax®] ------------------------ 70 comprimidos\nTomar 2 comprimidos, via oral, 5 vezes ao dia, por 7 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOU\nParacetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO OFTÁLMICO\n\n4) Hialuronato de sódio 0,15% [Hyabak®] ------------------------ 01 frasco\nInstilar 1 gota em cada olho acometido, via oftálmica, de 4 a 8 vezes ao dia, até melhora dos sintomas.\n\n5) ADAPTIS® GEL 0,2% (Hialuronato de sódio) ------------------------ 1 bisnaga 10 g\nAplicar 1 gota (ou pequena quantidade de gel) no saco conjuntival do olho acometido, antes de dormir, até recuperação do fechamento\npalpebral.\n\nOrientações\n- Iniciar o tratamento o mais precocemente possível.\n- Utilizar óculos escuros em ambientes externos.\n- Realizar oclusão noturna se houver dificuldade para fechar o olho.\n- Evitar esfregar o olho acometido.\n\nRetorno ao PS, se:\n- Fraqueza em braço ou perna.\n- Alteração da fala.\n- Visão dupla.\n- Vertigem intensa.\n- Cefaleia intensa.\n- Dor ocular.\n- Diminuição da visão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "paralisia-facial"}, {"id": "neuralgia-do-trigemeo", "nome": "Neuralgia do trigêmeo", "cid": "G50.0", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Carbamazepina 200 mg [Tegretol®] ------------------------ 60 comprimidos\nTomar ½ comprimido, via oral, de 12/12 horas, por 3 dias. Depois, 1 comprimido de 12/12 horas.\nAumentar conforme resposta até 600 a 800 mg por dia (receita de controle especial).\n\nOrientações\n- Pode causar sonolência e tontura no início.\n- Colher hemograma, sódio e função hepática no acompanhamento.\n- Encaminhamento ao neurologista (avaliar ressonância).\n- Não suspender abruptamente.\n\nRetorno ao PS, se:\n- Manchas ou bolhas na pele, feridas na boca.\n- Febre ou dor de garganta persistente.\n- Confusão mental.\n- Fraqueza ou dormência no rosto ou no corpo."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "cefaleia-aguda-investigacao-de-sinais-de-alarme"}, {"id": "sindrome-do-tunel-do-carpo", "nome": "Síndrome do túnel do carpo", "cid": "G56.0", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nOU (se sintomas intensos)\nPrednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, pela manhã, por 10 dias.\n\nOUTROS\n2) Órtese (tala) de punho em posição neutra ------------------------ 01 unidade\nUsar à noite, durante o sono.\n\nOrientações\n- Evitar movimentos repetitivos e flexão prolongada do punho.\n- Encaminhamento ao ortopedista ou neurologista (eletroneuromiografia).\n\nRetorno ao PS, se:\n- Perda de força na mão.\n- Atrofia da musculatura do polegar.\n- Dormência persistente que não melhora."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-musculoesqueletica-cervicalgia-dor-periarticular"}, {"id": "neuralgia-pos-herpetica", "nome": "Neuralgia pós-herpética", "cid": "G53.0", "categoria": "neurologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Gabapentina 300 mg [Neurontin®] ------------------------ 90 cápsulas\nTomar 1 cápsula, via oral, à noite, por 3 dias. Depois, 1 cápsula de 12/12 horas por 3 dias. Depois, 1 cápsula de 8/8 horas.\n\nOU\nPregabalina 75 mg [Lyrica®] ------------------------ 60 cápsulas\nTomar 1 cápsula, via oral, de 12/12 horas.\n2) Amitriptilina 25 mg [Amytril®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, à noite, por 7 dias. Depois, 1 comprimido à noite.\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Receita de controle especial (gabapentina, pregabalina, amitriptilina).\n- O efeito leva 1 a 2 semanas para aparecer.\n- Pode causar sonolência e tontura; evitar dirigir no início.\n- Ajustar dose da gabapentina/pregabalina à função renal.\n\nRetorno ao PS, se:\n- Sonolência excessiva ou confusão.\n- Novas lesões na pele.\n- Dor que não melhora com o tratamento."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "lesoes-vesiculares-herpes-zoster"}, {"id": "cefaleia-pos-puncao-dural-pos-raquianestesia", "nome": "Cefaleia pós-punção dural (pós-raquianestesia)", "cid": "G97.1", "categoria": "neurologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n2) Dipirona + Isometepteno + Cafeína [Neosaldina®] ------------------------ 20 drágeas\nTomar 1 a 2 drágeas, via oral, de 8/8 horas, se dor, por até 3 dias.\n\nOrientações\n- Repouso deitado alivia a dor.\n- Ingerir 2 a 3 litros de líquidos por dia; café pode ajudar.\n- Se não melhorar em 48 a 72 horas, contatar o anestesista (tampão sanguíneo).\n\nRetorno ao PS, se:\n- Febre ou rigidez de nuca.\n- Convulsão, confusão ou sonolência.\n- Fraqueza, alteração da fala ou da visão.\n- Dor que não melhora deitado."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "cefaleia-aguda-investigacao-de-sinais-de-alarme"}, {"id": "crise-de-ansiedade", "nome": "Crise de ansiedade", "cid": "F41.0", "categoria": "saude-mental", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Clonazepam 0,5 mg [Rivotril®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, se crise intensa. Pode repetir após 30 a 60 minutos, se necessário. Utilizar por até 3 dias.\n\nOU\nAlprazolam 0,5 mg [Frontal®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, ao início da crise. Se necessário, repetir 1 comprimido após 30 a 60 minutos.\n\nUSO ENDOVENOSO\n\n2) Ondansetrona 4 mg [Vonau®] ------------------------ 01 ampola\nAplicar 1 ampola, via endovenosa lenta, AGORA.\n\n3) Diazepam 10 mg/2 mL [Diazepam®] ------------------------ 01 ampola\nAplicar 5 mg, via endovenosa lenta, AGORA.\n\nOU\nMidazolam 5 mg/mL [Dormonid®] ------------------------ 01 ampola\nAplicar 2,5 a 5 mg, via intramuscular ou endovenosa lenta, dose única.\n\nOrientações\n- Evitar álcool e outras drogas.\n- Evitar excesso de cafeína e energéticos.\n- Não dirigir após uso das medicações.\n- Procurar acompanhamento psicológico ou psiquiátrico se houver recorrência.\n\nRetorno ao PS, se:\n- Dor torácica persistente.\n- Falta de ar progressiva.\n- Desmaio.\n- Alteração da fala.\n- Confusão mental.\n- Agitação intensa.\n- Ideias de autoagressão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "crise-de-ansiedade-ataque-de-panico"}, {"id": "episodio-depressivo-inicio-de-tratamento", "nome": "Episódio depressivo — início de tratamento", "cid": "F32.9", "categoria": "saude-mental", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Sertralina 50 mg [Zoloft®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, pela manhã, por 7 dias. Depois, 1 comprimido pela manhã.\n\nOU\nEscitalopram 10 mg [Lexapro®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, pela manhã, por 7 dias. Depois, 1 comprimido pela manhã.\n\nOrientações\n- Receita de controle especial (2 vias).\n- O efeito começa em 2 a 4 semanas; não suspender por conta própria.\n- Pode haver enjoo e ansiedade nos primeiros dias.\n- Evitar álcool.\n- Agendar acompanhamento na UBS ou CAPS em até 2 semanas.\n- Em sofrimento intenso, ligar para o CVV: 188 (24 horas).\n\nRetorno ao PS, se:\n- Pensamentos de morte ou de se machucar.\n- Agitação intensa, confusão ou febre.\n- Piora importante do humor."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "insonia-sintomas-depressivos-ou-ansiosos"}, {"id": "transtorno-de-ansiedade-generalizada-inicio", "nome": "Transtorno de ansiedade generalizada — início", "cid": "F41.1", "categoria": "saude-mental", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Escitalopram 10 mg [Lexapro®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, pela manhã, por 7 dias. Depois, 1 comprimido pela manhã.\n\nOU\nSertralina 50 mg [Zoloft®] ------------------------ 30 comprimidos\nTomar ½ comprimido, via oral, pela manhã, por 7 dias. Depois, 1 comprimido pela manhã.\n\nOrientações\n- Receita de controle especial (2 vias).\n- O efeito começa em 2 a 4 semanas; a ansiedade pode piorar um pouco no início.\n- Reduzir cafeína, energéticos e álcool.\n- Atividade física regular e psicoterapia ajudam muito.\n- Acompanhamento na UBS ou com psiquiatra.\n\nRetorno ao PS, se:\n- Pensamentos de morte ou de se machucar.\n- Dor no peito ou falta de ar persistente.\n- Agitação intensa."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "insonia-sintomas-depressivos-ou-ansiosos"}, {"id": "insonia", "nome": "Insônia", "cid": "G47.0", "categoria": "saude-mental", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Zolpidem 10 mg [Stilnox®] ------------------------ 07 comprimidos\nTomar 1 comprimido, via oral, ao deitar, por até 7 dias.\n\nOU\nQuetiapina 25 mg [Seroquel®] ------------------------ 07 comprimidos\nTomar 1 comprimido, via oral, ao deitar, por até 7 dias.\n\nOrientações\n- Utilizar o medicamento apenas ao deitar.\n- Reservar pelo menos 7 a 8 horas para dormir após a administração.\n- Não ingerir bebidas alcoólicas durante o tratamento.\n- Não dirigir veículos ou operar máquinas após utilizar a medicação.\n- Evitar uso concomitante com outros medicamentos sedativos sem orientação médica.\n- Manter horário regular para dormir e acordar.\n- Evitar cafeína, nicotina e telas luminosas nas horas que antecedem o sono.\n\nRetorno ao PS, se:\n- Persistência da insônia apesar do tratamento.\n- Sonolência excessiva, confusão ou quedas após o uso da medicação.\n- Alterações importantes do comportamento durante o sono.\n- Ideação suicida, agitação intensa ou sintomas psiquiátricos importantes.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "insonia-sintomas-depressivos-ou-ansiosos"}, {"id": "sindrome-de-abstinencia-alcoolica-leve-ambulatorial", "nome": "Síndrome de abstinência alcoólica leve — ambulatorial", "cid": "F10.3", "categoria": "saude-mental", "abas": [{"nome": "Receita", "texto": "USO ENDOVENOSO\n\n1) Tiamina 100 mg/mL [Citoneurin®] ------------------------ 03 ampolas\nDiluir 300 mg em 100 mL de SF 0,9%.\nInfundir, via endovenosa, em 30 minutos.\nAdministrar antes de qualquer solução glicosada.\n\n2) Diazepam 10 mg/2 mL [Diazepam Hipolabor®] ------------------------ Conforme escore CIWA-Ar\nAdministrar:\n- 10 mg VO ou EV se CIWA-Ar entre 8 e 15.\n- 20 mg VO ou EV se CIWA-Ar maior que 15.\nReavaliar após 1 hora.\nPode repetir a cada 1 a 2 horas até:\n- CIWA-Ar menor que 8.\n- Sedação leve.\n- Frequência cardíaca menor que 100 bpm.\n- Ausência de tremores importantes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "intoxicacao-exogena"}, {"id": "escabiose-sarna", "nome": "Escabiose (sarna)", "cid": "B86", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Ivermectina 6 mg [Revectina®] ------------------------ 04 comprimidos\nTomar 2 comprimidos, via oral, em dose única hoje.\nRepetir 2 comprimidos, via oral, em dose única após 7 dias.\n\n2) Hidroxizina 25 mg [Hixizine®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\nEm caso de prurido intenso: Tomar 1 comprimido, via oral, de 8/8 horas, por 5 dias.\n\nUSO TÓPICO\n\n3) Permetrina 5% [Keltrina®] ------------------------ 01 frasco\nAplicar na pele do pescoço para baixo, incluindo plantas dos pés e espaços interdigitais.\nEm pacientes calvos, aplicar também no couro cabeludo, testa, linha do cabelo e têmporas.\nEvitar contato com mucosa oral e olhos.\nDeixar a loção secar por 10 minutos antes de se vestir.\nManter na pele por 6 horas antes do banho.\nRepetir a aplicação após 7 dias.\n\nOrientações\n- Tratar simultaneamente todos os moradores da residência e contatos íntimos.\n- Lavar roupas, toalhas e roupas de cama utilizadas nos últimos 3 dias com água quente, se possível.\n- Objetos que não puderem ser lavados podem ser mantidos em saco plástico fechado por 72 horas.\n- O prurido pode persistir por 2 a 4 semanas mesmo após tratamento adequado.\n- Evitar coçar excessivamente para reduzir risco de infecção secundária.\n\nRetorno ao PS, se:\n- Surgimento de pus ou secreção nas lesões.\n- Febre.\n- Vermelhidão extensa da pele.\n- Ausência de melhora após 2 a 4 semanas.\n- Piora importante do prurido.\n- Aparecimento de novas lesões após tratamento adequado."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "prurido-lesoes-pruriginosas"}, {"id": "micose-de-pele-tinea-corporis", "nome": "Micose de pele (tinea corporis)", "cid": "B35.4", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Cetoconazol 2% creme [Cetoconazol Medley®] ------------------------ 01 bisnaga\nAplicar sobre as lesões e 2 cm ao redor, 2 vezes ao dia, por 2 a 4 semanas (manter 1 semana após sumir).\n\nOU\nTerbinafina 1% creme [Lamisil®] ------------------------ 01 bisnaga\nAplicar sobre as lesões, 1 a 2 vezes ao dia, por 2 semanas.\n\nSe lesões extensas:\n\nUSO ORAL\n2) Terbinafina 250 mg [Lamisil®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 14 dias.\n\nOrientações\n- Secar bem a pele após o banho.\n- Não compartilhar toalhas e roupas.\n- Examinar animais de estimação.\n- Não usar cremes com corticoide por conta própria.\n\nRetorno ao PS, se:\n- Lesões se espalhando apesar do tratamento.\n- Vermelhidão, calor e pus.\n- Febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "urticaria-aguda", "nome": "Urticária aguda", "cid": "L50.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Bilastina 20 mg [Alektos®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum (1 hora antes ou 2 horas após alimentos), Tomar 1 comprimido VO 1x/dia, por 5–10 dias.\n\n2) Cloridrato de Hidroxizina 25 mg [Hixizine®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, antes de dormir, por 7 dias.\n\n3) Prednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 2 comprimidos, via oral, 1 vez ao dia, pela manhã, por 5 dias.\n\nOrientações\n- Evitar alimentos, medicamentos ou substâncias associados ao início dos sintomas.\n- Evitar banhos muito quentes.\n- Não coçar as lesões.\n- Manter hidratação adequada.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Inchaço em lábios, língua ou garganta.\n- Tontura ou desmaio.\n- Piora importante das lesões.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "urticaria-aguda-reacao-alergica-cutanea"}, {"id": "celulite-erisipela", "nome": "Celulite / erisipela", "cid": "L03.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Cefalexina 500 mg [Keflex®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, por 7 dias.\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nOrientações\n- Fazer compressa gelada por 15 minutos.\n- Repetir até 6 vezes ao dia.\n- Manter o membro elevado.\n- Completar todo o antibiótico.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Dor intensa.\n- Aumento progressivo do edema.\n- Aumento da vermelhidão.\n- Abscesso com secreção.\n- Tontura ou desmaios.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "erisipela-celulite-cutanea"}, {"id": "herpes-zoster", "nome": "Herpes-zóster", "cid": "B02.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Valaciclovir 500 mg [Valtrex®] ------------------------ 42 comprimidos\nTomar 2 comprimidos, via oral, de 8/8 horas, por 7 dias.\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n3) Tramadol 50 mg [Tramal®] ------------------------ 01 caixa\n\nSe dor intensa refratária:\nTomar 1 comprimido, via oral, de 8/8 horas, por 3 dias.\n\nOrientações\n- Manter as lesões cobertas enquanto estiverem ativas.\n- Evitar contato das lesões com outras pessoas.\n- Não coçar as lesões.\n- Evitar tocar outras regiões do corpo após contato com as lesões.\n- Realizar limpeza e proteção diária das lesões.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Aumento do edema.\n- Saída de pus.\n- Lesões próximas aos olhos.\n- Dor intensa sem melhora.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "lesoes-vesiculares-herpes-zoster"}, {"id": "impetigo", "nome": "Impetigo", "cid": "L01.0", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Cefalexina 500 mg [Keflex®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, por 7 dias.\n\nUSO TÓPICO\n\n2) Mupirocina 2% [Bactroban®] ------------------------ 01 bisnaga\nAplicar fina camada sobre a lesão, via tópica, 3 vezes ao dia, por 5 dias.\n\nOrientações\n- Não coçar as lesões.\n- Não remover as crostas.\n- Manter unhas cortadas e limpas.\n- Evitar compartilhar toalhas e objetos pessoais.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Aumento importante das lesões.\n- Presença de pus.\n- Dor intensa.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "lesao-de-pele-infecciosa-abscesso"}, {"id": "furunculo-abscesso-de-pele", "nome": "Furúnculo / abscesso de pele", "cid": "L02.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Cefalexina 500 mg [Keflex®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, por 7 dias.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\n\nEm caso de febre ou dor:\nTomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\nUSO TÓPICO\n\n3) Mupirocina 2% [Bactroban®] ------------------------ 01 bisnaga\nAplicar fina camada sobre a lesão, via tópica, até 3 vezes ao dia, por 7 dias ou até melhora.\n\nOrientações\n- Fazer compressa de água morna por 20 minutos.\n- Repetir 3 vezes ao dia.\n- Manter até drenagem espontânea da lesão.\n- Cuidado para não causar queimaduras.\n- Não espremer ou manipular a lesão.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Aumento progressivo da vermelhidão.\n- Dor intensa.\n- Surgimento de novas lesões.\n- Ausência de melhora após tratamento.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "lesao-de-pele-infecciosa-abscesso"}, {"id": "dermatite-de-contato", "nome": "Dermatite de contato", "cid": "L25.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Dexametasona 0,1% creme [Dexametasona Medley®] ------------------------ 01 bisnaga\nAplicar fina camada sobre as lesões, 2 vezes ao dia, por 7 dias. Não usar no rosto por mais de 5 dias.\n\nUSO ORAL\n2) Hidroxizina 25 mg [Hixizine®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, por 7 dias, se coceira.\n\nSe lesões extensas:\n3) Prednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 2 comprimidos, via oral, pela manhã, por 5 dias.\n\nOrientações\n- Identificar e evitar o agente causador (bijuterias, cosméticos, produtos de limpeza, plantas).\n- Usar sabonete neutro e hidratante sem perfume.\n- Não coçar.\n\nRetorno ao PS, se:\n- Inchaço no rosto, lábios ou língua.\n- Falta de ar.\n- Bolhas extensas, pus ou febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "picada-de-inseto-reacao-local", "nome": "Picada de inseto — reação local", "cid": "T63.4", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Dexametasona 0,1% creme [Dexametasona Medley®] ------------------------ 01 bisnaga\nAplicar fina camada no local, 2 vezes ao dia, por 5 dias.\n\nUSO ORAL\n2) Bilastina 20 mg [Alektos®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum (1 hora antes ou 2 horas após alimentos), por 5 dias.\n3) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Compressas frias por 15 minutos, várias vezes ao dia.\n- Não coçar nem furar o local.\n- Se ferrão de abelha, retirar raspando, sem apertar.\n\nRetorno ao PS, se:\n- Inchaço no rosto, lábios ou língua.\n- Falta de ar, chiado ou rouquidão.\n- Tontura ou desmaio.\n- Vermelhidão que aumenta, calor e febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "urticaria-aguda-reacao-alergica-cutanea"}, {"id": "pitiriase-versicolor", "nome": "Pitiríase versicolor", "cid": "B36.0", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Cetoconazol 2% xampu [Cetoconazol Medley®] ------------------------ 01 frasco\nAplicar no corpo nas áreas afetadas durante o banho, deixar agir 5 minutos e enxaguar. Usar 1 vez ao dia por 7 dias.\n\nSe lesões extensas:\n\nUSO ORAL\n2) Fluconazol 150 mg [Zoltec®] ------------------------ 04 cápsulas\nTomar 2 cápsulas (300 mg), via oral, 1 vez por semana, por 2 semanas.\n\nOrientações\n- As manchas podem demorar meses para voltar à cor normal, mesmo curadas.\n- Usar o xampu 1 vez por mês para prevenir recorrência.\n- Evitar óleos corporais."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "frieira-tinea-pedis", "nome": "Frieira (tinea pedis)", "cid": "B35.3", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n\n1) Cetoconazol 2% creme [Cetoconazol Medley®] ------------------------ 01 bisnaga\nLavar as lesões com água e sabão neutro e secar bem.\nAplicar fina camada sobre as lesões, via tópica, de 12/12 horas, por 30 dias ou até a cura.\n\nOrientações\n- Secar bem os pés e entre os dedos após o banho.\n- Aplicar talco antisséptico.\n- Preferir meias de algodão.\n- Evitar calçados fechados por longos períodos.\n- Limpar os sapatos periodicamente.\n- Não compartilhar itens de higiene pessoal.\n\nRetorno ao PS, se:\n- Vermelhidão extensa.\n- Dor intensa.\n- Saída de pus.\n- Febre persistente ou recorrente.\n- Ausência de melhora após tratamento.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "prurido-lesoes-pruriginosas"}, {"id": "pediculose-piolho", "nome": "Pediculose (piolho)", "cid": "B85.0", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Permetrina 1% loção [Nedax®] ------------------------ 01 frasco\nAplicar no couro cabeludo e cabelos secos, deixar agir 10 minutos e enxaguar. Repetir após 7 a 10 dias.\n\nOU\nUSO ORAL\nIvermectina 6 mg [Revectina®] ------------------------ 04 comprimidos\nTomar 200 mcg/kg (ex.: 60 kg = 2 comprimidos), via oral, dose única. Repetir após 7 dias.\n\nOrientações\n- Passar pente fino diariamente por 2 semanas.\n- Lavar roupas de cama, toalhas e bonés com água quente.\n- Tratar todos os contatos da casa com piolhos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "larva-migrans-bicho-geografico", "nome": "Larva migrans (bicho geográfico)", "cid": "B76.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Ivermectina 6 mg [Revectina®] ------------------------ 02 comprimidos\nTomar 200 mcg/kg (ex.: 60 kg = 2 comprimidos), via oral, dose única.\n\nOU\nAlbendazol 400 mg [Zentel®] ------------------------ 03 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 3 dias.\n2) Hidroxizina 25 mg [Hixizine®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, se coceira.\n\nUSO TÓPICO\n3) Tiabendazol 5% pomada ------------------------ 01 bisnaga\nAplicar sobre o trajeto da lesão, 3 vezes ao dia, por 7 dias.\n\nOrientações\n- Evitar andar descalço em areia e terra.\n- Não coçar.\n\nRetorno ao PS, se:\n- Vermelhidão, calor e pus no local.\n- Febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "conjuntivite", "nome": "Conjuntivite", "cid": "H10.9", "categoria": "oftalmologia", "abas": [{"nome": "Viral", "texto": "USO OFTÁLMICO\n\n1) Hialuronato de sódio 0,15% [Hyabak®] ------------------------ 01 frasco\nInstilar 1 gota em cada olho acometido, via oftálmica, de 4 a 8 vezes ao dia, até melhora dos sintomas.\n\n2) Acetato de prednisolona 0,12% [Ster®] ------------------------ 01 frasco\n\nSe houver pseudomembrana e infiltrado subepitelial, instilar 1 gota no olho acometido, via oftálmica, de 6/6 horas. Reduzir gradualmente a frequência das aplicações conforme melhora clínica, até suspensão.\n\n3) Compressas geladas por 10–15 minutos, 4–6 vezes ao dia, para aliviar edema e prurido.\n\nOrientações\n- Compressas geladas por 10–15 minutos, 4–6 vezes ao dia, para aliviar edema e prurido. .\n- Lavar as mãos frequentemente.\n- Não compartilhar toalhas ou objetos pessoais.\n- Suspender o uso de lentes de contato.\n\nRetorno ao PS, se:\n- Dor ocular intensa.\n- Fotofobia importante.\n- Redução da visão.\n- Secreção purulenta abundante.\n- Piora importante do estado geral."}, {"nome": "Bacteriana", "texto": "USO OFTÁLMICO\n\n1) Moxifloxacino colírio 0,5% [Vigamox®] ------------------------ 01 frasco\nAplicar 1 gota no olho acometido, de 8/8 horas, por 7 dias.\n\nOU\nTobramicina colírio 0,3% [Tobrex®] ------------------------ 01 frasco\nAplicar 1 gota no olho acometido, de 6/6 horas, por 7 dias.\n\n2) Compressas geladas por 10–15 minutos, 4–6 vezes ao dia, para aliviar edema e prurido.\n\nOrientações\n- Higienizar as secreções com soro fisiológico 0,9%.\n- Não utilizar lentes de contato até resolução completa.\n- Evitar coçar os olhos.\n- Lavar as mãos frequentemente.\n\nRetorno ao PS, se:\n- Dor ocular intensa.\n- Redução da visão.\n- Fotofobia importante.\n- Edema importante das pálpebras.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "conjuntivite-aguda"}, {"id": "hordeolo-tercol", "nome": "Hordéolo (terçol)", "cid": "H00.0", "categoria": "oftalmologia", "abas": [{"nome": "Receita", "texto": "USO OFTÁLMICO\n\n1) Tobramicina pomada oftálmica 0,3% [Tobrex®] ------------------------ 01 bisnaga\nAplicar pequena quantidade no saco conjuntival inferior, de 8/8 horas, por 7 dias.\n\nOrientações\n- Realizar compressas mornas por 10 a 15 minutos, 4 vezes ao dia.\n- Não espremer a lesão.\n- Suspender maquiagem até resolução completa.\n- Higienizar as mãos antes de manipular os olhos.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Edema importante das pálpebras.\n- Vermelhidão extensa ao redor dos olhos.\n- Dor ocular intensa.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "conjuntivite-aguda"}, {"id": "abrasao-de-cornea-corpo-estranho", "nome": "Abrasão de córnea / corpo estranho", "cid": "S05.0", "categoria": "oftalmologia", "abas": [{"nome": "Receita de alta", "texto": "USO OFTÁLMICO\n1) Tobramicina 0,3% colírio [Tobrex®] ------------------------ 01 frasco\nPingar 1 gota no olho acometido, de 6/6 horas, por 5 dias.\n\nSe usuário de lente de contato (cobrir Pseudomonas):\nMoxifloxacino 0,5% colírio [Vigamox®] ------------------------ 01 frasco\nPingar 1 gota no olho acometido, de 6/6 horas, por 7 dias.\n2) Retinol + Aminoácidos + Metionina + Cloranfenicol pomada [Epitezan®] ------------------------ 01 bisnaga\nAplicar no olho acometido à noite, por 5 dias.\n\nUSO ORAL\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Não usar colírio anestésico em casa.\n- Não usar lente de contato até a cura.\n- Não esfregar o olho.\n- Usar óculos de proteção em trabalhos com risco.\n\nRetorno ao PS, se:\n- Piora da visão.\n- Dor intensa que não melhora em 24 a 48 horas.\n- Mancha branca na córnea ou secreção purulenta.\n- Sensação de corpo estranho persistente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "olho-vermelho-doloroso-baixa-visual-aguda"}, {"id": "conjuntivite-alergica", "nome": "Conjuntivite alérgica", "cid": "H10.1", "categoria": "oftalmologia", "abas": [{"nome": "Receita", "texto": "USO OFTÁLMICO\n\n1) Olopatadina colírio 0,1% [Patanol®] ------------------------ 01 frasco\nAplicar 1 gota em cada olho, de 12/12 horas, por 7 dias.\n\n2) Carboximetilcelulose 0,5% [Adaptis ®] ------------------------ 01 frasco\nAplicar 1 gota em cada olho, de 4/4 horas, se irritação.\n\nOrientações\n- Evitar poeira, fumaça e pelos de animais.\n- Não esfregar os olhos.\n- Realizar compressas frias.\n- Suspender lentes de contato durante os sintomas.\n\nRetorno ao PS, se:\n- Dor ocular intensa.\n- Redução da visão.\n- Fotofobia importante.\n- Edema importante das pálpebras.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "conjuntivite-aguda"}, {"id": "blefarite", "nome": "Blefarite", "cid": "H01.0", "categoria": "oftalmologia", "abas": [{"nome": "Receita", "texto": "USO OFTÁLMICO\n\n1) 1)Hialuronato de sódio 0,15% [Hyabak®] ------------------------ 01 frasco\nInstilar 1 gota em cada olho acometido, via oftálmica, de 4 a 8 vezes ao dia, até melhora dos sintomas.\n\n2) Eritromicina pomada oftálmica [Eritromicina®] ------------------------ 01 bisnaga\nAplicar pequena quantidade na margem palpebral, à noite, por 7 dias.\n\nOrientações\n- Higienizar os cílios diariamente.\n- Realizar compressas mornas.\n- Suspender maquiagem temporariamente.\n- Evitar esfregar os olhos.\n\nRetorno ao PS, se:\n- Dor ocular intensa.\n- Redução da visão.\n- Edema importante das pálpebras.\n- Vermelhidão progressiva.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "conjuntivite-aguda"}, {"id": "olho-seco", "nome": "Olho seco", "cid": "H04.1", "categoria": "oftalmologia", "abas": [{"nome": "Receita", "texto": "USO OFTÁLMICO\n1) Carboximetilcelulose 0,5% [Fresh Tears®] ------------------------ 01 frasco\nPingar 1 gota em cada olho, 4 a 6 vezes ao dia.\n2) Hialuronato de sódio gel 0,2% [Adaptis Gel®] ------------------------ 01 bisnaga\nAplicar em cada olho, à noite, antes de dormir.\n\nOrientações\n- Fazer pausas no uso de telas e piscar com frequência.\n- Evitar vento direto e ar-condicionado no rosto.\n- Compressas mornas nas pálpebras pela manhã.\n- Avaliação oftalmológica se não melhorar.\n\nRetorno ao PS, se:\n- Dor ocular intensa.\n- Piora da visão.\n- Olho muito vermelho com secreção."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "conjuntivite-aguda"}, {"id": "calazio", "nome": "Calázio", "cid": "H00.1", "categoria": "oftalmologia", "abas": [{"nome": "Receita", "texto": "OUTROS\n1) Compressas mornas nas pálpebras ------------------------ uso contínuo\nAplicar por 10 a 15 minutos, 4 vezes ao dia, seguidas de massagem suave em direção aos cílios.\n2) Higiene palpebral com xampu infantil diluído ------------------------ uso contínuo\nLimpar a borda das pálpebras 2 vezes ao dia.\n\nOrientações\n- A maioria melhora em 4 a 6 semanas.\n- Não espremer.\n- Encaminhar ao oftalmologista se não melhorar em 1 mês ou se recorrente.\n\nRetorno ao PS, se:\n- Vermelhidão e inchaço que se espalham pela pálpebra.\n- Febre.\n- Alteração da visão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "conjuntivite-aguda"}, {"id": "hemorragia-subconjuntival", "nome": "Hemorragia subconjuntival", "cid": "H11.3", "categoria": "oftalmologia", "abas": [{"nome": "Receita", "texto": "USO OFTÁLMICO\n\n1) Carboximetilcelulose 0,5% [Adaptis ®] ------------------------ 01 frasco\nAplicar 1 gota em cada olho, de 6/6 horas, se desconforto.\n\nOrientações\n- Evitar esfregar os olhos.\n- Verificar pressão arterial.\n- Evitar esforço excessivo nos primeiros dias.\n- A resolução costuma ocorrer espontaneamente.\n\nRetorno ao PS, se:\n- Dor ocular.\n- Alteração visual.\n- História de trauma ocular.\n- Episódios recorrentes.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "conjuntivite-aguda"}, {"id": "dengue-grupo-a", "nome": "Dengue (grupos A, B e C)", "cid": "A90", "categoria": "infectologia", "abas": [{"nome": "Grupo A", "texto": "USO ORAL\n\n1) Soro de Reidratação Oral [Floralyte®] ------------------------ 10 sachês\nDiluir 1 sachê conforme orientação da embalagem. Ingerir 60 mL/kg/dia, sendo 1/3 do volume total em SRO e 2/3 em líquidos claros.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se febre ou dor.\n\n3) Ondansetrona 4 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nOrientações\n- Fazer repouso relativo.\n- Não utilizar AAS ou anti-inflamatórios.\n- Manter hidratação rigorosa.\n- Preferir água, água de coco, sucos e soluções de reidratação oral.\n- Dar atenção especial ao período em que a febre começar a diminuir.\n\nRetorno ao PS, se:\n- Dor abdominal intensa ou progressiva.\n- Vômitos persistentes.\n- Sangramentos.\n- Sonolência excessiva.\n- Tontura ou desmaio.\n- Falta de ar.\n- Redução importante do volume urinário.\n- Piora importante do estado geral."}, {"nome": "Grupo B", "texto": "USO ORAL\n\n1) Soro de Reidratação Oral [Floralyte®] ------------------------ Quantidade suficiente\nDiluir 1 sachê conforme orientação da embalagem. Ingerir 10 mL/kg nas primeiras 4 horas.\n\nUSO ENDOVENOSO\n\n2) Ondansetrona 4 mg [Vonau®] ------------------------ 01 ampola\nAplicar 1 ampola, via endovenosa lenta, AGORA.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 01 ampola\nAplicar 1 ampola, via endovenosa lenta, AGORA, se febre ou dor.\n\n4) Soro fisiológico 0,9% ------------------------ 01 bolsa\nInfundir 500 a 1.000 mL, via endovenosa, em 1 a 2 horas.\n\nUSO ORAL\n\n5) Soro de Reidratação Oral [Floralyte®] ------------------------ 10 sachês\nDiluir 1 sachê conforme orientação da embalagem. Ingerir 60 mL/kg/dia, sendo 1/3 do volume total em SRO e 2/3 em líquidos claros.\n\n6) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se febre ou dor.\n\n7) Ondansetrona 4 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos."}, {"nome": "Grupo C", "texto": "USO ENDOVENOSO\n\n1) Soro fisiológico 0,9% ------------------------ Quantidade suficiente\nInfundir 20 mL/kg, via endovenosa, em 1 hora.\n\nOU\nRinger Lactato ------------------------ Quantidade suficiente\nInfundir 20 mL/kg, via endovenosa, em 1 hora.\n\n2) Soro fisiológico 0,9% ------------------------ Quantidade suficiente\nInfundir 25 mL/kg, via endovenosa, em 6 horas.\n\nOU\nRinger Lactato ------------------------ Quantidade suficiente\nInfundir 25 mL/kg, via endovenosa, em 6 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "sindrome-febril-aguda-arbovirose-com-sinais-de-alarme"}, {"id": "herpes-labial", "nome": "Herpes labial", "cid": "B00.1", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Aciclovir 200 mg [Zovirax®] ------------------------ 25 comprimidos\nTomar 1 comprimido, via oral, 5 vezes ao dia, por 5 dias.\n\nOU\nValaciclovir 1 g [Valtrex®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\nOU\nValaciclovir 1 g [Valtrex®] ------------------------ 04 comprimidos\nTomar 2 comprimidos (2 g), via oral, agora.\nApós 12 horas:\nTomar 2 comprimidos (2 g), via oral.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\n\nEm caso de dor:\nTomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\nOrientações\n- Iniciar o antiviral o mais precocemente possível.\n- Evitar manipular as lesões.\n- Não compartilhar copos, talheres, toalhas ou batom.\n- Evitar beijar enquanto houver vesículas ativas.\n- Utilizar protetor labial com FPS.\n- Se recorrências frequentes, procurar acompanhamento médico.\n\nRetorno ao PS, se:\n- Lesão ocular.\n- Febre persistente ou recorrente.\n- Lesões extensas.\n- Dificuldade para alimentação.\n- Sinais de infecção secundária.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "lesoes-vesiculares-herpes-zoster"}, {"id": "chikungunya-fase-aguda", "nome": "Chikungunya — fase aguda", "cid": "A92.0", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOU\nParacetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre. Máximo de 4 comprimidos por dia.\n\nSe dor intensa refratária:\n2) Tramadol 50 mg [Tramal®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se dor intensa, por até 3 dias.\n\nOrientações\n- Não usar anti-inflamatórios nem AAS até ser descartada dengue.\n- Não usar corticoide na fase aguda.\n- Manter hidratação: 2 a 3 litros de líquidos por dia.\n- Compressas frias nas articulações.\n- Usar repelente para não transmitir.\n- Doença de notificação compulsória.\n\nRetorno ao PS, se:\n- Dor abdominal intensa ou vômitos persistentes.\n- Sangramentos.\n- Tontura ou desmaio.\n- Confusão mental.\n- Falta de ar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "sindrome-febril-aguda-arbovirose-com-sinais-de-alarme"}, {"id": "mononucleose-infecciosa", "nome": "Mononucleose infecciosa", "cid": "B27.9", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n2) Flurbiprofeno pastilha [Strepsils®] ------------------------ 01 caixa\nDissolver 1 pastilha lentamente na boca, de 6/6 horas, se dor de garganta.\n\nOrientações\n- Evitar esportes de contato e esforço físico por pelo menos 4 semanas (risco de ruptura do baço).\n- Não usar amoxicilina ou ampicilina (causam manchas na pele).\n- Evitar compartilhar copos e beijo enquanto houver sintomas.\n- O cansaço pode durar semanas.\n\nRetorno ao PS, se:\n- Dor abdominal forte, principalmente do lado esquerdo.\n- Dificuldade para respirar ou engolir saliva.\n- Pele ou olhos amarelados.\n- Sangramentos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "faringite-faringoamigdalite-aguda"}, {"id": "caxumba", "nome": "Caxumba", "cid": "B26.9", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Afastamento por 5 dias após o início do inchaço.\n- Compressas frias ou mornas no local, conforme alívio.\n- Preferir alimentos pastosos e evitar ácidos (sucos cítricos).\n- Verificar vacinação dos contatos.\n\nRetorno ao PS, se:\n- Dor ou inchaço nos testículos.\n- Dor de cabeça intensa, vômitos ou rigidez de nuca.\n- Dor abdominal intensa.\n- Perda de audição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "leptospirose-forma-leve", "nome": "Leptospirose — forma leve", "cid": "A27.9", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Doxiciclina 100 mg [Vibramicina®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU (gestantes)\nAmoxicilina 500 mg [Amoxil®] ------------------------ 21 cápsulas\nTomar 1 cápsula, via oral, de 8/8 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Não usar AAS nem anti-inflamatórios.\n- Manter hidratação.\n- Doença de notificação compulsória.\n- Reavaliação clínica em 24 a 72 horas.\n\nRetorno ao PS, se:\n- Pele ou olhos amarelados.\n- Diminuição da urina.\n- Sangramentos ou tosse com sangue.\n- Falta de ar.\n- Tontura ou confusão mental."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "sindrome-febril-aguda-arbovirose-com-sinais-de-alarme"}, {"id": "zika", "nome": "Zika", "cid": "A92.8", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n2) Bilastina 20 mg [Alektos®] ------------------------ 07 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum (1 hora antes ou 2 horas após alimentos), se coceira.\n\nOrientações\n- Não usar AAS ou anti-inflamatórios até ser descartada dengue.\n- Usar repelente e preservativo (transmissão sexual).\n- Gestantes: notificar e informar o pré-natal.\n- Doença de notificação compulsória.\n\nRetorno ao PS, se:\n- Fraqueza nas pernas que sobe pelo corpo.\n- Sangramentos.\n- Dor abdominal intensa ou vômitos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "sindrome-febril-aguda-arbovirose-com-sinais-de-alarme"}, {"id": "escarlatina-adulto", "nome": "Escarlatina (adulto)", "cid": "A38", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Amoxicilina 500 mg [Amoxil®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, de 8/8 horas, por 10 dias.\n\nOU\nUSO INTRAMUSCULAR\nPenicilina G Benzatina 1.200.000 UI [Benzetacil®] ------------------------ 01 frasco-ampola\nAplicar 1.200.000 UI, via intramuscular profunda, dose única.\n\nAlérgicos à penicilina:\n\nUSO ORAL\nAzitromicina 500 mg [Zitromax®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Completar 10 dias de antibiótico.\n- Afastamento por 24 horas após o início do antibiótico.\n- A pele pode descamar nas mãos e nos pés após a melhora.\n\nRetorno ao PS, se:\n- Febre persistente após 48 horas.\n- Dificuldade para engolir ou abrir a boca.\n- Urina escura ou inchaço.\n- Dor nas articulações."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "faringite-faringoamigdalite-aguda"}, {"id": "doenca-mao-pe-boca-adulto", "nome": "Doença mão-pé-boca (adulto)", "cid": "B08.4", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nUSO TÓPICO ORAL\n2) Benzidamina spray [Flogoral®] ------------------------ 01 frasco\nAplicar 2 a 4 jatos na boca, de 8/8 horas, se dor.\n\nOrientações\n- Preferir alimentos frios e pastosos.\n- Manter hidratação.\n- Lavar bem as mãos; o vírus sai nas fezes por semanas.\n- Evitar contato próximo com crianças enquanto houver lesões.\n\nRetorno ao PS, se:\n- Incapacidade de beber líquidos.\n- Dor de cabeça intensa, vômitos ou rigidez de nuca.\n- Sonolência ou confusão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "faringite-faringoamigdalite-aguda"}, {"id": "sarampo-caso-suspeito-sem-gravidade", "nome": "Sarampo — caso suspeito (sem gravidade)", "cid": "B05.9", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Paracetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n2) Vitamina A (palmitato de retinol) 200.000 UI ------------------------ 02 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, por 2 dias.\n\nOrientações\n- Notificação IMEDIATA (até 24 horas) à vigilância epidemiológica.\n- Coletar sorologia e swab conforme a vigilância.\n- Isolamento domiciliar até 4 dias após o surgimento das manchas.\n- Vacinação de bloqueio dos contatos.\n- Usar máscara.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Confusão mental, convulsão ou sonolência.\n- Desidratação.\n- Febre que volta após melhora."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "profilaxia-pos-exposicao-ao-hiv-pep", "nome": "Profilaxia pós-exposição ao HIV (PEP)", "cid": "Z20.6", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "RECEITA MÉDICA\n\nUSO ORAL\n\n1) Tenofovir/Lamivudina (TDF/3TC) 300 mg/300 mg ------------------------- 28 comprimidos\nTomar 1 comprimido, via oral, uma vez ao dia, por 28 dias.\n\n2) Dolutegravir (DTG) 50 mg ------------------------- 28 comprimidos\nTomar 1 comprimido, via oral, uma vez ao dia, por 28 dias.\nTomar junto com a medicação acima.\n\n3) Bromoprida 10 mg ------------------------- 1 caixa\nNo caso de enjoo ou vômitos, tomar 1 comprimido via oral, a cada 8 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "acidente-ocupacional-exposicao-a-material-biologico"}, {"id": "quimioprofilaxia-contato-de-doenca-meningococica", "nome": "Quimioprofilaxia — contato de doença meningocócica", "cid": "Z20.8", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Rifampicina 300 mg [Rifaldin®] ------------------------ 08 cápsulas\nTomar 2 cápsulas (600 mg), via oral, de 12/12 horas, por 2 dias.\n\nOU\nCiprofloxacino 500 mg [Cipro®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, dose única.\n\nOU (gestantes)\n\nUSO INTRAMUSCULAR\nCeftriaxona 500 mg [Rocefin®] ------------------------ 01 frasco-ampola\nAplicar 250 mg, via intramuscular, dose única.\n\nOrientações\n- Iniciar idealmente nas primeiras 24 horas do contato.\n- Rifampicina deixa urina e lágrimas alaranjadas e reduz o efeito do anticoncepcional.\n- Indicada apenas para contatos próximos (moradores do domicílio, contato íntimo).\n\nRetorno ao PS, se:\n- Febre, dor de cabeça intensa ou rigidez de nuca.\n- Manchas roxas na pele.\n- Vômitos ou sonolência."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "exposicao-de-risco-profilaxia"}, {"id": "esquistossomose-forma-intestinal", "nome": "Esquistossomose (forma intestinal)", "cid": "B65.9", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Praziquantel 600 mg [Cestox®] ------------------------ conforme peso\nTomar 50 mg/kg, via oral, em dose única, após refeição (ex.: 60 kg = 3.000 mg = 5 comprimidos).\n\nOrientações\n- Pode causar tontura, sonolência e dor abdominal no dia.\n- Não dirigir no dia do tratamento.\n- Exame de fezes de controle em 3 a 4 meses.\n- Doença de notificação em área não endêmica.\n\nRetorno ao PS, se:\n- Vômitos com sangue ou fezes escuras.\n- Barriga crescendo (inchaço abdominal).\n- Pele ou olhos amarelados."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "diarreia-aguda"}, {"id": "linfadenite-bacteriana-aguda", "nome": "Linfadenite bacteriana aguda", "cid": "L04.9", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cefalexina 500 mg [Keflex®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 7 dias.\n\nOU\nAmoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Compressas mornas no local, 3 a 4 vezes ao dia.\n- Reavaliar em 48 a 72 horas.\n- Linfonodo que não reduz em 4 semanas deve ser investigado.\n\nRetorno ao PS, se:\n- Aumento rápido, amolecimento ou saída de pus.\n- Febre persistente.\n- Dificuldade para engolir ou respirar (se no pescoço)."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "lesao-de-pele-infecciosa-abscesso"}, {"id": "gengivoestomatite-herpetica-adulto", "nome": "Gengivoestomatite herpética (adulto)", "cid": "B00.2", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Valaciclovir 500 mg [Valtrex®] ------------------------ 28 comprimidos\nTomar 2 comprimidos (1 g), via oral, de 12/12 horas, por 7 dias.\n\nOU\nAciclovir 400 mg [Zovirax®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nUSO TÓPICO ORAL\n3) Benzidamina colutório [Flogoral®] ------------------------ 01 frasco\nBochechar 15 mL por 30 segundos, de 8/8 horas, sem engolir.\n\nOrientações\n- Alimentos frios e pastosos; evitar ácidos e salgados.\n- Manter hidratação.\n- Não compartilhar talheres e copos.\n\nRetorno ao PS, se:\n- Incapacidade de beber líquidos.\n- Lesões nos olhos.\n- Febre alta persistente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "faringite-faringoamigdalite-aguda"}, {"id": "mpox-caso-leve", "nome": "Mpox — caso leve", "cid": "B04", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n2) Hidroxizina 25 mg [Hixizine®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, se coceira.\n\nOrientações\n- Isolamento até todas as crostas caírem e a pele cicatrizar.\n- Cobrir as lesões e usar máscara perto de outras pessoas.\n- Não compartilhar roupas, toalhas e talheres; lavar roupas separadamente.\n- Evitar relações sexuais até a cura.\n- Doença de notificação compulsória; testar HIV e outras IST.\n\nRetorno ao PS, se:\n- Lesões nos olhos ou dor ocular.\n- Dor intensa ao evacuar ou urinar.\n- Lesões com pus, vermelhidão e calor.\n- Falta de ar ou confusão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "exantema-febril-doenca-infecciosa"}, {"id": "tracoma", "nome": "Tracoma", "cid": "A71.9", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Azitromicina 500 mg [Zitromax®] ------------------------ 02 comprimidos\nTomar 2 comprimidos (1 g), via oral, em dose única.\n\nOU\nUSO OFTÁLMICO\nTetraciclina 1% pomada oftálmica ------------------------ 01 bisnaga\nAplicar em ambos os olhos, 2 vezes ao dia, por 6 semanas.\n\nOrientações\n- Examinar e tratar os contatos da casa.\n- Lavar o rosto das crianças com frequência.\n- Doença de notificação compulsória.\n- Encaminhar ao oftalmologista se cílios voltados para dentro."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "conjuntivite-aguda"}, {"id": "hanseniase-caso-novo-pqt-u", "nome": "Hanseníase — caso novo (PQT-U)", "cid": "A30.9", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL (adulto, acima de 50 kg)\n1) Poliquimioterapia única adulto [PQT-U] ------------------------ cartelas\nDose mensal supervisionada (na UBS): Rifampicina 600 mg + Clofazimina 300 mg + Dapsona 100 mg.\nDoses diárias autoadministradas: Clofazimina 50 mg + Dapsona 100 mg, 1 vez ao dia.\nPaucibacilar: 6 cartelas. Multibacilar: 12 cartelas.\n\nOrientações\n- Tratamento e dispensação pela UBS ou centro de referência.\n- Doença de notificação compulsória; examinar os contatos.\n- A clofazimina escurece a pele (reversível após o fim).\n- A urina pode ficar avermelhada no dia da dose mensal.\n- Após a primeira dose, a doença não é mais transmitida.\n\nRetorno ao PS, se:\n- Manchas avermelhadas e dolorosas novas.\n- Dor ou perda de força em nervos (mãos, pés, rosto).\n- Falta de ar, cansaço intenso ou pele amarelada (dapsona).\n- Febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "reacao-hansenica-tipo-1-reacao-reversa", "nome": "Reação hansênica tipo 1 (reação reversa)", "cid": "A30.9", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Prednisona 20 mg [Meticorten®] ------------------------ conforme peso\nTomar 1 mg/kg/dia (ex.: 60 kg = 3 comprimidos), via oral, pela manhã. Reduzir gradualmente conforme melhora, sob acompanhamento.\n\nAntes de iniciar o corticoide (profilaxia de estrongiloidíase):\n2) Ivermectina 6 mg [Revectina®] ------------------------ 02 comprimidos\nTomar 200 mcg/kg, via oral, dose única.\n3) Omeprazol 20 mg [Losec®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, em jejum, durante o uso do corticoide.\n\nOrientações\n- Não interromper a poliquimioterapia.\n- Avaliação neurológica simplificada no acompanhamento.\n- Controlar glicemia e pressão arterial.\n- Acompanhamento no centro de referência.\n\nRetorno ao PS, se:\n- Perda de força ou dormência piorando.\n- Dor intensa em nervos.\n- Glicemia muito alta."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "reacao-hansenica-tipo-2-eritema-nodoso-hansenico", "nome": "Reação hansênica tipo 2 (eritema nodoso hansênico)", "cid": "A30.9", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\nPrimeira escolha (homens e mulheres sem possibilidade de gestação, sob protocolo do programa):\n1) Talidomida 100 mg ------------------------ conforme protocolo\nTomar 100 a 400 mg por dia, via oral, à noite, conforme gravidade. Receita e termo específicos do programa.\n\nSe talidomida contraindicada:\n2) Prednisona 20 mg [Meticorten®] ------------------------ conforme peso\nTomar 1 mg/kg/dia, via oral, pela manhã, com redução gradual.\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Talidomida é proibida em gestantes e mulheres em idade fértil sem contracepção adequada.\n- Profilaxia de estrongiloidíase antes do corticoide.\n- Não interromper a poliquimioterapia.\n- Acompanhamento no centro de referência.\n\nRetorno ao PS, se:\n- Febre alta, dor nas articulações ou nos olhos.\n- Dor ou perda de força em nervos.\n- Inchaço nas pernas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "leishmaniose-tegumentar-forma-cutanea", "nome": "Leishmaniose tegumentar (forma cutânea)", "cid": "B55.1", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "Tratamento em serviço de referência:\n\nUSO INTRAMUSCULAR / ENDOVENOSO\n1) Antimoniato de meglumina 300 mg Sb5+/mL [Glucantime®] ------------------------ conforme peso\nAplicar 15 mg Sb5+/kg/dia, via intramuscular ou endovenosa, 1 vez ao dia, por 20 dias.\nRealizar ECG, função renal e hepática antes e durante o tratamento.\n\nAlternativa oral (conforme protocolo do MS):\n2) Miltefosina 50 mg ------------------------ conforme peso\nTomar 2,5 mg/kg/dia, via oral, dividido em 2 a 3 tomadas, após as refeições, por 28 dias. Proibida na gestação.\n\nOrientações\n- Doença de notificação compulsória.\n- Antimonial é contraindicado na gestação, cardiopatia e insuficiência renal.\n- Manter a ferida limpa e coberta.\n\nRetorno ao PS, se:\n- Palpitações ou desmaio.\n- Dor muscular ou articular intensa.\n- Vômitos persistentes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "doenca-de-chagas-fase-aguda", "nome": "Doença de Chagas — fase aguda", "cid": "B57.1", "categoria": "infectologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Benznidazol 100 mg ------------------------ conforme peso\nTomar 5 mg/kg/dia, via oral, dividido em 2 tomadas (12/12 horas), após as refeições, por 60 dias (máximo 300 mg/dia).\n\nOrientações\n- Doença de notificação compulsória (imediata).\n- Tratamento com acompanhamento no serviço de referência.\n- Hemograma e função hepática durante o tratamento.\n- Não ingerir bebidas alcoólicas.\n- Contraindicado na gestação.\n\nRetorno ao PS, se:\n- Manchas ou bolhas na pele, coceira intensa.\n- Febre, inchaço nos gânglios.\n- Formigamento nas mãos e pés.\n- Falta de ar, palpitações ou inchaço."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "sindrome-febril-aguda-arbovirose-com-sinais-de-alarme"}, {"id": "anemia-ferropriva", "nome": "Anemia ferropriva", "cid": "D50.9", "categoria": "clinica-geral", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Sulfato ferroso 40 mg de ferro elementar [Sulfato Ferroso EMS®] ------------------------ 90 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia (ou em dias alternados, se intolerância), 30 minutos antes do almoço, com suco de laranja, por 3 meses.\n\nOrientações\n- Não tomar junto com leite, café, chá ou antiácidos.\n- As fezes ficam escuras: é esperado.\n- Investigar a causa da anemia (sangramento menstrual, digestivo, dieta).\n- Repetir hemograma e ferritina em 4 a 8 semanas.\n\nRetorno ao PS, se:\n- Fezes pretas e pastosas com mal cheiro intenso ou sangue vivo.\n- Falta de ar, dor no peito ou desmaio.\n- Palpitações intensas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "fadiga-anemia"}, {"id": "picada-de-escorpiao-leve", "nome": "Picada de escorpião — leve", "cid": "T63.2", "categoria": "clinica-geral", "abas": [{"nome": "No PS", "texto": "USO INFILTRATIVO\n1) Lidocaína 2% sem vasoconstritor ------------------------ 01 frasco-ampola\nInfiltrar 2 a 4 mL no local da picada. Pode repetir após 1 hora, se dor intensa.\n\nUSO ENDOVENOSO\n2) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\n\nObservar por 4 a 6 horas (adulto). Soro antiescorpiônico não indicado na forma leve.\n\nNotificar o acidente."}, {"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Compressas mornas no local para alívio da dor.\n- Sacudir roupas e sapatos antes de usar; manter a casa limpa.\n\nRetorno ao PS, se:\n- Vômitos, sudorese intensa ou salivação.\n- Agitação, tremores ou sonolência.\n- Falta de ar ou palpitações."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "picada-acidente-com-animal-peconhento"}, {"id": "picada-de-aranha-leve-sem-sinais-sistemicos", "nome": "Picada de aranha — leve (sem sinais sistêmicos)", "cid": "T63.3", "categoria": "clinica-geral", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n2) Hidroxizina 25 mg [Hixizine®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, se coceira.\n\nSe dor local intensa (suspeita de armadeira):\nInfiltração local com lidocaína 2% sem vasoconstritor, 2 a 4 mL, no PS.\n\nOrientações\n- Lavar o local com água e sabão.\n- Não fazer cortes, sucção ou torniquete.\n- Suspeita de aranha-marrom: lesão pode piorar em 24 a 72 horas; reavaliar diariamente.\n- Notificar o acidente.\n\nRetorno ao PS, se:\n- Lesão escurecendo, bolhas ou dor que aumenta.\n- Urina escura ou avermelhada.\n- Febre, manchas pelo corpo ou mal-estar.\n- Sudorese, vômitos ou palpitações."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "picada-acidente-com-animal-peconhento"}, {"id": "desidratacao-leve-adulto-idoso", "nome": "Desidratação leve (adulto/idoso)", "cid": "E86", "categoria": "clinica-geral", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Tomar 2 a 3 litros nas primeiras 4 horas, em pequenos goles, e depois conforme a sede.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas.\n\nOrientações\n- Idosos: oferecer líquidos ativamente, mesmo sem sede.\n- Evitar álcool e excesso de cafeína.\n- Atenção à quantidade de urina.\n\nRetorno ao PS, se:\n- Urina muito escassa ou ausente.\n- Confusão mental ou sonolência.\n- Tontura ao levantar ou desmaio.\n- Vômitos que impedem a ingestão de líquidos."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "exposicao-ao-sol-calor-desidratacao"}, {"id": "anafilaxia-alta-apos-tratamento", "nome": "Anafilaxia", "cid": "T78.2", "categoria": "clinica-geral", "abas": [{"nome": "No PS", "texto": "USO INTRAMUSCULAR\n\n1) Adrenalina 1 mg/mL [Adren®] ------------------------ 01 ampola\nAplicar 0,5 mL, via intramuscular, no vasto lateral da coxa, IMEDIATAMENTE.\n\nUSO ENDOVENOSO\n\n2) Soro fisiológico 0,9% ------------------------ 01 bolsa\nInfundir rapidamente, via endovenosa.\n\n3) Dexclorfeniramina 5 mg/mL [Polaramine®] ------------------------ 01 ampola\nAplicar 1 ampola, via endovenosa lenta.\n\n4) Hidrocortisona 500 mg [Androcortil®] ------------------------ 01 frasco-ampola\nDiluir em 100 mL de SF 0,9% e infundir, via endovenosa, em 20 minutos.\n\nUSO INALATÓRIO\n\n5) Salbutamol 5 mg/mL [Aerolin®] ------------------------ 01 ampola\nDiluir em SF 0,9% e nebulizar.\n\nUSO INTRAMUSCULAR\n\n6) Adrenalina auto-injetor 0,3 mg [EpiPen®] ------------------------ 02 unidades\nAplicar 1 dose, via intramuscular, ao primeiro sinal de nova reação grave.\n\nOrientações\n- Evitar rigorosamente o alérgeno suspeito.\n- Manter acompanhamento com alergologista.\n- Permanecer em observação após resolução dos sintomas.\n\nRetorno ao PS, se:\n- Recorrência dos sintomas.\n- Falta de ar.\n- Rouquidão.\n- Edema facial.\n- Tontura ou desmaio.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "urticaria-aguda-reacao-alergica-cutanea"}, {"id": "exaustao-pelo-calor", "nome": "Exaustão pelo calor", "cid": "T67.5", "categoria": "clinica-geral", "abas": [{"nome": "No PS", "texto": "USO ENDOVENOSO\n1) Soro fisiológico 0,9% ------------------------ 01 bolsa\nInfundir 1.000 mL, via endovenosa, em 1 hora, se não tolerar via oral.\n2) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, se cefaleia.\n\nOUTROS\n3) Resfriamento: ambiente fresco, retirar roupas excessivas, compressas frias em axilas, virilhas e pescoço."}, {"nome": "Receita de alta", "texto": "USO ORAL\n1) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Tomar ao longo do dia.\n\nOrient
