  --r:10px; --r-sm:7px; --accent-2:#16766C; --ok:#2E7D4F; --ok-bg:#E3F3E8; --mid:#B97412; --mid-bg:#FDF0D9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#3FB3A3; --accent-hover:#5CC6B7; --accent-soft:#12302B; --accent-fg:#04211D;
  --warn-bg:#3A1612; --warn-line:#5A231D; --warn-fg:#F2A096; --note-bg:#10291F; --note-line:#1D463E; --note-fg:#8FD3C6;
  --star:#F2B85A; --paper:#0D1917; --paper-line:#21342F; --field:#3A2A0C; --shadow:0 1px 2px rgba(0,0,0,.3);
  --accent-2:#2A8C7F; --ok:#7FD39B; --ok-bg:#16301F; --mid:#F2B85A; --mid-bg:#3A2A0C;
  color-scheme:dark}}
:root[data-theme="dark"]{

  --warn-bg:#3A1612; --warn-line:#5A231D; --warn-fg:#F2A096; --note-bg:#10291F; --note-line:#1D463E; --note-fg:#8FD3C6;

*{box-sizing:border-box}

/* ---------- cabeçalho ---------- */

.top .wrap{display:grid;gap:12px;padding-block:14px 12px}
.brand-row{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--accent) 0%,var(--accent-2) 100%);box-shadow:0 4px 12px -4px var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:-.02em;flex:none}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.icon-btn{height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500}

.sections{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}

.sec-btn:hover{border-color:var(--accent)}
.sec-btn[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px -8px var(--accent)}

.search{position:relative}

.search input{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 44px 0 42px;font-size:16px;box-shadow:var(--shadow)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}

/* ---------- corpo ---------- */

.card .s{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .vazio{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;vertical-align:1px}
.star{width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--line);display:grid;place-items:center;font-size:20px;line-height:1}

.star.on{color:var(--star)}

.detail{min-width:0;display:grid;gap:14px}

.d-head h2{margin:4px 0 8px;font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}

.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.paper{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}

.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}

.toggle .sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}

.toggle input:checked + .sw{background:var(--accent)}

.rx{display:block;width:100%;min-height:340px;max-height:70vh;resize:vertical;border:0;padding:16px 18px;background:var(--paper);font-family:var(--f-mono);font-size:13.5px;line-height:1.6;white-space:pre-wrap;tab-size:2}

.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}

.block textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);resize:vertical;font-size:14px}

.editbar{border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);padding:14px;display:grid;gap:12px}

.welcome{border:1px dashed var(--line);border-radius:var(--r);padding:40px 24px;text-align:center;color:var(--muted)}

/* ---------- modal e aviso ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,20,16,.45);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

mark{background:var(--field);color:inherit;border-radius:3px;padding:0 1px}

.combo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.draft-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--star);background:var(--field);font-size:14px}

.blk-search{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.blk-list{display:grid;gap:6px;max-height:52vh;overflow:auto;padding-right:2px}

/* prontuário com IA */

uadro-leve", "nome": "COVID-19 — quadro leve", "cid": "U07.1", "categoria": "pneumologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOU\nParacetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre. Máximo de 4 comprimidos por dia.\n\nSe tosse seca e intensa:\n2) Levodropropizina 6 mg/mL [Antux®] ------------------------ 01 frasco\nTomar 10 mL, via oral, de 8/8 horas, se necessário.\n\nUSO NASAL\n3) Soro fisiológico 0,9% ------------------------ 01 frasco\nAplicar 20 mL em cada narina, várias vezes ao dia.\n\nGrupo de risco (≥65 anos, imunossuprimidos ou comorbidades), até 5 dias do início dos sintomas — considerar antiviral conforme disponibilidade no SUS:\nNirmatrelvir 150 mg + Ritonavir 100 mg [Paxlovid®] ------------------------ 01 caixa\nTomar 2 comprimidos de nirmatrelvir + 1 comprimido de ritonavir, via oral, de 12/12 horas, por 5 dias. Checar interações medicamentosas e função renal.\n\nOrientações\n- Isolamento domiciliar e uso de máscara enquanto houver sintomas, por no mínimo 5 dias.\n- Manter hidratação e repouso relativo.\n- Higienizar as mãos com frequência.\n\nRetorno ao PS, se:\n- Falta de ar ou cansaço aos pequenos esforços.\n- Saturação abaixo de 94% (se tiver oxímetro).\n- Dor no peito.\n- Confusão mental ou sonolência excessiva.\n- Febre persistente após 3 dias."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "coqueluche-adulto", "nome": "Coqueluche (adulto)", "cid": "A37.9", "categoria": "pneumologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Azitromicina 250 mg [Zitromax®] ------------------------ 06 comprimidos\nTomar 2 comprimidos, via oral, no 1º dia. Do 2º ao 5º dia, tomar 1 comprimido, via oral, 1 vez ao dia.\n\nOU\nClaritromicina 500 mg [Klaricid®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nAlérgicos a macrolídeos:\nSulfametoxazol + Trimetoprima 800/160 mg [Bactrim F®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 14 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Afastamento das atividades até completar 5 dias de antibiótico.\n- Contatos próximos devem ser avaliados para quimioprofilaxia.\n- Doença de notificação compulsória.\n- A tosse pode persistir por semanas mesmo após o tratamento.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Crises de tosse com cianose ou desmaio.\n- Vômitos persistentes após a tosse.\n- Febre alta."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "dpoc-exacerbacao-leve", "nome": "DPOC — exacerbação", "cid": "J44.1", "categoria": "pneumologia", "abas": [{"nome": "Leve", "texto": "USO INALATÓRIO\n\n1) Salbutamol 100 mcg [Aerolin®] ------------------------ 01 frasco\nAplicar 2 jatos, via inalatória, de 4/4 horas, se falta de ar.\n\nUSO ORAL\n\n2) Prednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 2 comprimidos, via oral, pela manhã, por 5 dias.\n\n3) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\nOrientações\n- Suspender tabagismo.\n- Utilizar espaçador, se disponível.\n- Manter hidratação adequada.\n- Manter a medicação de manutenção habitual.\n\nRetorno ao PS, se:\n- Falta de ar progressiva.\n- Sonolência excessiva.\n- Cianose.\n- Dor torácica.\n- Febre persistente ou recorrente.\n- Piora importante do estado geral.\n\nOUTROS ATB\nAzitromicina 500 mg [Zitromax®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n\nOU\nDoxiciclina 100 mg [Vibramicina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\nOU\nLevofloxacino 750 mg [Levaquin®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias."}, {"nome": "Moderada", "texto": "USO INALATÓRIO\n\n1) Salbutamol 5 mg/mL [Aerolin®] ------------------------ 01 ampola\nDiluir em SF 0,9% e nebulizar AGORA.\n\n2) Brometo de Ipratrópio 0,25 mg/mL [Atrovent®] ------------------------ 01 ampola\nDiluir e nebulizar junto ao salbutamol AGORA.\n\nUSO ENDOVENOSO\n\n3) Metilprednisolona 40 mg [Solu-Medrol®] ------------------------ 01 frasco-ampola\nDiluir em 100 mL de SF 0,9% e infundir, via endovenosa, em 20 minutos.\n\nOU\nHidrocortisona 100 mg [Androcortil®] ------------------------ 02 frascos-ampola\nDiluir 200 mg em 100 mL de SF 0,9% e infundir, via endovenosa, em 20 minutos.\nDEXAMETASONA 10 mg/2,5 mL ------------------------ 1 ampola\nAplicar 10 mg IM ou EV, dose única.\n\n4) Ceftriaxona 1 g [Rocefin®] ------------------------ 01 frasco-ampola\nDiluir em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos.\n\nUSO ORAL\n\n5) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\nOU\nAzitromicina 500 mg [Zitromax®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n\nOU\nLevofloxacino 750 mg [Levaquin®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n\nOrientações\n- Manter internação hospitalar.\n- Evitar tabagismo.\n- Manter hidratação adequada.\n- Revisar tratamento de manutenção após estabilização.\n\nRetorno ao PS, se:\n- Falta de ar progressiva.\n- Sonolência excessiva.\n- Cianose.\n- Dor torácica.\n- Febre persistente ou recorrente.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dispneia-aguda-crise-asmatica-dpoc-exacerbado"}, {"id": "asma-tratamento-de-manutencao-mart", "nome": "Asma — tratamento de manutenção (MART)", "cid": "J45.9", "categoria": "pneumologia", "abas": [{"nome": "Receita de alta", "texto": "USO INALATÓRIO\n1) Budesonida + Formoterol 200/6 mcg [Alenia®] ------------------------ 01 dispositivo\nFazer 1 inalação, via inalatória, de 12/12 horas, todos os dias.\nFazer 1 inalação adicional se falta de ar ou chiado.\nMáximo de 12 inalações por dia.\nEnxaguar a boca após o uso.\n\nOrientações\n- Não suspender a medicação mesmo com melhora.\n- Revisar a técnica inalatória.\n- Evitar fumaça, poeira, mofo e cigarro.\n- Agendar acompanhamento na UBS ou com pneumologista.\n- Manter vacinação de influenza e COVID-19 em dia.\n\nRetorno ao PS, se:\n- Necessidade de mais de 8 inalações em um dia.\n- Falta de ar progressiva.\n- Dificuldade para falar frases completas.\n- Lábios arroxeados."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "consulta-administrativa-renovacao-de-receita-assintomatico"}, {"id": "bronquiectasias-exacerbacao-leve", "nome": "Bronquiectasias — exacerbação leve", "cid": "J47", "categoria": "pneumologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 14 dias.\n\nSe colonização prévia por Pseudomonas:\nCiprofloxacino 750 mg [Cipro®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 14 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nUSO INALATÓRIO\n3) Salbutamol spray 100 mcg/dose [Aerolin®] ------------------------ 01 frasco\nFazer 2 jatos, via inalatória, com espaçador, de 6/6 horas, se falta de ar.\n\nOrientações\n- Manter fisioterapia respiratória e drenagem de secreções.\n- Colher escarro para cultura antes do antibiótico, se possível.\n- Manter acompanhamento com pneumologista.\n\nRetorno ao PS, se:\n- Falta de ar progressiva.\n- Escarro com sangue em quantidade.\n- Febre persistente após 72 horas de antibiótico.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "influenza-quimioprofilaxia-pos-exposicao", "nome": "Influenza — quimioprofilaxia pós-exposição", "cid": "Z20.8", "categoria": "pneumologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Fosfato de Oseltamivir 75 mg [Tamiflu®] ------------------------ 10 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, por 10 dias.\nIniciar até 48 horas após a última exposição.\n\nSe ClCr 30-60 mL/min: 30 mg 1 vez ao dia.\n\nOrientações\n- Indicada para pessoas de risco expostas a caso confirmado ou suspeito.\n- Procurar atendimento se surgirem febre, tosse ou dor de garganta.\n\nRetorno ao PS, se:\n- Febre.\n- Falta de ar.\n- Piora do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "exposicao-de-risco-profilaxia"}, {"id": "tuberculose-pulmonar-esquema-basico-adulto", "nome": "Tuberculose pulmonar — esquema básico (adulto)", "cid": "A15.0", "categoria": "pneumologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n\nFase intensiva (2 meses):\n1) Rifampicina + Isoniazida + Pirazinamida + Etambutol 150/75/400/275 mg [RHZE] ------------------------ conforme peso\nTomar, via oral, 1 vez ao dia, em jejum, por 2 meses:\n- 20 a 35 kg: 2 comprimidos.\n- 36 a 50 kg: 3 comprimidos.\n- 51 a 70 kg: 4 comprimidos.\n- Acima de 70 kg: 5 comprimidos.\n\nFase de manutenção (4 meses):\n2) Rifampicina + Isoniazida 150/75 mg [RH] ------------------------ conforme peso\nTomar, via oral, 1 vez ao dia, em jejum, por 4 meses, na mesma faixa de peso acima.\n\nOrientações\n- Doença de notificação compulsória; tratamento e dispensação pelo programa de TB da UBS.\n- Tratamento diretamente observado (TDO) sempre que possível.\n- Urina e lágrimas podem ficar alaranjadas.\n- Não ingerir bebidas alcoólicas.\n- Contatos devem ser avaliados na UBS.\n- Usar máscara até 15 dias de tratamento.\n\nRetorno ao PS, se:\n- Pele ou olhos amarelados.\n- Náuseas e vômitos persistentes.\n- Alteração da visão.\n- Tosse com sangue em quantidade.\n- Falta de ar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "tosse-por-hiper-reatividade-bronquica-pos-viral", "nome": "Tosse por hiper-reatividade brônquica pós-viral", "cid": "J98.8", "categoria": "pneumologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Bilastina 20 mg [Alektos®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum (1 hora antes ou 2 horas após alimentos), por 10 dias.\n\nSe suspeita de rinite:\n\nUSO NASAL\n\n2) CLORIDRATO DE AZELASTINA + FUROATO DE FLUTICASONA (Dymista®) ------------------------ 1 frasco\nAplicar 1 jato em cada narina de 12/12 horas, por 14 dias.\n\nOU\nFuroato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 01 frasco\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 14 dias.\n\n3) Lavagem nasal com SF 0,9% ------------------------ 01 frasco\nAplicar 20 a 50 mL em cada narina, via nasal, 3 a 6 vezes ao dia.\n\nSe suspeita de asma:\n\nUSO INALATÓRIO\n\n4) Budesonida + Formoterol 200/6 mcg [Alenia®] ------------------------ 01 dispositivo\nFazer 1 inalação, via inalatória, quando necessário para sintomas. Pode repetir após alguns minutos se necessário. Máximo de 12 inalações por dia.\n\nUSO ORAL\n\n5) Dextrometorfano 15 mg [Bisoltussin®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tosse, por até 5 dias.\n\n6) Codeína 30 mg [Codein®] ------------------------ 12 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tosse intensa, por até 3 dias.\n\nSe tosse persistente, avaliar:\n\n7) Prednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 2 comprimidos, via oral, 1 vez ao dia, pela manhã, por 5 dias.\n\nOrientações\n- Identificar e evitar desencadeantes como poeira, mofo, fumaça, perfumes e pelos de animais.\n- Realizar lavagem nasal diariamente.\n- Evitar tabagismo ativo e passivo.\n- Preferir ambientes ventilados.\n- Manter uso regular do corticoide nasal quando houver rinite associada.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Chiado intenso no peito.\n- Dificuldade para falar frases completas.\n- Tosse com sangue.\n- Dor torácica.\n- Febre persistente ou recorrente.\n- Piora progressiva apesar do tratamento.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "faringoamigdalite-bacteriana", "nome": "Faringoamigdalite bacteriana", "cid": "J03.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "RECEITA MÉDICA\n\nUSO ORAL\n\n1) [ATAKCLAV] Amoxicilina + Clavulanato 875/125 mg ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nAmoxicilina + Clavulanato 500/125 mg [Clavulin®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 7 dias.\n\n2) Flurbiprofeno pastilha (Strepsils®) ------------------------ 01 caixa\nTomar 1 pastilha, dissolvendo lentamente na boca, de 6/6 horas, se necessário.\n\n3) Dipirona 1 g [Novalgina] ------------------------ 20 comprimidos\n\nEm caso de febre ou dor:\nTomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\n4) Ondansetrona 4 mg [VONAU] ------------------------ 01 caixa\n\nEm caso de náuseas ou vômitos:\nTomar 1 comprimido, via oral, de 8/8 horas, se necessário.\n\n5) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, se dor, por até 5 dias.\n\nORIENTAÇÕES\n- Completar o antibiótico até o último dia, mesmo que haja melhora precoce.\n- Manter hidratação adequada.\n- Fazer repouso relativo.\n- Preferir dieta fria ou morna.\n- Gargarejos com água morna e sal podem aliviar a dor.\n- Evitar cigarro e bebidas alcoólicas.\n\nRetornar imediatamente ao PS se:\n- Febre persistente apesar do antibiótico.\n- Dificuldade progressiva para engolir.\n- Dificuldade para abrir a boca.\n- Alteração da voz (\"voz abafada\").\n- Inchaço importante do pescoço.\n- Falta de ar.\n- Queda importante do estado geral."}, {"nome": "Opções de antibiótico", "texto": "Primeira escolha\n\n1) Amoxicilina + Clavulanato 875/125 mg ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 10 dias.\n\nOpção IM\n\n2) Penicilina G Benzatina 1.200.000 UI ------------------------ 01 ampola\nAplicar 1 ampola, via IM profunda em glúteo, em dose única.\n\nOpção oral\n\n3) Cefalexina 500 mg ------------------------ 40 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, por 10 dias.\n\nAlérgicos à penicilina\n\n4) Azitromicina 500 mg ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, de 24/24 horas, por 5 dias.\n\n⚠️ Evitar cefuroxima em pacientes com história de anafilaxia à penicilina. Nesses casos, preferir a azitromicina."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "faringite-faringoamigdalite-aguda"}, {"id": "rinossinusite-aguda-bacteriana", "nome": "Rinossinusite aguda bacteriana", "cid": "J01.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nAmoxicilina + Clavulanato 500/125 mg [Clavulin®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 7 dias.\n\nOU\nDoxiciclina 100 mg [Vibramicina®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nUSO NASAL\n\n3) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 01 frasco\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 14 dias.\n\nOrientações\n- Realizar lavagem nasal com soro fisiológico 0,9% várias vezes ao dia.\n- Manter hidratação adequada.\n- Completar o tratamento antibiótico prescrito.\n- Evitar fumaça, poeira e ambientes com ar-condicionado excessivo.\n- Fazer repouso relativo.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Dor facial intensa ou progressiva.\n- Edema ou vermelhidão ao redor dos olhos.\n- Alteração visual.\n- Vômitos persistentes.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "rinossinusite-congestao-nasal-e-dor-facial"}, {"id": "rinite-alergica", "nome": "Rinite alérgica", "cid": "J30.4", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO NASAL\n1) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 02 frascos\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 30 dias.\nDirecionar o jato para a parede lateral da narina.\n2) Soro fisiológico 0,9% ------------------------ 01 frasco\nAplicar 20 a 50 mL em cada narina, 2 a 3 vezes ao dia.\n\nUSO ORAL\n3) Bilastina 20 mg [Alektos®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum (1 hora antes ou 2 horas após alimentos), por 10 dias.\n\nOrientações\n- Evitar poeira, mofo, ácaros, pelos de animais e fumaça.\n- Lavar roupas de cama semanalmente com água quente.\n- O corticoide nasal tem efeito pleno após alguns dias de uso regular.\n- Não usar descongestionantes nasais por conta própria.\n\nRetorno ao PS, se:\n- Falta de ar ou chiado.\n- Febre com secreção purulenta.\n- Dor facial intensa."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "rinite-alergica-agudizada"}, {"id": "otite-media-aguda-adulto", "nome": "Otite média aguda (adulto)", "cid": "H66.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 10 dias.\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se febre ou dor.\n\n4) Ondansetrona 4 mg [Vonau®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nOrientações\n- Fazer repouso relativo.\n- Manter boa hidratação.\n- Evitar introduzir cotonetes ou objetos no ouvido.\n- Evitar entrada de água no ouvido.\n- Completar todo o esquema antibiótico.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Piora dos sintomas.\n- Dor intensa progressiva.\n- Inchaço ou vermelhidão atrás da orelha.\n- Tontura intensa.\n- Paralisia facial.\n- Alteração do estado de consciência."}, {"nome": "Com perfuração timpânica", "texto": "Orientações\n- Não manipular o ouvido.\n- Evitar entrada de água no conduto auditivo.\n- Não usar cotonetes.\n- Não pingar medicamentos não prescritos.\n\nRetorno ao PS, se:\n- Persistência de secreção.\n- Febre persistente ou recorrente.\n- Piora da dor.\n- Tontura intensa.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "otalgia-otite-media"}, {"id": "otite-externa", "nome": "Otite externa", "cid": "H60.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita", "texto": "USO OTOLÓGICO\n\n1) Ciprofloxacino + Hidrocortisona otológico [Otociriax HC®] ------------------------ 01 frasco\nPingar 3 gotas na orelha acometida, via otológica, de 12/12 horas, por 7 dias.\n\nUSO ORAL\n\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se febre ou dor.\n\n4) Bromoprida 10 mg [Digesan®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nOrientações\n- Não entrar em piscina, rio ou mar até resolução completa.\n- Evitar molhar o ouvido.\n- Não usar cotonetes.\n- Não manipular o conduto auditivo.\n- Secar apenas a parte externa da orelha após o banho.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Piora dos sintomas.\n- Edema importante da orelha.\n- Vermelhidão da face.\n- Saída abundante de secreção.\n- Dor intensa.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "otite-externa-aguda"}, {"id": "faringite-viral", "nome": "Faringite viral", "cid": "J02.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Flurbiprofeno pastilha (Strepsils®) ------------------------ 01 caixa\nTomar 1 pastilha, dissolvendo lentamente na boca, de 6/6 horas, se necessário.\n\nEm caso de febre ou dor:\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se necessário.\n\nEm caso de náuseas ou vômitos:\n\n3) Ondansetrona 8 mg [Vonau®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 8/8 horas, se necessário.\n\nEm caso de ausência de melhora da dor com as pastilhas:\n\n4) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, se dor, por até 5 dias.\n\nOrientações\n- Fazer repouso relativo.\n- Manter hidratação adequada.\n- Preferir alimentos frios ou mornos e de consistência macia.\n- Realizar gargarejos com água morna e sal para alívio dos sintomas.\n- Evitar tabagismo e bebidas alcoólicas.\n- Não utilizar antibióticos sem prescrição médica.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Dificuldade para engolir saliva.\n- Dificuldade para falar.\n- Falta de ar.\n- Inchaço importante no pescoço.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "faringite-faringoamigdalite-aguda"}, {"id": "laringite-aguda", "nome": "Laringite aguda", "cid": "J04.0", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n3) Flurbiprofeno pastilha [Strepsils®] ------------------------ 01 caixa\nDissolver 1 pastilha lentamente na boca, de 6/6 horas, se dor.\n\nOrientações\n- Repouso vocal: evitar falar alto ou sussurrar.\n- Ingerir bastante líquido e manter o ambiente umidificado.\n- Evitar cigarro, álcool e bebidas muito geladas.\n- Rouquidão por mais de 3 semanas deve ser avaliada pelo otorrino.\n\nRetorno ao PS, se:\n- Falta de ar.\n- Ruído ao respirar (estridor).\n- Dificuldade para engolir saliva.\n- Febre alta persistente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tosse-sindrome-gripal-infeccao-de-vias-aereas"}, {"id": "cerume-impactado", "nome": "Cerume impactado", "cid": "H61.2", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO OTOLÓGICO\n1) Trolamina + Oxiquinolina [Cerumin®] ------------------------ 01 frasco\nPingar 5 gotas na orelha acometida, 2 vezes ao dia, por 4 a 5 dias, antes da lavagem otológica.\nManter algodão na entrada do conduto por 10 minutos após pingar.\n\nOrientações\n- Não usar cotonetes nem objetos no ouvido.\n- Retornar para lavagem otológica após o preparo.\n- Não fazer lavagem se houver perfuração timpânica conhecida.\n\nRetorno ao PS, se:\n- Dor intensa.\n- Saída de secreção ou sangue.\n- Tontura intensa.\n- Perda súbita da audição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "otalgia-otite-media"}, {"id": "epistaxe-anterior-controlada", "nome": "Epistaxe anterior (controlada)", "cid": "R04.0", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO NASAL\n1) Neomicina + Bacitracina pomada [Nebacetin®] ------------------------ 01 bisnaga\nAplicar pequena quantidade na narina acometida, 2 vezes ao dia, por 7 dias.\n2) Soro fisiológico 0,9% ------------------------ 01 frasco\nAplicar 3 jatos em cada narina, 3 vezes ao dia, para manter a mucosa úmida.\n\nOrientações\n- Se sangrar de novo: sentar, inclinar a cabeça para frente e apertar a parte mole do nariz por 10 a 15 minutos sem soltar.\n- Não assoar o nariz com força nem colocar o dedo no nariz por 1 semana.\n- Evitar esforço físico, banhos muito quentes e exposição ao sol por 48 horas.\n- Controlar a pressão arterial.\n\nRetorno ao PS, se:\n- Sangramento que não para após 20 minutos de compressão.\n- Sangramento volumoso ou pela boca.\n- Tontura ou desmaio.\n- Uso de anticoagulante com sangramento recorrente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "epistaxe"}, {"id": "vertigem-periferica-labirintite", "nome": "Vertigem periférica (labirintite)", "cid": "H81.3", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dimenidrinato 50 mg [Dramin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tontura ou náuseas, por até 3 dias.\n\nOU\nMeclizina 25 mg [Meclin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tontura, por até 3 dias.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nOrientações\n- Usar os remédios para tontura apenas por poucos dias: o uso prolongado atrasa a recuperação.\n- Retomar as atividades e movimentos aos poucos, assim que possível.\n- Evitar dirigir e locais altos enquanto houver tontura.\n- Pode causar sonolência.\n\nRetorno ao PS, se:\n- Fala enrolada, visão dupla ou dificuldade para engolir.\n- Fraqueza ou dormência em braço ou perna.\n- Dificuldade para andar ou ficar em pé.\n- Dor de cabeça intensa e súbita.\n- Perda súbita da audição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tontura-sindrome-vestibular"}, {"id": "otite-media-com-efusao-serosa-adulto", "nome": "Otite média com efusão (serosa) — adulto", "cid": "H65.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO NASAL\n1) Soro fisiológico 0,9% ------------------------ 01 frasco\nAplicar 20 a 50 mL em cada narina, 2 a 3 vezes ao dia.\n\nSe rinite associada:\n2) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 02 frascos\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 30 dias.\n\nUSO ORAL\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Antibiótico não é indicado sem sinais de infecção aguda.\n- Efusão unilateral persistente no adulto deve ser avaliada pelo otorrino (avaliação da nasofaringe).\n- Encaminhamento ao otorrino se persistir por mais de 3 meses ou perda auditiva importante.\n\nRetorno ao PS, se:\n- Dor intensa ou febre.\n- Saída de secreção pelo ouvido.\n- Tontura intensa.\n- Fraqueza na face."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "otalgia-otite-media"}, {"id": "otomicose", "nome": "Otomicose", "cid": "B36.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO OTOLÓGICO\n1) Clotrimazol 1% solução tópica [Canesten®] ------------------------ 01 frasco\nPingar 3 a 4 gotas na orelha acometida, 2 vezes ao dia, por 14 dias.\n\nUSO ORAL\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Manter o ouvido seco: proteger com algodão e vaselina no banho.\n- Não usar cotonetes.\n- Não entrar em piscina, rio ou mar até a cura.\n- Pode ser necessária limpeza do conduto pelo otorrino.\n\nRetorno ao PS, se:\n- Dor intensa ou progressiva.\n- Inchaço ou vermelhidão atrás da orelha.\n- Febre.\n- Piora da audição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "otite-externa-aguda"}, {"id": "rinossinusite-cronica-controle", "nome": "Rinossinusite crônica — controle", "cid": "J32.9", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO NASAL\n1) Soro fisiológico 0,9% (lavagem de alto volume) ------------------------ 01 frasco\nAplicar 100 a 250 mL em cada narina com seringa ou frasco de lavagem, 2 vezes ao dia.\n2) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 06 frascos\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 3 meses.\n\nOrientações\n- Tratamento de longo prazo: não suspender por conta própria.\n- Encaminhamento ao otorrinolaringologista para avaliação.\n- Evitar cigarro e poluentes.\n\nRetorno ao PS, se:\n- Inchaço ou vermelhidão ao redor dos olhos.\n- Alteração da visão.\n- Dor de cabeça intensa com febre.\n- Rigidez de nuca."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "rinossinusite-congestao-nasal-e-dor-facial"}, {"id": "rinite-medicamentosa-uso-abusivo-de-descongestionante", "nome": "Rinite medicamentosa (uso abusivo de descongestionante)", "cid": "J31.0", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO NASAL\n1) Furoato de mometasona 50 mcg/jato [Nasonex®] ------------------------ 02 frascos\nAplicar 2 jatos em cada narina, 2 vezes ao dia, por 14 dias. Depois, 2 jatos 1 vez ao dia por mais 30 dias.\n2) Soro fisiológico 0,9% ------------------------ 01 frasco\nAplicar 20 a 50 mL em cada narina, 3 a 4 vezes ao dia.\n\nUSO ORAL\n\nSe obstrução muito intensa na primeira semana:\n3) Prednisona 20 mg [Meticorten®] ------------------------ 10 comprimidos\nTomar 2 comprimidos, via oral, pela manhã, por 5 dias.\n\nOrientações\n- Suspender totalmente o descongestionante nasal (nafazolina, oximetazolina).\n- A obstrução costuma piorar nos primeiros dias e melhora em 1 a 2 semanas.\n- Pode-se suspender uma narina de cada vez para facilitar.\n\nRetorno ao PS, se:\n- Sangramento nasal que não para.\n- Febre com dor facial.\n- Falta de ar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "rinossinusite-congestao-nasal-e-dor-facial"}, {"id": "abscesso-periamigdaliano-apos-drenagem", "nome": "Abscesso periamigdaliano — após drenagem", "cid": "J36", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 10 dias.\n\nAlérgicos à penicilina:\nClindamicina 300 mg [Dalacin C®] ------------------------ 40 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 10 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n3) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n\nOrientações\n- Completar todo o antibiótico.\n- Dieta fria ou morna e pastosa.\n- Gargarejos com água morna e sal.\n- Agendar reavaliação com otorrino em 48 a 72 horas.\n\nRetorno ao PS, se:\n- Dificuldade para abrir a boca ou engolir saliva.\n- Voz abafada.\n- Falta de ar.\n- Inchaço no pescoço.\n- Febre persistente após 48 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "faringite-faringoamigdalite-aguda"}, {"id": "perda-auditiva-subita-neurossensorial", "nome": "Perda auditiva súbita neurossensorial", "cid": "H91.2", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Prednisona 20 mg [Meticorten®] ------------------------ 30 comprimidos\nTomar 3 comprimidos (60 mg), via oral, pela manhã, por 7 dias.\nDepois, 2 comprimidos por 3 dias e 1 comprimido por 3 dias.\n2) Omeprazol 20 mg [Losec®] ------------------------ 14 cápsulas\nTomar 1 cápsula, via oral, em jejum, por 14 dias.\n\nOrientações\n- Iniciar o corticoide o mais cedo possível.\n- Encaminhamento ao otorrino com urgência e audiometria.\n- Diabéticos: controlar a glicemia durante o uso do corticoide.\n- Evitar ruídos intensos.\n\nRetorno ao PS, se:\n- Tontura intensa ou dificuldade para andar.\n- Fraqueza na face, fala enrolada ou visão dupla.\n- Dor de cabeça intensa.\n- Glicemia muito elevada."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "otalgia-otite-media"}, {"id": "doenca-de-meniere-crise", "nome": "Doença de Ménière — crise", "cid": "H81.0", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dimenidrinato 50 mg [Dramin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tontura ou náuseas, por até 3 dias.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n3) Dicloridrato de Betaistina 24 mg [Betaserc®] ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, de uso contínuo.\n\nOrientações\n- Reduzir o sal da alimentação (menos de 2 g de sódio por dia).\n- Evitar cafeína, álcool e cigarro.\n- Encaminhamento ao otorrino para acompanhamento.\n- Não dirigir durante as crises.\n\nRetorno ao PS, se:\n- Fala enrolada, visão dupla ou fraqueza no corpo.\n- Dificuldade para andar.\n- Dor de cabeça intensa e súbita.\n- Vômitos persistentes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tontura-sindrome-vestibular"}, {"id": "neurite-vestibular", "nome": "Neurite vestibular", "cid": "H81.2", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dimenidrinato 50 mg [Dramin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se tontura ou náuseas, por até 3 dias.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nSe início há menos de 72 horas (considerar):\n3) Prednisona 20 mg [Meticorten®] ------------------------ 24 comprimidos\nTomar 3 comprimidos, via oral, pela manhã, por 5 dias. Depois, 2 comprimidos por 2 dias e 1 comprimido por 5 dias.\n\nOrientações\n- Usar os remédios para tontura somente nos primeiros dias.\n- Movimentar-se e caminhar com apoio assim que possível: acelera a recuperação.\n- Reabilitação vestibular se tontura persistir.\n- Não dirigir enquanto houver tontura.\n\nRetorno ao PS, se:\n- Fala enrolada, visão dupla ou dificuldade para engolir.\n- Fraqueza ou dormência em braço ou perna.\n- Incapacidade de ficar em pé ou andar.\n- Dor de cabeça intensa e súbita.\n- Perda da audição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "tontura-sindrome-vestibular"}, {"id": "gastroenterite-aguda-diarreia", "nome": "Gastroenterite aguda (diarreia)", "cid": "A09", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "Diarreia\n\nUSO ORAL\n\n1) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Ingerir pequenos volumes frequentemente e 200 a 250 mL após cada evacuação líquida.\n\nSe náuseas ou vômitos:\n\n2) Ondansetrona 8 mg [Ondif®] ------------------------ 10 folhas orodispersíveis\nColocar 1 folha sobre a língua, via oral, de 8/8 horas, se necessário, por até 3 dias.\n\n3) Racecadotrila 100 mg [Tiorfan®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 8/8 horas, até cessar a diarreia, por no máximo 7 dia\n\n4) Probiótico 20 bi  ------------------------ 05 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, por 5 dias.\n\nOrientações\n- Manter alimentação habitual.\n- Evitar jejum prolongado.\n- Preferir refeições leves e fracionadas.\n- Evitar álcool.\n- Manter hidratação adequada.\n\nRetorno ao PS, se:\n- Vômitos persistentes.\n- Tontura importante.\n- Redução importante da diurese.\n- Sangue nas fezes.\n- Incapacidade de ingerir líquidos.\n- Febre persistente ou recorrente.\n- Piora importante do estado geral.\n\nSe desidratação:\n\nUSO ENDOVENOSO\n\n1) Ringer Lactato 1.000 mL ------------------------ 01 bolsa\nInfundir 1.000 mL, via endovenosa, em 1 a 2 horas.\n\n2) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa, lentamente, dose única.\n\n3) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa, lentamente, dose única."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "diarreia-aguda"}, {"id": "dispepsia-gastrite", "nome": "Dispepsia / gastrite", "cid": "K29.7", "categoria": "gastroenterologia", "abas": [{"nome": "Úlcera / gastrite", "texto": "NO PS\n\nUSO ENDOVENOSO\n\n1) Pantoprazol 40 mg [Pantozol®] ------------------------ 1 ampola\nAplicar 1 ampola, agora.\n\n2) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\n\n3) Hidróxido de alumínio + Hidróxido de magnésio + Simeticona suspensão oral [Mylanta Plus®] ------------------------ 01 frasco\nTomar 10 a 20 mL, via oral, de 6/6 horas, se necessário para azia, queimação ou dor epigástrica.\n\nSe dor moderada:\n\n4) Paracetamol 1 g/100 mL [Paracetamol Fresenius Kabi®] ------------------------ 01 frasco\nAplicar 1 g, via endovenosa.\nInfundir em 15 minutos.\n\nSe dor intensa:\n\n5) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%.\nAplicar 2 mg, via endovenosa lenta.\nRepetir a cada 5 a 10 minutos.\nDose usual total: 4 a 10 mg.\n\nPARA CASA\n\nUSO ORAL\n\n1) Dexlansoprazol 60 mg [Dexilant®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, por 28 dias.\n\nOU\nPantoprazol 40 mg [Pantozol®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum, 30 a 60 minutos antes do café da manhã, por 28 dias.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\n3) Hidróxido de alumínio + Hidróxido de magnésio + Simeticona suspensão oral [Mylanta Plus®] ------------------------ 01 frasco\nTomar 10 a 20 mL, via oral, de 6/6 horas, se necessário para azia, queimação ou dor epigástrica.\n\nOrientações\n- Evitar anti-inflamatórios.\n- Evitar bebidas alcoólicas.\n- Evitar tabagismo.\n- Fazer refeições leves e fracionadas.\n\nRetorno ao PS, se:\n- Vômitos persistentes.\n- Fezes escurecidas.\n- Vômitos com sangue.\n- Dor intensa.\n- Tontura ou desmaios.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dispepsia-epigastralgia-aguda"}, {"id": "doenca-do-refluxo-gastroesofagico", "nome": "Doença do refluxo gastroesofágico", "cid": "K21.9", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "Para Casa\n\n1) Dexlansoprazol 60 mg [Dexilant®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, por 28 dias.\n\nOU\nPantoprazol 40 mg [Pantozol®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, em jejum, 30 a 60 minutos antes do café da manhã, por 28 dias.\n\n2) Hidróxido de alumínio + Hidróxido de magnésio + Simeticona suspensão oral [Mylanta Plus®] ------------------------ 01 frasco\nTomar 10 a 20 mL, via oral, de 6/6 horas, se necessário para azia, queimação ou dor epigástrica..\n\nOrientações\n- Tomar o IBP sempre 30 minutos antes das refeições, preferencialmente antes do café da manhã.\n- Evitar deitar por pelo menos 2 a 3 horas após as refeições.\n- Elevar a cabeceira da cama cerca de 10 a 20 cm se sintomas noturnos.\n- Reduzir ou evitar:\n- Refeições volumosas.\n- Alimentos gordurosos.\n- Chocolate.\n- Café em excesso.\n- Bebidas alcoólicas.\n- Refrigerantes.\n- Hortelã.\n- Evitar tabagismo.\n- Incentivar perda de peso em pacientes com sobrepeso ou obesidade.\n- Evitar roupas apertadas na região abdominal.\n\nSe sintomas intensos ou noturnos frequentes\n\n1) Omeprazol 40 mg ------------------------ 56 cápsulas\nTomar 1 cápsula, via oral, 30 minutos antes do café da manhã.\nTomar 1 cápsula, via oral, 30 minutos antes do jantar.\nManter por 4 semanas.\nAlternativa\n\n1) Pantoprazol 40 mg ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, 30 minutos antes do café da manhã, por 4 semanas.\nAlívio rápido dos sintomas\n\n1) Hidróxido de Magnésio + Hidróxido de Alumínio + Simeticona ------------------------ 1 frasco\nTomar 10 mL, via oral, após as refeições e antes de dormir, se sintomas.\nMáximo: 4 vezes ao dia.\n\nSe predomínio de plenitude pós-prandial ou empachamento\n\n1) Domperidona 10 mg ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 15 a 30 minutos antes das principais refeições, de 8/8 horas, por até 2 semanas.\n\nEvitar se:\n- QT longo.\n- Uso concomitante de macrolídeos.\n- Arritmias cardíacas.\n\nOrientações\n- Tomar o IBP sempre 30 minutos antes das refeições, preferencialmente antes do café da manhã.\n- Evitar deitar por pelo menos 2 a 3 horas após as refeições.\n- Elevar a cabeceira da cama cerca de 10 a 20 cm se sintomas noturnos.\n- Reduzir ou evitar:\n- Refeições volumosas.\n- Alimentos gordurosos.\n- Chocolate.\n- Café em excesso.\n- Bebidas alcoólicas.\n- Refrigerantes.\n- Hortelã.\n- Evitar tabagismo.\n- Incentivar perda de peso em pacientes com sobrepeso ou obesidade.\n- Evitar roupas apertadas na região abdominal.\n\nProcurar avaliação médica se:\n- Disfagia.\n- Odinofagia.\n- Perda de peso inexplicada.\n- Anemia.\n- Vômitos persistentes.\n- Hematêmese ou melena.\n- Sintomas persistentes após 4 a 8 semanas de tratamento."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dispepsia-epigastralgia-aguda"}, {"id": "constipacao-intestinal", "nome": "Constipação intestinal", "cid": "K59.0", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "USO RETAL\n\n1) Supositório de Glicerina [Granado®] ------------------------ 01 unidade\nAplicar 1 unidade, via retal, dose única.\n\nOU\nSorbitol + Laurilsulfato de Sódio [Minilax®] ------------------------ 01 bisnaga\nAplicar 1 bisnaga, via retal, dose única.\n\nUSO ORAL\n\n2) Macrogol 3350 17 g [Muvinlax®] ------------------------ 01 caixa\nDissolver 1 sachê em 200 mL de água e tomar 1 vez ao dia.\n\nOU\nLactulose 667 mg/mL [Lactulona®] ------------------------ 01 frasco\nTomar 15 a 30 mL, via oral, 1 vez ao dia.\n\n3) Bisacodil 5 mg [Dulcolax®] ------------------------ 10 comprimidos\nTomar 1 a 2 comprimidos, via oral, à noite, se permanecer sem evacuar.\n\n4) Dipirona 500 mg [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor abdominal leve.\n\nOrientações\n- Aumentar a ingestão hídrica.\n- Aumentar o consumo de fibras.\n- Praticar atividade física regularmente.\n- Criar rotina para evacuar.\n- Evitar uso frequente de laxantes estimulantes.\n\nRetorno ao PS, se:\n- Dor abdominal intensa ou progressiva.\n- Distensão abdominal importante.\n- Vômitos persistentes.\n- Sangramento nas fezes.\n- Febre persistente ou recorrente.\n- Ausência de eliminação de fezes e gases.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "constipacao-distensao-abdominal"}, {"id": "nauseas-e-vomitos", "nome": "Náuseas e vômitos", "cid": "R11", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nOU\nBromoprida 10 mg [Digesan®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas.\n2) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Tomar em pequenos goles ao longo do dia.\n\nOrientações\n- Ingerir líquidos em pequenas quantidades e com frequência.\n- Refeições leves e fracionadas.\n- Evitar gordura, frituras e álcool.\n\nRetorno ao PS, se:\n- Vômitos persistentes, impedindo a ingestão de líquidos.\n- Vômitos com sangue ou cor de borra de café.\n- Dor abdominal intensa.\n- Tontura, desmaio ou urina muito escassa.\n- Dor de cabeça intensa ou rigidez de nuca."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "vomitos-intensos-emese-incoercivel"}, {"id": "diarreia-com-sangue-disenteria", "nome": "Diarreia com sangue (disenteria)", "cid": "A04.9", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Ciprofloxacino 500 mg [Cipro®] ------------------------ 06 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 3 dias.\n\nOU\nAzitromicina 500 mg [Zitromax®] ------------------------ 03 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 3 dias.\n2) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Tomar 200 a 250 mL após cada evacuação líquida.\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Não usar remédios que \"prendem o intestino\" (loperamida).\n- Manter alimentação leve e hidratação.\n- Lavar bem as mãos após ir ao banheiro.\n\nRetorno ao PS, se:\n- Sangramento em grande quantidade.\n- Febre alta persistente.\n- Dor abdominal intensa.\n- Tontura, desmaio ou urina escassa.\n- Vômitos que impedem a hidratação."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "diarreia-aguda"}, {"id": "intoxicacao-alimentar", "nome": "Intoxicação alimentar", "cid": "A05.9", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Tomar 200 a 250 mL após cada evacuação ou vômito.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n3) Butilbrometo de escopolamina 10 mg [Buscopan®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se cólica.\n4) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Quadro costuma melhorar em 24 a 48 horas.\n- Antibiótico geralmente não é necessário.\n- Refeições leves e fracionadas.\n\nRetorno ao PS, se:\n- Sangue nas fezes.\n- Febre alta.\n- Vômitos persistentes.\n- Visão turva, dificuldade para engolir ou fraqueza muscular.\n- Tontura ou urina escassa."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "diarreia-aguda"}, {"id": "fissura-anal", "nome": "Fissura anal", "cid": "K60.2", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO TÓPICO / ANAL\n1) Diltiazem 2% pomada (manipulada) ------------------------ 30 g\nAplicar pequena quantidade na borda anal, 2 vezes ao dia, por 6 a 8 semanas.\n2) Lidocaína 2% gel [Xylocaína®] ------------------------ 01 bisnaga\nAplicar na região anal antes de evacuar, se dor.\n\nUSO ORAL\n3) Psyllium [Metamucil®] ------------------------ 01 caixa\nDissolver 1 sachê em 1 copo de água, 1 a 2 vezes ao dia.\n4) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOUTROS\n5) Banho de assento com água morna, 2 a 3 vezes ao dia, por 15 minutos, principalmente após evacuar.\n\nOrientações\n- Aumentar a ingestão de água e fibras.\n- Não segurar a vontade de evacuar e evitar esforço.\n- Encaminhar ao proctologista se não melhorar em 8 semanas.\n\nRetorno ao PS, se:\n- Sangramento em grande quantidade.\n- Dor muito intensa com inchaço ou febre.\n- Saída de pus."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-anal-doenca-orificial"}, {"id": "distensao-abdominal-gases", "nome": "Distensão abdominal / gases", "cid": "R14", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Simeticona 125 mg [Luftal®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, de 8/8 horas, após as refeições e ao deitar, por 5 dias.\n\n2) Butilbrometo de escopolamina 10 mg [Buscopan®] ------------------------ 20 comprimidos\n\nEm caso de cólica abdominal associada, tomar 1 comprimido, via oral, de 8/8 horas, se necessário.\n\n3) Carvão ativado 250 mg [Carverol®] ------------------------ 30 cápsulas\nTomar 2 cápsulas, via oral, de 8/8 horas, por 3 dias.\n\nOrientações\n- Manter hidratação adequada.\n- Fazer refeições em menor volume e mastigar lentamente.\n- Evitar bebidas gaseificadas.\n- Reduzir alimentos que aumentam a produção de gases, como feijão, cebola, brócolis, couve-flor, repolho e bebidas fermentadas, conforme tolerância individual.\n- Evitar mascar chicletes e ingerir alimentos rapidamente.\n- Manter atividade física regular.\n- Procurar assistência médica caso os sintomas persistam ou piorem.\n\nRetorno ao PS, se:\n- Dor abdominal intensa ou progressiva.\n- Distensão abdominal importante e persistente.\n- Vômitos persistentes.\n- Incapacidade de eliminar fezes ou gases.\n- Sangue nas fezes.\n- Febre persistente ou recorrente.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "constipacao-distensao-abdominal"}, {"id": "diverticulite-aguda-nao-complicada-ambulatorial", "nome": "Diverticulite aguda não complicada — ambulatorial", "cid": "K57.3", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "NO PS\n\nUSO ENDOVENOSO\n\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta.\n\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n\nSe dor intensa:\n\n3) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%.\nAplicar 2 mg, via endovenosa lenta.\nRepetir a cada 5 a 10 minutos.\nDose usual total: 4 a 10 mg.\n\nSe contraindicação a AINE:\n\n4) Paracetamol 1 g/100 mL [Paracetamol Fresenius Kabi®] ------------------------ 01 frasco\nAplicar 1 g, via endovenosa.\nInfundir em 15 minutos.\n\nPARA CASA\n\nUSO ORAL\n\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Manter hidratação adequada.\n- Preferir dieta leve.\n- Evitar bebidas alcoólicas.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Dor intensa.\n- Vômitos persistentes.\n- Distensão abdominal importante.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "dor-abdominal-suspeita-de-abdome-agudo"}, {"id": "diarreia-por-clostridioides-difficile-nao-grave", "nome": "Diarreia por Clostridioides difficile (não grave)", "cid": "A04.7", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Vancomicina 125 mg (cápsula manipulada) ------------------------ 40 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 10 dias.\n\nSe vancomicina indisponível:\nMetronidazol 500 mg [Flagyl®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 10 dias.\n2) Sais de Reidratação Oral (envelope) ------------------------ 10 envelopes\nDiluir 1 envelope em 1 litro de água. Tomar 200 a 250 mL após cada evacuação líquida.\n\nOrientações\n- Suspender, se possível, o antibiótico que desencadeou o quadro.\n- Não usar antidiarreicos.\n- Lavar as mãos com água e sabão (álcool gel não elimina os esporos).\n- Evitar inibidores de bomba de prótons sem indicação.\n\nRetorno ao PS, se:\n- Febre alta.\n- Dor ou distensão abdominal importante.\n- Mais de 10 evacuações por dia.\n- Tontura, desmaio ou urina escassa.\n- Sangue nas fezes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "diarreia-aguda"}, {"id": "intolerancia-a-lactose", "nome": "Intolerância à lactose", "cid": "E73.9", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Lactase 10.000 FCC [Lactosil®] ------------------------ 01 caixa\nTomar 1 comprimido, via oral, imediatamente antes de consumir leite ou derivados.\n2) Simeticona 125 mg [Luftal®] ------------------------ 01 caixa\nTomar 1 cápsula, via oral, de 8/8 horas, se gases ou distensão.\n\nOrientações\n- Reduzir leite e derivados; preferir produtos sem lactose.\n- Queijos curados e iogurtes costumam ser mais bem tolerados.\n- Garantir ingestão de cálcio por outras fontes.\n\nRetorno ao PS, se:\n- Sangue nas fezes.\n- Perda de peso sem explicação.\n- Dor abdominal intensa.\n- Diarreia persistente com desidratação."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "diarreia-aguda"}, {"id": "cistite-nao-complicada-mulher", "nome": "Cistite não complicada (mulher)", "cid": "N30.0", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\n1) Cefuroxima 250 mg [Zinnat®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\n2) Fenazopiridina 200 mg [Pyridium®] ------------------------ 06 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, após as refeições, por 2 dias.\n\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Aumentar a ingestão hídrica.\n- Não interromper o antibiótico antes do tempo prescrito.\n- A fenazopiridina pode deixar a urina alaranjada ou avermelhada.\n- Não utilizar fenazopiridina por mais de 2 dias.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Dor lombar.\n- Náuseas ou vômitos persistentes.\n- Sangramento urinário importante.\n- Piora dos sintomas.\n- Ausência de melhora após 48 a 72 horas.\n\nOutros Antibióticos:\n\n1) FOSFOMICINA TROMETAMOL 3 g --------------------- 2 envelopes\nDissolver 1 envelope em meio copo de água e tomar via oral, em dose única,preferencialmente à noite, após esvaziar a bexiga.\nRepetir 1 envelope após 24 horas.\n\nOU\nNitrofurantoína 100 mg [Macrodantina®] ------------------------ 20 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 5 dias."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "disuria-sintomas-urinarios-baixos"}, {"id": "colica-renal-litiase", "nome": "Cólica renal (litíase)", "cid": "N23", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "No PS", "texto": "USO ENDOVENOSO\n1) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 02 ampolas\nAplicar 2 g, via endovenosa, diluída em 100 mL de SF 0,9%, em 15 a 20 minutos.\n2) Cetorolaco 30 mg/mL [Toragesic®] ------------------------ 01 ampola\nAplicar 30 mg (1 ampola), via endovenosa lenta (mínimo 15 segundos). Idosos ou peso abaixo de 50 kg: 15 mg.\n3) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa lenta, se náuseas ou vômitos.\n\nSe dor refratária:\n4) Morfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%. Aplicar 2 mg, via endovenosa lenta, podendo repetir a cada 5 a 10 minutos."}, {"nome": "Receita de alta", "texto": "USO ORAL\n1) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nSe cálculo distal de 5 a 10 mm (terapia expulsiva):\n3) Tansulosina 0,4 mg [Secotex®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, por até 4 semanas.\n4) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas ou vômitos.\n\nOrientações\n- Ingerir 2 a 3 litros de água por dia.\n- Coar a urina para tentar recuperar o cálculo.\n- Tansulosina pode causar tontura ao levantar: levantar devagar.\n- Agendar avaliação com urologista e exame de imagem.\n\nRetorno ao PS, se:\n- Febre ou calafrios.\n- Dor que não melhora com as medicações.\n- Ausência de urina.\n- Vômitos persistentes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "colica-nefretica-litiase-renal"}, {"id": "pielonefrite-aguda-ambulatorial", "nome": "Pielonefrite aguda — ambulatorial", "cid": "N10", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita", "texto": "USO ENDOVENOSO\n\n1) Soro fisiológico 0,9% ------------------------ 01 bolsa\nInfundir 500 a 1.000 mL, via endovenosa, conforme necessidade.\n\n2) Dipirona 1 g [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa lenta, AGORA.\n\n3) Ceftriaxona 1 g [Rocefin®] ------------------------ 01 frasco-ampola\nDiluir em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos.\n\nOU\nCeftriaxona 2 g [Rocefin®] ------------------------ 01 frasco-ampola\nDiluir em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos.\n\n4) Fenazopiridina 200 mg [Pyridium®] ------------------------ 06 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, após as refeições, por 2 dias.\n\n5) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Manter hidratação adequada.\n- Completar o tratamento antibiótico.\n- A fenazopiridina pode deixar a urina alaranjada ou avermelhada.\n- Não utilizar fenazopiridina por mais de 2 dias.\n\nRetorno ao PS, se:\n- Febre persistente ou recorrente.\n- Náuseas ou vômitos persistentes.\n- Dor lombar intensa.\n- Redução importante do volume urinário.\n- Tontura ou desmaio.\n- Piora importante do estado geral.\n\nOUTROS ATB\n\n6) Ciprofloxacino 500 mg [Cipro®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nLevofloxacino 750 mg [Levaquin®] ------------------------ 05 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 5 dias.\n\nOU\nAmoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 10 dias."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "febre-com-dor-lombar-suspeita-de-pielonefrite"}, {"id": "cistite-bacteriuria-na-gestacao", "nome": "Cistite / bacteriúria na gestação", "cid": "O23.4", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cefalexina 500 mg [Keflex®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 7 dias.\n\nOU\nFosfomicina trometamol 3 g [Monuril®] ------------------------ 01 envelope\nDissolver em meio copo de água e tomar à noite, após esvaziar a bexiga, em dose única.\n\nOU (evitar no 1º trimestre e após 36 semanas)\nNitrofurantoína 100 mg [Macrodantina®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 7 dias.\n2) Paracetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Colher urocultura de controle 1 a 2 semanas após o fim do tratamento.\n- Aumentar a ingestão de água.\n- Levar esta receita ao pré-natal.\n\nRetorno ao PS, se:\n- Febre ou calafrios.\n- Dor lombar.\n- Contrações, perda de líquido ou sangramento vaginal.\n- Vômitos persistentes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "disuria-sintomas-urinarios-baixos"}, {"id": "orquiepididimite", "nome": "Orquiepididimite", "cid": "N45.9", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Risco de IST (até 35 anos)", "texto": "USO INTRAMUSCULAR\n1) Ceftriaxona 500 mg [Rocefin®] ------------------------ 01 frasco-ampola\nDiluir em 2 mL de lidocaína 1% sem vasoconstritor. Aplicar 500 mg, via intramuscular, dose única.\n\nUSO ORAL\n2) Doxiciclina 100 mg [Vibramicina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 10 dias.\n3) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n4) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Usar cueca justa ou suspensório escrotal e compressas frias.\n- Repouso relativo.\n- Abstinência sexual até o fim do tratamento; parceria deve ser tratada.\n- Testar HIV, sífilis e hepatites.\n\nRetorno ao PS, se:\n- Dor súbita e muito intensa no testículo.\n- Febre alta persistente.\n- Inchaço progressivo ou vermelhidão da pele do escroto.\n- Ausência de melhora em 72 horas."}, {"nome": "Sem risco de IST (acima de 35 anos / germes entéricos)", "texto": "USO ORAL\n1) Levofloxacino 500 mg [Levaquin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 10 dias.\n2) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Usar suspensório escrotal e compressas frias.\n- Repouso relativo.\n- Agendar avaliação com urologista.\n\nRetorno ao PS, se:\n- Dor súbita e muito intensa no testículo.\n- Febre alta persistente.\n- Ausência de melhora em 72 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-testicular-escrotal"}, {"id": "itu-de-repeticao-profilaxia-mulher", "nome": "ITU de repetição — profilaxia (mulher)", "cid": "N39.0", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Nitrofurantoína 100 mg [Macrodantina®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, à noite, todos os dias, por 6 meses.\n\nOU (se infecções relacionadas à relação sexual)\nNitrofurantoína 100 mg [Macrodantina®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, logo após a relação sexual.\n\nOU\nFosfomicina trometamol 3 g [Monuril®] ------------------------ 03 envelopes\nDissolver 1 envelope em meio copo de água, a cada 10 dias, por 6 meses.\n\nOrientações\n- Confirmar as infecções com urocultura antes de iniciar a profilaxia.\n- Ingerir bastante água e não segurar a urina.\n- Urinar após as relações sexuais.\n- Na pós-menopausa, avaliar estrogênio vaginal com o ginecologista.\n\nRetorno ao PS, se:\n- Febre ou calafrios.\n- Dor lombar.\n- Falta de ar ou tosse persistente."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "disuria-sintomas-urinarios-baixos"}, {"id": "infeccao-urinaria-no-homem", "nome": "Infecção urinária no homem", "cid": "N39.0", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Ciprofloxacino 500 mg [Cipro®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nSulfametoxazol + Trimetoprima 800/160 mg [Bactrim F®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n2) Fenazopiridina 200 mg [Pyridium®] ------------------------ 06 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, após as refeições, por 2 dias.\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Colher urocultura antes do antibiótico.\n- Aumentar a ingestão de água.\n- Agendar avaliação com urologista (investigar próstata e vias urinárias).\n\nRetorno ao PS, se:\n- Febre ou calafrios.\n- Dor lombar ou perineal.\n- Dificuldade ou incapacidade para urinar.\n- Ausência de melhora em 48 a 72 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "disuria-sintomas-urinarios-baixos"}, {"id": "prostatite-bacteriana-aguda-ambulatorial", "nome": "Prostatite bacteriana aguda — ambulatorial", "cid": "N41.0", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Ciprofloxacino 500 mg [Cipro®] ------------------------ 56 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 4 semanas.\n\nOU\nLevofloxacino 500 mg [Levaquin®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 4 semanas.\n2) Tansulosina 0,4 mg [Secotex®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia.\n3) Cetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n4) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Colher urocultura antes do antibiótico.\n- Não interromper o antibiótico antes do tempo.\n- Agendar avaliação com urologista.\n\nRetorno ao PS, se:\n- Incapacidade de urinar.\n- Febre alta persistente após 48 horas.\n- Calafrios, tontura ou queda do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "febre-com-dor-lombar-suspeita-de-pielonefrite"}, {"id": "hiperplasia-prostatica-benigna-sintomatica", "nome": "Hiperplasia prostática benigna sintomática", "cid": "N40", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Tansulosina 0,4 mg [Secotex®] ------------------------ 30 cápsulas\nTomar 1 cápsula, via oral, 1 vez ao dia, após o jantar, de uso contínuo.\n\nOrientações\n- Pode causar tontura ao levantar: levantar devagar.\n- Reduzir líquidos à noite, cafeína e álcool.\n- Evitar descongestionantes e antialérgicos que pioram a retenção urinária.\n- Agendar avaliação com urologista e PSA.\n\nRetorno ao PS, se:\n- Incapacidade de urinar.\n- Sangue na urina.\n- Febre ou dor ao urinar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "retencao-urinaria-aguda"}, {"id": "cistite-complicada-diabetica-drc-idosa", "nome": "Cistite complicada (diabética / DRC / idosa)", "cid": "N39.0", "categoria": "urologia-e-nefrologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Cefuroxima 500 mg [Zinnat®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nCiprofloxacino 500 mg [Cipro®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU (se ClCr acima de 30 mL/min)\nNitrofurantoína 100 mg [Macrodantina®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Colher urocultura antes do antibiótico e ajustar conforme resultado.\n- Ajustar doses à função renal.\n- Aumentar a ingestão de água, se não houver restrição.\n\nRetorno ao PS, se:\n- Febre ou calafrios.\n- Dor lombar.\n- Confusão mental ou sonolência.\n- Glicemia muito alta.\n- Ausência de melhora em 48 a 72 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "disuria-sintomas-urinarios-baixos"}, {"id": "uretrite-gonorreia-clamidia", "nome": "Uretrite (gonorreia / clamídia)", "cid": "N34.1", "categoria": "ist", "abas": [{"nome": "Receita", "texto": "USO INTRAMUSCULAR\n\n1) Ceftriaxona 500 mg [Rocefin®] ------------------------ 01 ampola\nDiluir em 2 mL de Lidocaína 1% sem vasoconstrictor.\nAplicar 500 mg, via intramuscular, dose única.\n\nUSO ORAL\n\n2) Doxiciclina 100 mg [Vibramicina®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nAzitromicina 500 mg [Zitromax®] ------------------------ 02 comprimidos\nTomar 2 comprimidos, via oral, em dose única.\n\nSe suspeita de tricomoníase:\n\n3) Metronidazol 500 mg [Flagyl®] ------------------------ 04 comprimidos\nTomar 4 comprimidos (2 g), via oral, em dose única.\n\nSe suspeita ou confirmação de Mycoplasma genitalium:\n\n4) Doxiciclina 100 mg [Vibramicina®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\nMoxifloxacino 400 mg [Avalox®] ------------------------ 07 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 7 dias.\n\nOrientações\n- Não ter relações sexuais até completar o tratamento e o(a) parceiro(a) também ser tratado(a).\n- Tratar parceiros dos últimos 60 dias.\n- Utilizar preservativo em todas as relações.\n- Evitar consumo de bebidas alcoólicas durante o uso de metronidazol.\n\nRetorno ao PS, se:\n- Dor testicular intensa.\n- Febre persistente ou recorrente.\n- Retenção urinária.\n- Dor abdominal importante.\n- Persistência dos sintomas após 7 dias.\n- Piora importante do estado geral."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "hda": "corrimento-uretral-lesao-genital"}, {"id": "sifilis", "nome": "Sífilis", "cid": "A53.9", "categoria": "ist", "abas": [{"nome": "Recente (até 1 ano)", "texto": "USO INTRAMUSCULAR\n1) Penicilina G Benzatina 1.200.000 UI [Benzetacil®] ------------------------ 02 frascos-ampola\nAplicar 2.400.000 UI, via intramuscular, dose única (1.200.000 UI em cada glúteo).\n\nAlérgicos à penicilina (exceto gestantes):\n\nUSO ORAL\nDoxiciclina 100 mg [Vibramicina®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 15 dias.\n\nOrientações\n- Realizar VDRL de controle a cada 3 meses no primeiro ano.\n- Parcerias sexuais devem ser testadas e tratadas.\n- Usar preservativo; testar HIV e hepatites.\n- Doença de notificação compulsória.\n- Pode haver febre e mal-estar nas primeiras 24 horas após a injeção."}, {"nome": "Tardia ou duração ignorada", "texto": "USO INTRAMUSCULAR\n1) Penicilina G Benzatina 1.200.000 UI [Benzetacil®] ------------------------ 06 frascos-ampola\nAplicar 2.400.000 UI, via intramuscular (1.200.000 UI em cada glúteo), 1 vez por semana, por 3 semanas (total 7.200.000 UI).\n\nAlérgicos à penicilina (exceto gestantes):\n\nUSO ORAL\nDoxiciclina 100 mg [Vibramicina®] ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 30 dias.\n\nOrientações\n- O intervalo entre as doses não deve passar de 9 dias; se passar, reiniciar o esquema.\n- VDRL de controle a cada 3 meses no primeiro ano.\n- Parcerias sexuais devem ser testadas e tratadas.\n- Doença de notificação compulsória."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "herpes-genital", "nome": "Herpes genital", "cid": "A60.0", "categoria": "ist", "abas": [{"nome": "Primeiro episódio", "texto": "USO ORAL\n1) Aciclovir 400 mg [Zovirax®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 7 a 10 dias.\n\nOU\nValaciclovir 500 mg [Valtrex®] ------------------------ 28 comprimidos\nTomar 2 comprimidos (1 g), via oral, de 12/12 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO TÓPICO\n3) Lidocaína 2% gel [Xylocaína®] ------------------------ 01 bisnaga\nAplicar fina camada nas lesões, se dor.\n\nOrientações\n- Manter as lesões limpas e secas.\n- Evitar relações sexuais enquanto houver lesões.\n- Testar HIV, sífilis e hepatites.\n\nRetorno ao PS, se:\n- Dificuldade para urinar.\n- Dor de cabeça intensa ou rigidez de nuca.\n- Febre alta persistente."}, {"nome": "Recorrência", "texto": "USO ORAL\n1) Aciclovir 400 mg [Zovirax®] ------------------------ 15 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 5 dias.\n\nOU\nValaciclovir 500 mg [Valtrex®] ------------------------ 06 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 3 dias.\n\nOrientações\n- Iniciar ao primeiro sinal de formigamento ou lesão.\n- Mais de 6 recorrências por ano: avaliar terapia supressiva."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-uretral-lesao-genital"}, {"id": "condiloma-acuminado-verruga-genital", "nome": "Condiloma acuminado (verruga genital)", "cid": "A63.0", "categoria": "ist", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Podofilotoxina 0,15% creme [Wartec®] ------------------------ 01 bisnaga\nAplicar sobre as lesões, 2 vezes ao dia, por 3 dias seguidos; pausa de 4 dias. Repetir por até 4 ciclos.\n\nOU\nImiquimode 5% creme ------------------------ 01 caixa\nAplicar à noite sobre as lesões, 3 vezes por semana (dias alternados), lavando após 6 a 10 horas, por
