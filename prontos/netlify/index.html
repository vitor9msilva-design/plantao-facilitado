---------------- 04 ampolas\nAplicar 40 a 80 mg (ou 1 a 2,5 vezes a dose oral diária), via endovenosa, em bolus. Reavaliar diurese em 2 horas.\n\nSe PAS acima de 110 mmHg:\n3) Nitroglicerina 5 mg/mL [Tridil®] ------------------------ 01 ampola de 10 mL\nDiluir 50 mg em 240 mL de SG 5% (200 mcg/mL). Iniciar 10 mcg/min e titular a cada 5 minutos."}, {"nome": "Perfil C (frio e úmido)", "texto": "Medidas gerais:\n1) Monitorização, acesso venoso, lactato, avaliação de UTI. Suspender betabloqueador se choque.\n\nUSO ENDOVENOSO\n2) Dobutamina 250 mg/20 mL [Dobutrex®] ------------------------ 01 ampola\nDiluir 250 mg em 230 mL de SG 5% (1.000 mcg/mL). Iniciar 2,5 mcg/kg/min em bomba de infusão e titular até 10 mcg/kg/min.\n\nSe PAS abaixo de 90 mmHg:\n3) Noradrenalina 4 mg/4 mL ------------------------ 04 ampolas\nDiluir 16 mg em 234 mL de SG 5% (64 mcg/mL). Iniciar 0,05 mcg/kg/min e titular conforme PAM (meta acima de 65 mmHg).\n4) Furosemida 20 mg/2 mL [Lasix®] ------------------------ 02 ampolas\nAplicar 40 mg, via endovenosa, após melhora da perfusão."}, {"nome": "Perfil L (frio e seco)", "texto": "Medidas gerais:\n1) Suspender temporariamente diuréticos e vasodilatadores.\n\nUSO ENDOVENOSO\n2) Soro fisiológico 0,9% ------------------------ 01 frasco de 250 mL\nInfundir 250 mL, via endovenosa, em 30 minutos. Reavaliar perfusão, PA e ausculta pulmonar antes de repetir."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dispneia-edema-insuficiencia-cardiaca"}, {"id": "abdome-agudo-obstrutivo-conduta-no-ps", "nome": "Abdome agudo obstrutivo — conduta no PS", "cid": "K56.6", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Dieta zero.\n2) Sonda nasogástrica aberta em frasco, se vômitos ou distensão importante.\n3) Hemograma, eletrólitos, função renal, lactato, gasometria e radiografia/TC de abdome. Avaliação da cirurgia geral.\n\nUSO ENDOVENOSO\n4) Soro fisiológico 0,9% ------------------------ 02 frascos de 500 mL\nInfundir 1.000 mL, via endovenosa, em 1 hora; depois conforme volemia e diurese.\n5) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 2 g, via endovenosa, diluída em 100 mL de SF 0,9%, de 6/6 horas, se dor.\n6) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa lenta, de 8/8 horas, se náuseas.\n7) Omeprazol 40 mg [Losec®] ------------------------ 01 frasco-ampola\nAplicar 40 mg, via endovenosa, 1 vez ao dia.\n\nSe dor intensa:\n8) Tramadol 50 mg/mL [Tramal®] ------------------------ 01 ampola de 2 mL\nDiluir 100 mg em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos, de 8/8 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "constipacao-distensao-abdominal"}, {"id": "ascite-por-cirrose", "nome": "Ascite por cirrose", "cid": "R18", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Espironolactona 100 mg [Aldactone®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, pela manhã, de uso contínuo.\n2) Furosemida 40 mg [Lasix®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, pela manhã, de uso contínuo.\nManter a proporção de 100 mg de espironolactona para 40 mg de furosemida ao ajustar as doses.\n\nOrientações\n- Dieta com no máximo 2 g de sódio por dia (sem sal de adição, sem embutidos e enlatados).\n- Pesar-se todos os dias; meta de perda de 0,5 kg/dia.\n- Não usar anti-inflamatórios.\n- Não ingerir bebidas alcoólicas.\n- Colher sódio, potássio e creatinina em 1 semana.\n- Acompanhamento com hepatologista ou gastroenterologista.\n\nRetorno ao PS, se:\n- Febre ou dor abdominal.\n- Confusão mental ou sonolência.\n- Vômitos com sangue ou fezes escuras.\n- Barriga crescendo rapidamente ou falta de ar.\n- Diminuição importante da urina."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "ascite-descompensacao-de-hepatopatia"}, {"id": "encefalopatia-hepatica", "nome": "Encefalopatia hepática", "cid": "K72.9", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Investigar e tratar o fator precipitante (infecção, sangramento digestivo, constipação, distúrbio eletrolítico, sedativos).\n2) Glicemia capilar, eletrólitos, função renal, hemograma, paracentese diagnóstica se ascite.\n3) Se rebaixamento importante: proteger via aérea e passar sonda nasoenteral.\n\nUSO ORAL / SONDA\n4) Lactulose 667 mg/mL [Lactulona®] ------------------------ 01 frasco\nAdministrar 30 mL, via oral ou por sonda, de 1/1 hora até evacuar. Depois, 20 a 30 mL de 8/8 horas, titulando para 2 a 3 evacuações pastosas por dia.\n\nSe recorrência ou resposta insuficiente:\n5) Rifaximina 550 mg (disponibilidade limitada no Brasil; confirmar acesso) ------------------------ 60 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas."}, {"nome": "Receita de alta", "texto": "USO ORAL\n1) Lactulose 667 mg/mL [Lactulona®] ------------------------ 02 frascos\nTomar 20 mL, via oral, de 8/8 horas, ajustando para 2 a 3 evacuações pastosas por dia.\n\nOrientações\n- Não deixar de evacuar: se menos de 2 evacuações no dia, aumentar a lactulose.\n- Não usar calmantes ou remédios para dormir.\n- Não ingerir bebidas alcoólicas.\n\nRetorno ao PS, se:\n- Confusão, sonolência ou alteração do comportamento.\n- Febre ou dor abdominal.\n- Fezes escuras ou vômitos com sangue."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "ascite-descompensacao-de-hepatopatia"}, {"id": "peritonite-bacteriana-espontanea", "nome": "Peritonite bacteriana espontânea", "cid": "K65.2", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Paracentese diagnóstica antes do antibiótico: celularidade, Gram, cultura (frasco de hemocultura à beira do leito), albumina e proteína total.\n2) Suspender betabloqueador se hipotensão ou lesão renal.\n\nUSO ENDOVENOSO\n3) Ceftriaxona 1 g [Rocefin®] ------------------------ 02 frascos-ampola\nAplicar 2 g, via endovenosa, 1 vez ao dia, por 5 a 7 dias.\n4) Albumina humana 20% ------------------------ frascos de 50 mL\nInfundir 1,5 g/kg, via endovenosa, no 1º dia (até 6 horas do diagnóstico) e 1 g/kg no 3º dia."}, {"nome": "Profilaxia secundária (alta)", "texto": "USO ORAL\n1) Norfloxacino 400 mg [Floxacin®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, de uso contínuo.\n\nOU\nCiprofloxacino 500 mg [Cipro®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, de uso contínuo."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "ascite-descompensacao-de-hepatopatia"}, {"id": "abscesso-anorretal-apos-drenagem", "nome": "Abscesso anorretal — após drenagem", "cid": "K61.0", "categoria": "gastroenterologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n\nSe celulite associada, diabetes ou imunossupressão:\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n3) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n4) Psyllium [Metamucil®] ------------------------ 01 caixa\nDissolver 1 sachê em 1 copo de água, 1 a 2 vezes ao dia.\n\nOUTROS\n5) Banho de assento com água morna, 3 vezes ao dia e após evacuar, por 15 minutos.\n\nOrientações\n- Manter o curativo limpo e trocar após cada banho.\n- Ingerir bastante água e fibras.\n- Agendar avaliação com coloproctologista (risco de fístula).\n\nRetorno ao PS, se:\n- Febre ou calafrios.\n- Dor que piora ou novo inchaço.\n- Dificuldade para urinar."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-anal-doenca-orificial"}, {"id": "trombose-hemorroidaria", "nome": "Trombose hemorroidária", "cid": "K64.5", "categoria": "gastroenterologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO / ANAL\n1) Nifedipina 0,3% + Lidocaína 1,5% pomada (manipulada) ------------------------ 30 g\nAplicar na região anal, de 12/12 horas, por 14 dias.\n\nUSO ORAL\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n3) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n4) Psyllium [Metamucil®] ------------------------ 01 caixa\nDissolver 1 sachê em 1 copo de água, 1 a 2 vezes ao dia.\n\nOUTROS\n5) Banho de assento com água morna, 3 vezes ao dia, por 15 minutos.\n\nOrientações\n- Até 72 horas do início, avaliar excisão do trombo com o cirurgião.\n- Evitar esforço ao evacuar e ficar muito tempo sentado no vaso.\n- Ingerir bastante água e fibras.\n\nRetorno ao PS, se:\n- Sangramento em grande quantidade.\n- Febre ou saída de pus.\n- Dor muito intensa que não melhora."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-anal-doenca-orificial"}, {"id": "ingestao-de-corpo-estranho", "nome": "Ingestão de corpo estranho", "cid": "T18.9", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Radiografia de pescoço, tórax e abdome (objetos radiopacos).\n2) Endoscopia de URGÊNCIA (até 2 a 6 horas) se: obstrução esofágica (sialorreia, incapacidade de engolir saliva), bateria em botão no esôfago, objetos pontiagudos ou ímãs múltiplos.\n3) Endoscopia em até 24 horas: objetos no esôfago sem obstrução completa, objetos longos (acima de 6 cm) ou largos (acima de 2,5 cm).\n4) Não induzir vômito."}, {"nome": "Receita de alta (objeto pequeno, rombo, já no estômago)", "texto": "Orientações\n- Alimentação normal.\n- Observar as fezes para confirmar a saída do objeto.\n- Pode levar alguns dias para ser eliminado.\n\nRetorno ao PS, se:\n- Dor abdominal, vômitos ou sangue nas fezes.\n- Febre.\n- Dificuldade para engolir ou dor no peito.\n- Objeto não eliminado em 1 semana (reavaliar com radiografia)."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corpo-estranho"}, {"id": "mordedura-de-animal-cao-gato-humano", "nome": "Mordedura de animal (cão, gato, humano)", "cid": "W54", "categoria": "infectologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n\nProfilaxia antibiótica (mordedura de gato, mãos, face, genitais, ferimentos profundos, imunossuprimidos):\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\nAlérgicos à penicilina:\nSulfametoxazol + Trimetoprima 800/160 mg [Bactrim F®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 5 dias.\n\n+\nClindamicina 300 mg [Dalacin C®] ------------------------ 20 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Lavar o ferimento com água e sabão em abundância.\n- Profilaxia antirrábica (observação do animal, vacina e/ou soro) conforme protocolo do Ministério da Saúde e notificação.\n- Atualizar a vacina antitetânica, se indicado.\n- Observar o cão ou gato por 10 dias, se possível.\n\nRetorno ao PS, se:\n- Vermelhidão, calor, inchaço ou pus no local.\n- Febre.\n- Dificuldade para mexer os dedos ou a mão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "acidente-com-risco-rabico-mordedura-de-animal"}, {"id": "pancreatite-aguda-no-ps", "nome": "Pancreatite aguda — no PS", "cid": "K85.9", "categoria": "gastroenterologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Lipase, hemograma, função renal, eletrólitos, cálcio, triglicerídeos, função hepática, gasometria e USG de abdome (colelitíase).\n2) Dieta oral precoce assim que tolerar (dieta leve), sem esperar a normalização da lipase.\n\nUSO ENDOVENOSO\n3) Ringer lactato ------------------------ 02 frascos de 500 mL\nInfundir 10 mL/kg, via endovenosa, se hipovolemia; depois 1,5 mL/kg/h. Reavaliar volemia e diurese a cada 6 horas.\n4) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 2 g, via endovenosa, diluída em 100 mL de SF 0,9%, de 6/6 horas.\n5) Tramadol 50 mg/mL [Tramal®] ------------------------ 01 ampola de 2 mL\nDiluir 100 mg em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos, de 8/8 horas, se dor.\n\nSe dor refratária:\nMorfina 10 mg/mL [Dimorf®] ------------------------ 01 ampola\nDiluir 1 ampola em 9 mL de SF 0,9%. Aplicar 2 a 3 mg, via endovenosa lenta, de 4/4 horas, se dor.\n6) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa lenta, de 8/8 horas, se náuseas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-abdominal-suspeita-de-abdome-agudo"}, {"id": "queimadura-solar", "nome": "Queimadura solar", "cid": "L55.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO TÓPICO\n3) Dexpantenol 5% creme [Bepantol Derma®] ------------------------ 01 bisnaga\nAplicar fina camada nas áreas afetadas, 3 vezes ao dia.\n\nOrientações\n- Compressas frias e banhos frios para alívio.\n- Ingerir bastante líquido.\n- Não estourar as bolhas.\n- Evitar sol até a cura; depois, usar protetor solar FPS 30 ou maior.\n\nRetorno ao PS, se:\n- Bolhas extensas, febre ou calafrios.\n- Tontura, náuseas ou confusão.\n- Sinais de infecção (pus, vermelhidão que aumenta)."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "exposicao-ao-sol-calor-desidratacao"}, {"id": "dermatite-atopica-crise", "nome": "Dermatite atópica — crise", "cid": "L20.9", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO TÓPICO\n1) Betametasona 0,1% creme [Betnovate®] ------------------------ 01 bisnaga\nAplicar fina camada nas lesões do corpo, 2 vezes ao dia, por 7 dias. Não usar no rosto e nas dobras.\nNo rosto e dobras:\n2) Hidrocortisona 1% creme [Berlison®] ------------------------ 01 bisnaga\nAplicar fina camada, 2 vezes ao dia, por até 7 dias.\n3) Hidratante corporal sem perfume ------------------------ 01 frasco\nAplicar no corpo todo, 2 vezes ao dia, logo após o banho.\n\nUSO ORAL\n4) Hidroxizina 25 mg [Hixizine®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, à noite, se coceira.\n\nOrientações\n- Banhos mornos e curtos, com sabonete neutro em pouca quantidade.\n- Usar roupas de algodão e evitar lã e tecidos sintéticos.\n- Manter as unhas curtas e evitar coçar.\n\nRetorno ao PS, se:\n- Lesões com pus, crostas amareladas ou febre.\n- Bolhas dolorosas agrupadas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "prurido-lesoes-pruriginosas"}, {"id": "onicocriptose-unha-encravada", "nome": "Onicocriptose (unha encravada)", "cid": "L60.0", "categoria": "dermatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n\nSe sinais de infecção (vermelhidão, calor, pus):\n1) Cefalexina 500 mg [Keflex®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n3) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n\nOrientações\n- Escalda-pés com água morna e sabão, 3 vezes ao dia, por 15 minutos.\n- Usar calçados largos ou abertos.\n- Cortar a unha reta, sem arredondar os cantos.\n- Encaminhamento para cantoplastia se recorrente ou com granuloma.\n\nRetorno ao PS, se:\n- Vermelhidão que sobe pelo pé, febre.\n- Pus em grande quantidade."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "lesao-de-pele-infecciosa-abscesso"}, {"id": "hipoglicemia", "nome": "Hipoglicemia", "cid": "E16.2", "categoria": "endocrinologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Glicemia capilar de controle a cada 15 minutos até acima de 100 mg/dL, depois de 1/1 hora.\n2) Etilistas ou desnutridos: tiamina antes da glicose.\n3) Paciente consciente e capaz de engolir: 15 a 20 g de carboidrato via oral (1 copo de suco ou 1 colher de sopa de açúcar).\n\nUSO ENDOVENOSO\n4) Tiamina 100 mg/mL [Benerva®] ------------------------ 01 ampola\nAplicar 100 mg, via endovenosa, antes da glicose, se etilismo ou desnutrição.\n5) Glicose 50% ------------------------ 04 ampolas de 10 mL\nAplicar 40 a 60 mL (20 a 30 g), via endovenosa, em bolus. Repetir se glicemia abaixo de 70 mg/dL em 15 minutos.\n6) Soro glicosado 10% ------------------------ 01 frasco de 500 mL\nManter infusão de 80 mL/h se hipoglicemia por sulfonilureia ou insulina de longa ação, até alimentação adequada.\n\nSem acesso venoso:\n7) Glucagon 1 mg [GlucaGen®] ------------------------ 01 frasco-ampola\nAplicar 1 mg, via intramuscular."}, {"nome": "Receita de alta", "texto": "Orientações\n- Fazer refeições a cada 3 horas e não pular refeições.\n- Sempre carregar balas ou açúcar.\n- Se sintomas (tremor, suor, fome, tontura): ingerir 1 copo de suco ou 1 colher de sopa de açúcar e medir a glicemia.\n- Revisar a dose da insulina ou do hipoglicemiante na UBS em até 7 dias.\n\nRetorno ao PS, se:\n- Nova hipoglicemia que não melhora com açúcar.\n- Confusão, sonolência ou desmaio.\n- Convulsão."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "hipoglicemia"}, {"id": "coma-mixedematoso", "nome": "Coma mixedematoso", "cid": "E03.5", "categoria": "endocrinologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Internação em UTI, suporte ventilatório se necessário, aquecimento passivo (cobertores), correção de hiponatremia e hipoglicemia.\n2) Colher TSH, T4 livre e cortisol antes da medicação.\n\nUSO ENDOVENOSO\n3) Hidrocortisona 100 mg [Solu-Cortef®] ------------------------ 03 frascos-ampola\nAplicar 100 mg, via endovenosa, de 8/8 horas, ANTES da levotiroxina.\n\nUSO ORAL / SONDA\n4) Levotiroxina 100 mcg [Puran T4®] ------------------------ comprimidos\nAdministrar 300 a 500 mcg, via sonda ou oral, como dose de ataque. Depois, 50 a 100 mcg por dia (reduzir em idosos e cardiopatas)."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "alteracao-laboratorial-disturbio-hidroeletrolitico"}, {"id": "contracepcao-de-emergencia", "nome": "Contracepção de emergência", "cid": "Z30.0", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Levonorgestrel 1,5 mg [Pozato Uni®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, em dose única, o mais cedo possível (até 72 horas após a relação; eficácia menor até 120 horas).\n\nOrientações\n- Se vomitar em até 3 horas, repetir a dose.\n- A menstruação pode adiantar ou atrasar alguns dias.\n- Se a menstruação atrasar mais de 7 dias, fazer teste de gravidez.\n- Não substitui o uso de um método contraceptivo regular.\n- Considerar testagem para IST e PEP, conforme a exposição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "contracepcao-de-emergencia-exposicao-sexual"}, {"id": "doenca-inflamatoria-pelvica", "nome": "Doença inflamatória pélvica", "cid": "N73.9", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO INTRAMUSCULAR\n1) Ceftriaxona 500 mg [Rocefin®] ------------------------ 01 frasco-ampola\nDiluir em 2 mL de lidocaína 1% sem vasoconstritor. Aplicar 500 mg, via intramuscular, dose única.\n\nUSO ORAL\n2) Doxiciclina 100 mg [Vibramicina®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 14 dias.\n3) Metronidazol 500 mg [Flagyl®] ------------------------ 28 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 14 dias.\n4) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Excluir gestação (beta-hCG) antes do tratamento.\n- Não ingerir bebidas alcoólicas durante o metronidazol e até 24 horas após.\n- Abstinência sexual até o fim do tratamento; parcerias devem ser tratadas.\n- Testar HIV, sífilis e hepatites.\n- Reavaliar em 72 horas.\n\nRetorno ao PS, se:\n- Febre persistente ou dor que piora.\n- Vômitos que impedem os remédios.\n- Ausência de melhora em 72 horas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-pelvica-dismenorreia"}, {"id": "endometriose-dismenorreia-crise-de-dor", "nome": "Endometriose / dismenorreia — crise de dor", "cid": "N94.6", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Naproxeno 550 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n\nOU\nCetorolaco 10 mg [Toragesic®] ------------------------ 15 comprimidos sublinguais\nColocar 1 comprimido embaixo da língua e deixar dissolver, de 8/8 horas, por até 5 dias.\n2) Butilbrometo de escopolamina + Dipirona 10 mg/250 mg [Buscopan Composto®] ------------------------ 20 drágeas\nTomar 1 a 2 drágeas, via oral, de 8/8 horas, se cólica.\n\nOrientações\n- Bolsa de água morna na região pélvica.\n- Iniciar o anti-inflamatório 1 a 2 dias antes da menstruação nos próximos ciclos.\n- Agendar avaliação ginecológica (avaliar endometriose e anticoncepção hormonal).\n\nRetorno ao PS, se:\n- Dor muito intensa ou diferente do habitual.\n- Febre, sangramento intenso ou desmaio.\n- Atraso menstrual com dor."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-pelvica-dismenorreia"}, {"id": "sangramento-uterino-anormal", "nome": "Sangramento uterino anormal", "cid": "N93.9", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Ácido tranexâmico 250 mg [Transamin®] ------------------------ 30 comprimidos\nTomar 4 comprimidos (1 g), via oral, de 8/8 horas, por até 5 dias.\n2) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n\nSe anemia:\n3) Sulfato ferroso 40 mg de ferro elementar ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, antes do almoço.\n\nOrientações\n- Excluir gestação (beta-hCG) e checar hemoglobina.\n- Não usar ácido tranexâmico se trombose prévia.\n- Agendar avaliação ginecológica e USG transvaginal.\n\nRetorno ao PS, se:\n- Sangramento que encharca 1 absorvente por hora por 2 horas seguidas.\n- Tontura, desmaio ou palpitações.\n- Dor abdominal intensa ou febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "sangramento-uterino-anormal-metrorragia"}, {"id": "candidiase-vulvovaginal", "nome": "Candidíase vulvovaginal", "cid": "B37.3", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Fluconazol 150 mg [Zoltec®] ------------------------ 01 cápsula\nTomar 1 cápsula, via oral, dose única.\n\nOU (gestantes: somente tópico)\n\nUSO VAGINAL\nMiconazol 2% creme vaginal [Gyno-Daktarin®] ------------------------ 01 bisnaga\nAplicar 1 aplicador cheio, à noite, por 7 noites.\n\nOrientações\n- Usar roupas íntimas de algodão e evitar roupas apertadas.\n- Evitar duchas vaginais.\n- Parceria só precisa de tratamento se tiver sintomas.\n- Mais de 4 episódios por ano: avaliar com o ginecologista."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-vaginal-prurido-vulvar"}, {"id": "tricomoniase", "nome": "Tricomoníase", "cid": "A59.0", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Metronidazol 500 mg [Flagyl®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOrientações\n- Não ingerir bebidas alcoólicas durante o tratamento e até 24 horas após.\n- A parceria sexual deve ser tratada ao mesmo tempo.\n- Abstinência sexual até o fim do tratamento.\n- Testar HIV, sífilis e hepatites."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-vaginal-prurido-vulvar"}, {"id": "vaginose-bacteriana", "nome": "Vaginose bacteriana", "cid": "N76.0", "categoria": "ginecologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Metronidazol 500 mg [Flagyl®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 7 dias.\n\nOU\n\nUSO VAGINAL\nMetronidazol gel vaginal 100 mg/g [Flagyl® gel vaginal] ------------------------ 01 bisnaga\nAplicar 1 aplicador cheio, à noite, por 5 noites.\n\nOrientações\n- Não ingerir bebidas alcoólicas durante o tratamento e até 24 horas após.\n- Não é necessário tratar a parceria.\n- Evitar duchas vaginais."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corrimento-vaginal-prurido-vulvar"}, {"id": "intoxicacao-por-benzodiazepinicos", "nome": "Intoxicação por benzodiazepínicos", "cid": "T42.4", "categoria": "intoxicacoes", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Suporte: via aérea, monitorização, SpO2, glicemia capilar, ECG.\n2) Investigar coingestão (álcool, opioides, antidepressivos tricíclicos).\n3) Carvão ativado não é rotina.\n\nUSO ENDOVENOSO\n\nSomente se depressão respiratória importante e sem uso crônico de benzodiazepínico ou risco de convulsão:\n4) Flumazenil 0,5 mg/5 mL [Lanexat®] ------------------------ 02 ampolas\nAplicar 0,2 mg, via endovenosa, em 30 segundos. Repetir 0,2 a 0,5 mg a cada minuto, até 3 mg. Efeito curto: observar ressedação."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "intoxicacao-exogena"}, {"id": "intoxicacao-por-cocaina-crack-anfetaminas", "nome": "Intoxicação por cocaína / crack / anfetaminas", "cid": "T40.5", "categoria": "intoxicacoes", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Monitorização, ECG, troponina, CPK, função renal, eletrólitos, temperatura.\n2) Hipertermia: resfriamento ativo.\n3) Evitar betabloqueador isolado.\n\nUSO ENDOVENOSO\n4) Diazepam 10 mg/2 mL [Valium®] ------------------------ 02 ampolas\nAplicar 5 a 10 mg, via endovenosa lenta, a cada 5 a 10 minutos, até controle da agitação, taquicardia e hipertensão.\n\nSe dor torácica:\n5) AAS 100 mg ------------------------ 03 comprimidos\nMastigar 300 mg, via oral.\n6) Dinitrato de isossorbida 5 mg [Isordil®] ------------------------ 01 comprimido\nAplicar 5 mg, via sublingual, se PAS acima de 100 mmHg."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "intoxicacao-exogena"}, {"id": "intoxicacao-por-opioides", "nome": "Intoxicação por opioides", "cid": "T40.2", "categoria": "intoxicacoes", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Ventilar com bolsa-válvula-máscara se apneia ou FR baixa; monitorização e SpO2.\n2) Observar por pelo menos 4 a 6 horas após a última dose de naloxona (mais tempo se opioide de longa ação).\n\nUSO ENDOVENOSO\n3) Naloxona 0,4 mg/mL [Narcan®] ------------------------ 05 ampolas\nAplicar 0,04 a 0,4 mg, via endovenosa, e repetir a cada 2 a 3 minutos até FR acima de 12 irpm (máximo 10 mg). Usuários crônicos: iniciar com doses baixas para evitar abstinência."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "intoxicacao-exogena"}, {"id": "intoxicacao-alcoolica-aguda-no-ps", "nome": "Intoxicação alcoólica aguda — no PS", "cid": "F10.0", "categoria": "intoxicacoes", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Decúbito lateral, proteção de via aérea, glicemia capilar.\n2) Avaliar TCE associado e outras intoxicações.\n\nUSO ENDOVENOSO\n3) Tiamina 100 mg/mL [Benerva®] ------------------------ 03 ampolas\nAplicar 300 mg, via endovenosa, diluída em 100 mL de SF 0,9%, ANTES de soro glicosado.\n4) Soro fisiológico 0,9% ------------------------ 01 frasco de 500 mL\nInfundir 500 mL, via endovenosa, em 1 hora, se desidratação.\n5) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa lenta, se náuseas ou vômitos.\n\nSe hipoglicemia:\nGlicose 50% ------------------------ 04 ampolas de 10 mL\nAplicar 40 mL, via endovenosa, após a tiamina."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "intoxicacao-exogena"}, {"id": "ataque-isquemico-transitorio-ait", "nome": "Ataque isquêmico transitório (AIT)", "cid": "G45.9", "categoria": "neurologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) TC de crânio, ECG, glicemia, hemograma, coagulograma, perfil lipídico; Doppler de carótidas e vertebrais; ecocardiograma conforme o caso.\n2) Calcular ABCD2. Considerar internação se ABCD2 maior ou igual a 4 ou investigação ambulatorial não disponível.\n\nUSO ORAL\n3) AAS 100 mg ------------------------ 03 comprimidos\nTomar 300 mg, via oral, dose de ataque.\n\nSe ABCD2 maior ou igual a 4 (dupla antiagregação por 21 dias):\n4) Clopidogrel 75 mg [Plavix®] ------------------------ 04 comprimidos\nTomar 300 mg, via oral, dose de ataque.\n5) Atorvastatina 40 mg [Lipitor®] ------------------------ 01 comprimido\nTomar 1 comprimido, via oral, à noite."}, {"nome": "Receita de alta", "texto": "USO ORAL\n1) AAS 100 mg ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, após o almoço, de uso contínuo.\n2) Clopidogrel 75 mg [Plavix®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, 1 vez ao dia, por 21 dias.\n3) Atorvastatina 40 mg [Lipitor®] ------------------------ 30 comprimidos\nTomar 1 comprimido, via oral, à noite, de uso contínuo.\n\nOrientações\n- Agendar investigação com neurologista o mais rápido possível.\n- Controlar pressão, glicemia e colesterol; parar de fumar.\n\nRetorno ao PS IMEDIATAMENTE (ligar 192), se:\n- Fraqueza ou dormência em um lado do corpo.\n- Boca torta, fala enrolada ou dificuldade para entender.\n- Perda de visão, tontura intensa ou desequilíbrio."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "deficit-neurologico-focal-suspeita-de-avc"}, {"id": "crise-convulsiva", "nome": "Crise convulsiva", "cid": "R56.8", "categoria": "neurologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Decúbito lateral, proteção contra trauma, oxigênio, glicemia capilar imediata.\n2) Etilistas ou desnutridos: tiamina 100 mg EV antes da glicose.\n3) Crise acima de 5 minutos = estado de mal epiléptico.\n\nUSO ENDOVENOSO\n4) Diazepam 10 mg/2 mL [Valium®] ------------------------ 02 ampolas\nAplicar 10 mg, via endovenosa lenta (não diluir), podendo repetir 1 vez após 5 minutos.\n\nSem acesso venoso:\nMidazolam 15 mg/3 mL [Dormonid®] ------------------------ 01 ampola\nAplicar 10 mg, via intramuscular.\n\nSe crise persistir após 2 doses de benzodiazepínico:\n5) Fenitoína 50 mg/mL [Hidantal®] ------------------------ ampolas de 5 mL\nAplicar 20 mg/kg, via endovenosa, diluída em SF 0,9% (não usar SG), velocidade máxima de 50 mg/min, com monitorização cardíaca."}, {"nome": "Receita de alta", "texto": "Orientações\n- Não dirigir, não nadar e não trabalhar em altura até liberação do neurologista.\n- Não deixar de tomar o anticonvulsivante habitual, se já usa.\n- Dormir bem e evitar bebidas alcoólicas.\n- Agendar avaliação com neurologista (EEG e imagem).\n\nRetorno ao PS, se:\n- Nova crise convulsiva.\n- Confusão que não melhora, dor de cabeça intensa ou febre.\n- Fraqueza em um lado do corpo."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "crise-convulsiva-pos-ictal"}, {"id": "traumatismo-cranioencefalico-leve", "nome": "Traumatismo cranioencefálico leve", "cid": "S06.0", "categoria": "neurologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOU\nParacetamol 750 mg [Tylenol®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n2) Ondansetrona 8 mg [Vonau®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, se náuseas.\n\nOrientações\n- Ficar acompanhado por um adulto nas próximas 24 horas.\n- Repouso relativo; evitar esportes e bebidas alcoólicas por alguns dias.\n- Não usar calmantes ou remédios para dormir.\n\nRetorno ao PS, se:\n- Dor de cabeça que piora, vômitos repetidos ou convulsão.\n- Sonolência excessiva, confusão ou dificuldade para acordar.\n- Fraqueza, dormência, fala enrolada ou visão dupla.\n- Saída de líquido ou sangue pelo nariz ou ouvido.\n- Pupilas de tamanhos diferentes."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "traumatismo-cranioencefalico-leve-tce-leve"}, {"id": "celulite-pre-septal", "nome": "Celulite pré-septal", "cid": "H05.0", "categoria": "oftalmologia", "abas": [{"nome": "Receita de alta", "texto": "USO ORAL\n1) Amoxicilina + Clavulanato 875/125 mg [Clavulin®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, por 10 dias.\n\nAlérgicos à penicilina:\nClindamicina 300 mg [Dalacin C®] ------------------------ 40 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 10 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor ou febre.\n\nOrientações\n- Compressas mornas na pálpebra, 3 vezes ao dia.\n- Reavaliar em 48 horas.\n\nRetorno ao PS IMEDIATAMENTE, se:\n- Dor ao mexer o olho, olho \"saltado\" ou visão dupla.\n- Piora da visão.\n- Febre alta ou piora do inchaço."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "edema-palpebral-celulite-periorbitaria"}, {"id": "celulite-orbitaria-pos-septal", "nome": "Celulite orbitária (pós-septal)", "cid": "H05.0", "categoria": "oftalmologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) TC de órbitas e seios da face com contraste.\n2) Avaliação de oftalmologia e otorrinolaringologia; internação.\n\nUSO ENDOVENOSO\n3) Ceftriaxona 1 g [Rocefin®] ------------------------ 04 frascos-ampola\nAplicar 2 g, via endovenosa, de 12/12 horas.\n4) Clindamicina 600 mg/4 mL [Dalacin C®] ------------------------ 03 ampolas\nDiluir 600 mg em 100 mL de SF 0,9% e infundir, via endovenosa, em 30 minutos, de 8/8 horas.\n5) Dipirona 1 g/2 mL [Novalgina®] ------------------------ 01 ampola\nAplicar 1 g, via endovenosa, de 6/6 horas, se dor ou febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "edema-palpebral-celulite-periorbitaria"}, {"id": "glaucoma-agudo-de-angulo-fechado", "nome": "Glaucoma agudo de ângulo fechado", "cid": "H40.2", "categoria": "oftalmologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Avaliação oftalmológica de URGÊNCIA.\n2) Decúbito dorsal, analgesia e antiemético.\n\nUSO ORAL\n3) Acetazolamida 250 mg [Diamox®] ------------------------ 02 comprimidos\nTomar 2 comprimidos (500 mg), via oral, dose única.\n\nUSO OFTÁLMICO\n4) Timolol 0,5% colírio [Timoptol®] ------------------------ 01 frasco\nPingar 1 gota no olho acometido, dose única.\n5) Brimonidina 0,2% colírio [Alphagan®] ------------------------ 01 frasco\nPingar 1 gota no olho acometido, dose única.\n6) Pilocarpina 2% colírio [Isopto Carpine®] ------------------------ 01 frasco\nPingar 1 gota no olho acometido, 1 hora após as medicações acima (após queda da pressão intraocular).\n\nUSO ENDOVENOSO\n\nSe pressão intraocular muito elevada e sem resposta:\nManitol 20% ------------------------ 01 frasco de 250 mL\nInfundir 1 a 2 g/kg, via endovenosa, em 45 minutos.\n7) Ondansetrona 4 mg/2 mL [Vonau®] ------------------------ 01 ampola\nAplicar 4 mg, via endovenosa lenta, se náuseas."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "olho-vermelho-doloroso-baixa-visual-aguda"}, {"id": "corpo-estranho-no-ouvido", "nome": "Corpo estranho no ouvido", "cid": "T16", "categoria": "otorrinolaringologia", "abas": [{"nome": "No PS", "texto": "Medidas gerais:\n1) Inseto vivo: imobilizar antes com óleo mineral ou lidocaína 2% no conduto, depois remover.\n2) Não irrigar se semente/grãos (incham com água), bateria ou suspeita de perfuração.\n3) Bateria em botão: remoção imediata (urgência).\n4) Remoção com pinça ou cureta sob visão direta; encaminhar ao otorrino se falha."}, {"nome": "Receita de alta", "texto": "USO OTOLÓGICO\n\nSe escoriação do conduto (sem perfuração):\n1) Ciprofloxacino + Hidrocortisona solução otológica [Otociriax®] ------------------------ 01 frasco\nPingar 3 gotas na orelha acometida, de 12/12 horas, por 5 dias.\n\nUSO ORAL\n2) Dipirona 1 g [Novalgina®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Manter o ouvido seco por 5 dias.\n- Não usar cotonetes.\n\nRetorno ao PS, se:\n- Dor intensa, febre ou saída de secreção.\n- Tontura ou perda de audição."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "corpo-estranho"}, {"id": "abscesso-infeccao-dentaria", "nome": "Abscesso / infecção dentária", "cid": "K04.7", "categoria": "otorrinolaringologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Amoxicilina 500 mg [Amoxil®] ------------------------ 21 cápsulas\nTomar 1 cápsula, via oral, de 8/8 horas, por 7 dias.\n\nSe quadro mais extenso, associar:\nMetronidazol 400 mg [Flagyl®] ------------------------ 21 comprimidos\nTomar 1 comprimido, via oral, de 8/8 horas, por 7 dias.\n\nAlérgicos à penicilina:\nClindamicina 300 mg [Dalacin C®] ------------------------ 28 cápsulas\nTomar 1 cápsula, via oral, de 6/6 horas, por 7 dias.\n2) Naproxeno 500 mg [Flanax®] ------------------------ 10 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 5 dias.\n3) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nOrientações\n- Procurar o dentista em até 48 horas: o antibiótico não substitui a drenagem ou o tratamento do dente.\n- Bochechos com água morna e sal.\n- Não ingerir bebidas alcoólicas se usar metronidazol.\n\nRetorno ao PS, se:\n- Inchaço que se espalha para o pescoço ou abaixo da língua.\n- Dificuldade para abrir a boca, engolir ou respirar.\n- Febre alta."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-dentaria-lesoes-orais"}, {"id": "costocondrite", "nome": "Costocondrite", "cid": "M94.0", "categoria": "ortopedia-e-reumatologia", "abas": [{"nome": "Receita", "texto": "USO ORAL\n1) Naproxeno 500 mg [Flanax®] ------------------------ 14 comprimidos\nTomar 1 comprimido, via oral, de 12/12 horas, após as refeições, por 7 dias.\n2) Dipirona 1 g [Novalgina®] ------------------------ 20 comprimidos\nTomar 1 comprimido, via oral, de 6/6 horas, se dor.\n\nUSO TÓPICO\n3) Diclofenaco dietilamônio gel 1% [CataflamPro®] ------------------------ 01 bisnaga\nAplicar no local, 3 vezes ao dia, por 7 dias.\n\nOrientações\n- Compressas mornas no local.\n- Evitar esforço com os braços e carregar peso por alguns dias.\n- A dor pode durar algumas semanas.\n\nRetorno ao PS, se:\n- Dor no peito em aperto, que irradia para braço ou mandíbula.\n- Falta de ar, suor frio ou desmaio.\n- Febre."}], "orientacoes": "", "sinaisAlarme": "", "notaMedico": "", "rascunho": true, "hda": "dor-toracica-de-parede-costocondral"}] =============\n\n##IDENTIFICAÇÃO:\nNome:\nIdade:\n\n#História da Doença Atual:\n\n- Texto corrido, técnico, direto e bem organizado.\n\n- Estruture como uma anamnese médica de qualidade: queixa principal, início, tempo de evolução, progressão, fatores de melhora/piora, intensidade, sintomas associados e sinais de alarme.\n\n- Seja assertivo e menos prolixo, evitando redundâncias.\n\n- Quando houver negativa de sinais de alarme, explicite-os de forma direcionada ao quadro clínico.\n\n- A HDA ficará restrita à narrativa clínica objetiva dos sintomas, tempo de evolução, fatores de melhora/piora, sintomas associados e negativas pertinentes, sem qualquer conclusão médica.\n\n- Linguagem natural, como escrita real de prontuário médico, deve ser feita de forma direta, sem parenteses, com linguagem fluida e direta, segue um exemplo de HDA padrão: \nPaciente do sexo feminino, 86 anos, portadora de HAS, em uso de ramipril, atorvastatina e amitriptilina, dá entrada na Sala Vermelha trazida pela triagem. Refere quadro com início há aproximadamente 2 dias, com piora há 1 dia, caracterizado por tosse de caráter produtivo sem expectoração visível, associada a hiporexia, prostração e adinamia. Apresentou episódio de dessaturação na triagem (SpO2 88% em ar ambiente), sem histórico de DPOC, com dispneia presente ao momento da avaliação. Nega alteração do nível de consciência, hipotensão sintomática, hemoptise, dor torácica, síncope, palpitações, déficit neurológico focal ou piora súbita e catastrófica da dispneia.\n\n#Comorbidades:\n- \n\n#Medicações de uso contínuo:\n- \n\n#Alergias:\n- \n\n# Exame físico:\n\n- Regular estado geral, lúcido, orientado em tempo e espaço, colaborativo, corado, hidratado, anictérico, afebril, acianótico.\n- ACV: BNF2T, sem sopros, pulsos centrais palpáveis e simétricos.\n- AR: Murmúrio vesicular universalmente audível, sem ruídos adventícios.\n- ABD: Plano, flácido, indolor à palpação superficial e profunda, sem visceromegalias ou massas, ruídos hidroaéreos presentes.\n- EXT: Sem edemas, bem perfundidas, TEC < 3 segundos.\n- Neuro: Glasgow 15, força muscular e sensibilidade preservadas, sem déficits motores ou sensitivos.\n\nREGRA DO EXAME FÍSICO\n- Se o usuário não relatar alterações em determinado sistema, considere-o normal e descreva conforme o modelo padrão.\n- Se houver alteração informada, modifique apenas o sistema correspondente, mantendo os demais como normais.\n\nAPENAS QUANDO NECESSÁRIO E SOLICITADO:\n\n- Caso seja necessário colocar exames laboratoriais ou de imagem, organize-os da seguinte forma:\n\n# Exames complementares:\n>> (coloque esse símbolo) Exames laboratoriais:  Hb 12,5 | Ht 38,1 | Leuco 10.900 | Plaq 521.000 * | Glic 75 | Ur 21 | Cr 0,5 | CT 189 | HDL 70 | LDL 105,8 | Tri 66 | GGT 17 | FAL 268 | TGO 20 | TGP 9 | BT 0,27 | BD 0,13 | Ca 10 \n>>(coloque esse símbolo) Exames de imagem:\n- TC de Crânio (data): laudo\n\n#Hipóteses diagnósticas:\n- Listar de forma enumerada.\n- Incluir apenas hipóteses compatíveis com o quadro clínico.\n- Escrita natural e clínica, evitando linguagem artificial.\n- Quando houver incerteza diagnóstica, sinalizar com \"(?)\".\n- Pode incluir justificativa breve (uma linha), implícita e fluida, sem estrutura engessada.\n\nExemplo de estilo:\n1. Gastroenterite aguda (?) pelo quadro de diarreia e dor abdominal.\n2. Apendicite em fase inicial (?) pela dor em FID, ainda sem sinais peritoneais.\n\n# CONDUTAS:\n\n- Escreva somente as condutas que o médico informou (medicações, exames, reavaliação, internação, parecer, alta, orientações), em lista com \"-\", com redação clínica.\n- Não acrescente exames, reavaliação, orientações ou encaminhamentos que ele não escreveu.\n- Se ele não informou nenhuma conduta, escreva apenas \"- Prescrevo medicações conforme prescrição.\".\n\nJUSTIFICATIVAS\n\nQuando solicitado, elaborar justificativas técnicas, objetivas e compatíveis com auditoria, operadoras de saúde e regulação, sem repetir a HDA.\n\n1. Exames de imagem: uma única frase nimos do caso.\n\n- Você deve organizar e expandir tecnicamente essas informações dentro do modelo.\n\n- Não faça comentários fora do prontuário, exceto se o usuário solicitar."}</script>

<script>
(() => {
'use strict';
const BASE_TXT = document.getElementById('base').textContent.trim();
if (BASE_TXT === '__BA' + 'SE__') { // arquivo-fonte aberto direto, sem passar pelo build
  document.getElementById('detail').innerHTML = '<div class="welcome"><b style="color:var(--fg)">Este é o arquivo-fonte (template.html).</b><br>Ele não abre sozinho: os dados entram pelo build (build_claude.py ou build_netlify.py). Use o site publicado.</div>';
  return;
}
const BASE = JSON.parse(BASE_TXT);
const SECS = {
  prescricoes:{label:'Prescrições', ico:'💊', novo:'Nova doença', papel:'Receituário', copiar:'Copiar prescrição', abasNovas:['Receita de alta','No PS'], abaNova:'Nova aba'},
  documentos:{label:'Documentos', ico:'📄', novo:'Novo documento', papel:'Documento', copiar:'Copiar documento', abasNovas:['Modelo'], abaNova:'Variação'},
  hdas:{label:'HDAs', ico:'📝', novo:'Nova HDA', papel:'História clínica', copiar:'Copiar HDA', abasNovas:['Modelo'], abaNova:'Variação'}
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2,8);
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'item';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------------- datas e campos automáticos ---------------- */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function tokens(){
  const d = new Date(), cfg = state.config;
  return {
    '{data_extenso}': `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`,
    '{data}': `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`,
    '{medico}': cfg.medico || 'Médico(a)', '{crm}': cfg.crm || 'CRM ________', '{cidade}': cfg.cidade || '________',
    '{cid}': cidCtx || '________'
  };
}
/* CID do pedido: o modelo de documento tem {cid}; o valor vem do paciente, do próprio modelo ou do que o médico escolher */
let cidCtx = '';
const cidDoc = {};   // CID escolhido por documento nesta sessão (id do documento -> código)
const CID_SEM = new Set(['atestados', 'declaracoes']); // CID só com autorização do paciente (CFM 1.658/2002): nunca automático
const cidCodigo = v => (String(v || '').trim().match(/^[A-Za-z]\d{2}(?:\.\d{1,2})?/)?.[0] || String(v || '').trim()).toUpperCase().slice(0, 12);
function comCid(cid, fn){ const antes = cidCtx; cidCtx = cid || ''; try { return fn(); } finally { cidCtx = antes; } }
function cidListaHtml(){
  const vistos = new Map();
  for (const s of ['prescricoes', 'documentos']) for (const it of state.data[s]?.itens || []) if (it.cid && !vistos.has(it.cid)) vistos.set(it.cid, it.nome);
  return `<datalist id="cidLista">${[...vistos].sort((a, b) => a[0].localeCompare(b[0])).map(([c, n]) => `<option value="${esc(c)}">${esc(c)} · ${esc(n)}</option>`).join('')}</datalist>`;
}
const cidDoModelo = it => it && !CID_SEM.has(it.categoria) ? (cidDoc[it.id] ?? it.cid ?? '') : '';
const render = t => { let s = String(t ?? ''); for (const [k,v] of Object.entries(tokens())) s = s.split(k).join(v); return s; };
const unrender = t => { let s = String(t ?? ''); const tk = Object.entries(tokens()).sort((a,b)=>b[1].length-a[1].length);
  for (const [k,v] of tk) if (v && !/^_+$/.test(v) && v.length > 3) s = s.split(v).join(k); return s; };
const semQtd = t => String(t).split('\n').map(l => l.replace(/\s*-{3,}\s*[^-\n]*$/, '')).join('\n');

/* ---------------- armazenamento ---------------- */
const store = {
  mode:'local', db:null, pref:'', ov:{}, meta:{}, queue:{}, listeners:[],
  async init(onChange){
    this.onChange = onChange;
    if (window.PLANTAO_CFG) return this.initSupa(onChange);
    const local = lsGet('plantaorx:v1', {ov:{}, meta:{}});
    this.ov = local.ov || {}; this.meta = local.meta || {};
    let db = null;
    try { db = await (window.claude?.use ? window.claude.use('db') : null); } catch { db = null; }
    if (!db) { this.mode = 'local'; setStatus('local'); return; }
    this.pref = '';
    if (window.PLANTAO_PESSOAL) {
      /* cópia compartilhada: cada pessoa guarda as próprias edições, separadas e privadas */
      let id = null;
      try { const u = await window.claude.use('user'); id = u ? await u.id() : null; } catch { id = null; }
      if (!id) { this.mode = 'local'; setStatus('local'); return; }
      this.pref = 'data/users/' + id + '/pf/';
    }
    this.db = db; this.mode = 'nuvem'; setStatus('carregando');
    let got = 0; const timer = setTimeout(() => { if (got < 2) setStatus('lento'); }, 10000);
    const done = () => { if (++got === 2) { clearTimeout(timer); setStatus('nuvem'); } };
    let firstI = true, firstM = true;
    db.collection(this.pref + 'itens').onSnapshot(snap => {
      const o = {}; for (const d of snap.docs) o[d.id] = d.data(); this.ov = o; this.persistLocal();
      if (!snap.metadata?.fromCache && firstI) { firstI = false; done(); }
      this.onChange();
    }, e => { setStatus('erro'); });
    db.collection(this.pref + 'meta').onSnapshot(snap => {
      const o = {}; for (const d of snap.docs) o[d.id] = d.data(); this.meta = o; this.persistLocal();
      if (!snap.metadata?.fromCache && firstM) { firstM = false; done(); }
      this.onChange();
    }, e => { setStatus('erro'); });
  },
  /* ----- Supabase (versão publicada fora do Claude) ----- */
  cofre:null, pend:{}, lsKey:'plantaorx:v1',
  async rpc(fn, body){
    const {url, key} = window.PLANTAO_CFG;
    const h = {'Content-Type':'application/json', apikey:key};
    if (key.startsWith('eyJ')) h.Authorization = 'Bearer ' + key;
    const r = await fetch(url.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(body)});
    if (!r.ok) throw new Error(fn + ' ' + r.status + ' ' + (await r.text()).slice(0,200));
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  async initSupa(onChange){
    this.mode = 'supa';
    const h = decodeURIComponent(location.hash.slice(1));
    this.cofre = /^[A-Za-z0-9_-]{24,}$/.test(h) ? h : (lsGet('plantaorx:cofre', null));
    if (!this.cofre) { setStatus('semchave'); openKeyScreen(); return; }
    if (location.hash.slice(1) !== this.cofre) history.replaceState(null, '', '#' + this.cofre);
    this.lsKey = 'plantaorx:c:' + this.cofre.slice(0, 12);
    const local = lsGet(this.lsKey, {ov:{}, meta:{}}); this.ov = local.ov || {}; this.meta = local.meta || {};
    this.pend = lsGet(this.lsKey + ':pend', {});
    onChange();
    await this.pull();
    addEventListener('focus', () => this.pull());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.pull(); });
    setInterval(() => { if (!document.hidden) this.pull(); }, 60000);
  },
  async pull(){
    if (!this.cofre) return;
    try {
      await this.flush();
      const rows = await this.rpc('ler', {p_cofre:this.cofre});
      const ov = {}, meta = {};
      for (const r of rows || []) (r.colecao === 'itens' ? ov : meta)[r.id] = r.dados;
      for (const [k, v] of Object.entries(this.pend)) { const [c, ...rest] = k.split('/'); const id = rest.join('/'); const tgt = c === 'itens' ? ov : meta; if (v === null) delete tgt[id]; else tgt[id] = v; }
      const changed = JSON.stringify(ov) !== JSON.stringify(this.ov) || JSON.stringify(meta) !== JSON.stringify(this.meta);
      this.ov = ov; this.meta = meta; this.persistLocal();
      setStatus(Object.keys(this.pend).length ? 'pendente' : 'nuvem');
      if (changed) this.onChange();
    } catch (e) { setStatus('erro'); }
  },
  async flush(){
    for (const [k, v] of Object.entries(this.pend)) {
      const [c, ...rest] = k.split('/');
      await this.rpc('gravar', {p_cofre:this.cofre, p_colecao:c, p_id:rest.join('/'), p_dados:v});
      if (this.pend[k] === v) { delete this.pend[k]; lsSet(this.lsKey + ':pend', this.pend); }
    }
  },
  persistLocal(){ lsSet(this.lsKey, {ov:this.ov, meta:this.meta}); },
  write(coll, id, data){
    if (coll === 'itens') { if (data === null) delete this.ov[id]; else this.ov[id] = data; }
    else { if (data === null) delete this.meta[id]; else this.meta[id] = data; }
    this.persistLocal();
    if (this.mode === 'supa') {
      if (!this.cofre) { toast('Abra o site pelo seu link pessoal para salvar.'); return Promise.resolve(); }
      this.pend[coll + '/' + id] = data; lsSet(this.lsKey + ':pend', this.pend);
      this.flushing = (this.flushing || Promise.resolve()).then(() => this.flush()).then(() => setStatus(Object.keys(this.pend).length ? 'pendente' : 'nuvem'))
        .catch(() => { setStatus('pendente'); toast('Sem conexão: a alteração ficou guardada neste navegador e será enviada depois.'); });
      return this.flushing;
    }
    if (!this.db) return Promise.resolve();
    const key = coll + '/' + id;
    const prev = this.queue[key] || Promise.resolve();
    const p = prev.then(() => { const ref = this.db.collection((this.pref || '') + coll).doc(id); return data === null ? ref.delete() : ref.set(data); })
      .catch(e => { toast('Não foi possível salvar na nuvem. A alteração ficou neste navegador.'); setStatus('erro'); });
    this.queue[key] = p; return p;
  }
};

const REV = (() => { try { const t = (document.getElementById('revisao')?.textContent || '').trim(); return t.startsWith('{') ? JSON.parse(t) : {itens:{}}; } catch { return {itens:{}}; } })();

function aplicarCorrecoes(it, idxs){
  const ap = apontDe(sec, it); const x = clone(it); const falhou = [];

function filtered(s = sec, c = cat){
  const d = state.data[s] || {itens:[], categorias:[]}; let arr = d.itens;
  if (c === 'favoritas') arr = arr.filter(it => isFav(s, it.id));
  else if (c === 'recentes') arr = recentes(s).map(id => arr.find(it => it.id === id)).filter(Boolean);
  else if (c === 'rascunhos') arr = arr.filter(it => precisaRev(s, it));
  else if (c !== 'todas') arr = arr.filter(it => it.categoria === c);
  if (q.trim()) {
    const terms = norm(q).split(/\s+/).filter(Boolean);
    const scored = [];
    for (const it of arr) {
      const head = norm(`${it.nome} ${it.cid||''} ${catOf(s,it.categoria)?.nome||''}`);
      const body = norm(it.abas.map(a => a.nome + ' ' + a.texto).join(' ') + ' ' + (it.orientacoes||''));
      let sc = 0, ok = true;
      for (const t of terms) { if (head.includes(t)) sc += 10; else if (body.includes(t)) sc += 1; else { ok = false; break; } }
      if (ok) scored.push([sc, it]);
    }
    arr = scored.sort((a,b) => b[0] - a[0]).map(x => x[1]);
  }
  return arr;
}

function linhasDaBiblioteca(pedido){
  const STOP = new Set(['adicione','adicionar','acrescente','acrescentar','inclua','incluir','coloque','colocar','retire','retirar','tire','tirar','remova','remover','troque','trocar','substitua','substituir','para','pelo','pela','mais','menos','tambem','receita','dose','casa','oral','venoso','endovenoso','agora','dias','vezes','horas','comprimido','comprimidos','frasco','spray','jatos','apenas','somente','depois','antes','sintomaticos','antibiotico']);
  const termos = [...new Set(norm(pedido).split(/[^a-z0-9]+/).filter(t => t.length >= 4 && !STOP.has(t)))];
  if (!termos.length) return [];
  const achados = new Map();
  for (const it of state.data.prescricoes.itens) for (const a of it.abas) {
    const L = render(a.texto).split('\n');
    L.forEach((l, i) => {
      if (!/^\s*\d+\)/.test(l)) return;
      const n = norm(l); const t = termos.find(x => n.includes(x)); if (!t) return;
      const bloco = [l.trim()]; for (let k = i + 1; k < Math.min(i + 5, L.length); k++) { if (!L[k].trim() || /^\s*\d+\)/.test(L[k]) || /^(USO|OU|Orienta|Retorno|Se )/i.test(L[k].trim())) break; bloco.push(L[k].trim()); }
      const chave = bloco.join('\n'); const lista = achados.get(t) || []; if (!lista.includes(chave) && lista.length < 3) lista.push(chave); achados.set(t, lista);
    });
  }
  return [...achados.values()].flat().slice(0, 9);
}

function insertBloco(b, caret){

  let start = lines.findIndex(l => norm(l.trim()).startsWith(norm(b.via)));

  const block = [`${maxN + 1}) ${b.texto.split('\n')[0]}`, ...b.texto.split('\n').slice(1)];

function parseRx(text){
  const L = text.split('\n'); const vias = []; const viaMap = {}; const extras = []; const extMap = {};
  let via = null, item = null, extra = null, pending = [], depoisExtras = false;
  const getVia = name => { const key = norm(name); if (!viaMap[key]) { viaMap[key] = {nome:name, itens:[]}; vias.push(viaMap[key]); } return viaMap[key]; };
  const nextNonEmpty = i => { for (let j = i + 1; j < L.length; j++) if (L[j].trim()) return L[j].trim(); return ''; };
  for (let i = 0; i < L.length; i++) {
    const raw = L[i]; const l = raw.trim();
    if (!l) continue;
    if (VIA_RE.test(l)) { via = getVia(l); item = null; extra = null; continue; }
    if (/^(orienta|retorn|procurar|sinais de alarme)/i.test(l)) {
      const key = /^orienta/i.test(l) ? 'orient' : /^(retorn|procurar)/i.test(l) ? 'retorno' : norm(l);
      if (!extMap[key]) { extMap[key] = {titulo: key === 'retorno' ? 'Retorno ao PS, se:' : key === 'orient' ? 'Orientações' : l, linhas:[], vistos:new Set()}; extras.push(extMap[key]); }
      extra = extMap[key]; item = null; depoisExtras = true; continue;
    }
    if (extra && /^[-•–]/.test(l)) { const n = norm(l); if (!extra.vistos.has(n)) { extra.vistos.add(n); extra.linhas.push(l); } continue; }
    extra = null;
    if (depoisExtras) continue; // opções alternativas depois das orientações ficam de fora
    const m = l.match(ITEM_RE);
    if (m) { if (!via) via = getVia('USO ORAL'); item = {cab: m[2], pre: pending, linhas: []}; pending = []; via.itens.push(item); continue; }
    if (/:$/.test(l) && ITEM_RE.test(nextNonEmpty(i))) { pending.push(l); continue; }
    if (/^(no ps|para casa|em casa|prescri[cç][aã]o|receita m[eé]dica)\b/i.test(l)) continue;
    if (item) item.linhas.push(l); else pending.push(l);
  }
  return {vias, extras};
}
function combine(list, comOrient){
  const vias = []; const viaMap = {}; const extras = []; const extMap = {}; const vistos = new Set();
  for (const c of list) {
    const p = parseRx(c.texto);
    for (const v of p.vias) {
      const k = norm(v.nome); if (!viaMap[k]) { viaMap[k] = {nome:v.nome, itens:[]}; vias.push(viaMap[k]); }
      for (const it of v.itens) {
        const key = norm(it.cab.split(/-{3,}/)[0]).replace(/\[.*?\]|\(.*?\)/g,'').replace(/\s+/g,' ').trim();
        if (vistos.has(key)) continue; vistos.add(key); viaMap[k].itens.push(it);
      }
    }
    for (const e of p.extras) {
      const k = norm(e.titulo); if (!extMap[k]) { extMap[k] = {titulo:e.titulo, linhas:[], vistos:new Set()}; extras.push(extMap[k]); }
      for (const l of e.linhas) { const n = norm(l); if (!extMap[k].vistos.has(n)) { extMap[k].vistos.add(n); extMap[k].linhas.push(l); } }
    }
  }
  vias.sort((a,b) => { const ia = VIAS.findIndex(v => norm(a.nome).startsWith(norm(v))), ib = VIAS.findIndex(v => norm(b.nome).startsWith(norm(v))); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const out = []; let n = 0;
  for (const v of vias) {
    if (!v.itens.length) continue;
    out.push(v.nome, '');
    for (const it of v.itens) { n++; out.push(...it.pre, `${n}) ${it.cab}`, ...it.linhas, ''); }
  }
  if (comOrient) for (const e of extras) { if (!e.linhas.length) continue; out.push(e.titulo, ...e.linhas, ''); }
  return out.join('\n').trim();
}

/* ---------- HDA da biblioteca como estrutura do prontuário ---------- */
function hdaModelos(rxIt, notas){
  const H = state.data.hdas.itens, out = [];
  const add = id => { const h = id && H.find(x => x.id === id); if (h && !out.includes(h) && h.id !== HDA_GERAL) out.push(h); };
  if (rxIt?.hda) { add(rxIt.hda); return out; }
  const STOP = new Set(['dias','horas','anos','semana','semanas','paciente','refere','nega','sem','com','para','quadro','inicio','piora','melhora','hoje','ontem']);
  const terms = [...new Set(norm(notas).split(/[^a-z0-9]+/).filter(t => t.length > 3 && !STOP.has(t) && !/^\d/.test(t)).map(t => t.slice(0, 5)))];
  const pont = H.map(h => { const w = norm(h.nome).split(/[^a-z0-9]+/); let sc = 0; for (const t of terms) if (w.some(x => x.startsWith(t))) sc += 3; return [sc, h]; }).filter(x => x[0] >= 3).sort((a, b) => b[0] - a[0]);
  pont.slice(0, 2).forEach(([, h]) => add(h.id));
  const rc = rxCandidatas(notas, 1); if (rc.length === 1 && out.length < 3 && rc[0].hda) add(rc[0].hda); // rxCandidatas devolve a lista inteira quando nada combina
  return out.slice(0, 3);
}

  const t = [c.notas, c.exames?.out, c.exames?.lab, c.exames?.img, ...(c.evol || []).map(e => e.texto)].filter(Boolean).join('\n');
  return RE_LAB.test(t) || RE_IMG.test(t);

function semExamesInventados(t){
  const L = String(t || '').split('\n'); const out = []; let pula = false;
  for (const l of L) {
    if (/^\s*#+\s*Exames complementares/i.test(l)) { pula = true; continue; }
    if (pula && /^\s*#/.test(l) && !/^\s*#+\s*Exames/i.test(l)) pula = false;

    out.push(l);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ---------- orientações ao paciente em linguagem simples ---------- */
function orientSimples(t){
  const L = String(t || '').split('\n'); const out = []; let sec = '';
  const simp = s => s.replace(/,?\s*via oral,?/gi, '').replace(/de (\d+)\/\1 horas/g, 'de $1 em $1 horas').replace(/\s+/g, ' ').trim();
  for (let raw of L) {
    const l = raw.trim(); if (!l) continue;
    if (/^USO\s|^(no ps|para casa|em casa|receita m)/i.test(l)) continue;
    if (/^orienta/i.test(l)) { out.push('', '🏠 Cuidados em casa:'); sec = 'o'; continue; }
    if (/^(retorn|procurar|volte)/i.test(l)) { out.push('', '⚠️ Volte ao pronto-socorro se:'); sec = 'r'; continue; }
    const m = l.match(/^\d+\)\s*(.+?)(\s*\[.*?\])?\s*-{3,}.*$/) || l.match(/^(.+?)(\s*\[.*?\])?\s*-{3,}.*$/);
    if (m) { out.push('', '💊 ' + m[1].replace(/^\[[^\]]*\]\s*/, '').replace(/\s*\([^)]*®\)/g, '').trim()); continue; }
    if (/^OU$/i.test(l)) { out.push('   ou'); continue; }
    if (sec) out.push(l.startsWith('-') ? '• ' + l.replace(/^-\s*/, '') : l);
    else out.push('   ' + simp(l));
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function textoDoEvento(ev){
  if (ev?.error) { const e = new Error(ev.error.message || 'erro da IA'); throw e; }
  if (ev?.candidates) return (ev.candidates[0]?.content?.parts || []).filter(p => !p.thought && p.text).map(p => p.text).join('');
  if (ev?.type === 'content_block_delta' && ev.delta?.type === 'text_delta') return ev.delta.text || '';
  return '';
}
async function iaChamada(input, opts, stream){
  const {url, key} = window.PLANTAO_CFG;
  const messages = typeof input === 'string' ? [{role:'user', content:input}] : input;
  const h = {'Content-Type':'application/json', apikey:key};
  if (key.startsWith('eyJ')) h.Authorization = 'Bearer ' + key;
  const ctl = new AbortController();
  const limite = opts.modelTier === 'complex' ? 150000 : 90000;
  let motivo = '';
  let t = setTimeout(() => { motivo = stream ? 'sem-inicio' : 'tempo'; ctl.abort(); }, stream ? 25000 : limite);
  const vigia = () => { clearTimeout(t); t = setTimeout(() => { motivo = 'parado'; ctl.abort(); }, 45000); };
  let texto = '';
  try {
    const r = await fetch(url.replace(/\/$/,'') + '/functions/v1/' + (window.PLANTAO_CFG.fn || 'plantao-ia'), {method:'POST', headers:h, signal:ctl.signal,
      body:JSON.stringify({cofre:store.cofre, messages, tier:opts.modelTier || 'default', nivel:opts.nivel || '', stream})});
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const err = new Error(r.status === 403 && /chave/i.test(j.erro || '') ? 'A IA não reconheceu o seu código. Abra o site pelo seu link pessoal (com o código depois do #). Se for a prévia de teste, cole o link da prévia seguido do mesmo código.' : (j.erro || ('IA indisponível (' + r.status + ')')));
      err.tentarSemStream = stream && ![400, 401, 403].includes(r.status); err.repetir = r.status >= 500 && !j.erro; throw err;
    }
    const tipo = r.headers.get('content-type') || '';
    if (stream && r.body && /event-stream|text\/plain/.test(tipo)) {
      vigia();
      const leitor = r.body.getReader(), dec = new TextDecoder(); let resto = '';
      let sse = null; // descobre pelo conteúdo: SSE (data: …) ou texto puro
      while (true) {
        const {value, done} = await leitor.read(); if (done) break;
        vigia();
        const pedaco = dec.decode(value, {stream:true}); if (!pedaco) continue;
        let delta = '';
        if (sse === null) sse = /^\s*(data:|event:|:)/.test(pedaco);
        if (sse) {
          resto += pedaco; const linhas = resto.split(/\r?\n/); resto = linhas.pop() || '';
          for (const l of linhas) { if (!l.startsWith('data:')) continue; const d = l.slice(5).trim(); if (!d || d === '[DONE]') continue; let ev; try { ev = JSON.parse(d); } catch { continue; } delta += textoDoEvento(ev); }
        } else delta = pedaco;
        if (!delta) continue;
        texto += delta;
        try { opts.onText({text:texto, delta}); } catch (e) { console.warn(e); }
      }
      if (sse && resto.startsWith('data:')) { try { const d = textoDoEvento(JSON.parse(resto.slice(5).trim())); if (d) { texto += d; opts.onText({text:texto, delta:d}); } } catch {} }
      if (!texto.trim()) { const err = new Error('A IA não respondeu.'); err.tentarSemStream = true; throw err; }
      return {text:texto};
    }
    const j = await r.json().catch(() => ({}));
    const text = String(j.text || '');
    if (!text.trim()) { const err = new Error(j.erro || 'A IA não respondeu. Tente de novo.'); err.repetir = true; throw err; }
    return {text};
  } catch (e) {
    if (e.tentarSemStream !== undefined || e.repetir !== undefined) throw e;
    const abort = e.name === 'AbortError';
    const err = new Error(abort ? (motivo === 'tempo' ? 'A IA demorou demais para responder. Tente de novo.' : 'A resposta parou no meio.') : (/network|fetch|load failed/i.test(e.message) ? 'Sem conexão com a IA agora. Confira a internet e tente de novo.' : e.message));
    err.tentarSemStream = stream; err.repetir = !abort && /network|fetch|load failed/i.test(e.message);
    throw err;
  } finally { clearTimeout(t); }
}

/* leitura parcial de JSON enquanto a resposta chega: extrai "chave": "valor…" mesmo incompleto */
function jsonParcial(txt, chaves){
  const out = {};
  for (const k of chaves) {
    const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*"'));
    if (!m) continue;
    let i = m.index + m[0].length, v = '';
    while (i < txt.length) {
      const ch = txt[i];
      if (ch === '\\') {
        const nx = txt[i + 1]; if (nx === undefined) break;
        if (nx === 'n') v += '\n'; else if (nx === 't') v += '\t'; else if (nx === 'r') {} else if (nx === 'u') { const hx = txt.slice(i + 2, i + 6); if (hx.length < 4) break; v += String.fromCharCode(parseInt(hx, 16)); i += 4; } else v += nx;
        i += 2; continue;
      }
      if (ch === '"') break;
      v += ch; i++;
    }
    out[k] = v;
  }
  return out;
}

function rxCandidatas(texto, n = 25){
  const STOP = new Set(['dias','horas','anos','semana','semanas','paciente','refere','nega','sem','com','para','quadro','inicio','piora','melhora','hoje','ontem','fiz','feito']);
  const terms = [...new Set(norm(texto).split(/[^a-z0-9]+/).filter(t => t.length > 3 && !STOP.has(t) && !/^\d/.test(t)).map(t => t.slice(0, 5)))];
  const itens = state.data.prescricoes.itens;
  const pont = itens.map(it => { const w = norm(it.nome + ' ' + (it.cid || '') + ' ' + (catOf('prescricoes', it.categoria)?.nome || '')).split(/[^a-z0-9]+/); let sc = 0; for (const t of terms) if (w.some(x => x.startsWith(t))) sc += 3; return [sc + (isFav('prescricoes', it.id) ? 1 : 0), it]; });
  const achou = pont.filter(x => x[0] >= 3).sort((a, b) => b[0] - a[0]).map(x => x[1]);

function gxRefs(texto){

function calcEscore(e = pr.esc){
  const s = ESCORES.find(x => x.id === e.id) || ESCORES[0], v = e.v || {};
  let total;
  if (s.calc) total = s.calc(v);
  else {
    total = 0;
    for (const it of s.itens) {
      if (it.t === 'chk' && v[it.k]) total += it.p;
      if (it.t === 'sel') { if (v[it.k] == null) return {s, total:null, falta:true}; total += +v[it.k]; }
    }
  }
  if (total == null) return {s, total:null, falta:true};
  const r = s.interp(total, v);
  const pos = s.itens.filter(it => it.t === 'chk' && v[it.k] && it.p).map(it => /^[A-ZÀ-Ú][a-zà-ú]/.test(it.l) ? it.l.charAt(0).toLowerCase() + it.l.slice(1) : it.l);
  const texto = s.texto ? s.texto(s, total, r, pos, v)
    : `${s.nome} = ${fmtN(total)}${pos.length ? ' (' + pos.join(', ') + ')' : ''}: ${r.faixa}${r.conduta ? '; ' + r.conduta : ''}.`;

}

function dadosDoc(c){
  const cx = c.out ? (i => String(c.ed?.['pC' + i] ?? c.out['caixa' + i] ?? '')) : (() => '');
  const txt1 = cx(1), notas = c.notas || '';
  const m1 = (txt1.match(/^Idade:\s*(.+)$/im)?.[1] || '').trim(), m2 = (txt1 + ' ' + notas).match(/\b(\d{1,3})\s*(?:a|anos)\b/i);
  const idade = m1 || (m2 ? m2[1] + ' anos' : '');
  const hds = c.out ? linhasUteis(cx(3), 4).map(hdCurta).filter(Boolean) : [];
  const rx = c.rxId ? state.data.prescricoes.itens.find(x => x.id === c.rxId) : null;
  const hist = frasesCurtas((c.out ? linhasUteis(txt1, 8).join(' ') : notas).replace(/\b(HDA|Hist[óo]ria da doen[çc]a atual|QP|Queixa principal)\s*:\s*/gi, ''), 320);
  const conds = c.out ? linhasUteis(cx(4), 6).map(limpaFim).filter(Boolean) : [];
  const ef = c.out ? frasesCurtas(linhasUteis(cx(2), 8).map(l => l.replace(/^[-•]\s*/, '')).join(' '), 280) : '';
  const exames = (c.exames?.out || '').trim().split('\n').map(l => l.trim()).filter(Boolean).slice(0, 6).join('; ');
  const ult = (c.evol || []).slice(-1)[0];
  return {idade, hd: hds.join('; '), cid: rx?.cid || '', hist, conds: conds.join('; '), ef, exames, evol: ult ? frasesCurtas(linhasUteis(ult.texto, 4).join(' '), 220) : ''};
}
function preencherDoc(texto, c, opts = {}){
  const d = dadosDoc(c);
  const mapa = [
    [/^Idade$/i, d.idade], [/^CID$/i, opts.semCid ? '' : d.cid],
    [/^(Resumo clínico|Resumo do caso|Quadro clínico.*|Achados clínicos.*|Motivo do atendimento)$/i, d.hist],
    [/^(Indicação clínica.*|Hipótese diagnóstica|Diagnóstico|Motivo|Motivo da transferência|Dúvida.*)$/i, d.hd],
    [/^(Exames realizados|Exames relevantes|Exames)$/i, d.exames],
    [/^(Medicações e procedimentos realizados|Tratamento instituído|Tratamento no PS|Exames\/condutas realizados|Conduta)$/i, d.conds],
    [/^Exame físico$/i, d.ef], [/^Evolução$/i, d.evol]];
  mapa.unshift([/^(Paciente|Nome)$/i, c.iniciais || '']);
  return texto.replace(/^([^\n:]{2,50}):[ \t]*_{3,}([^\n]*)$/gm, (m, rot, resto) => {
    const r = mapa.find(([re]) => re.test(rot.trim())); if (r && r[1]) return `${rot}: ${r[1]}${resto.trim() ? resto.replace(/_{3,}/g, '').replace(/\s+([.,;])/g, '$1') : ''}`;
    return /^\s*[-•]?\s*/.test(rot) && !/testemunha|assinatura/i.test(rot) ? '\u0000' : m;
  }).split('\n').filter(l => l !== '\u0000').join('\n').replace(/\n{3,}/g, '\n\n');
}

function melhorModelo(pedido){
  const n = norm(pedido); if (!n.trim()) return null;
  let termos = n.split(/[^a-z0-9]+/).filter(t => t.length >= 2 && !DOC_STOP.has(t));
  for (const [re, add] of DOC_SIN) if (re.test(n)) termos.push(...add.split(' '));
  if (/\b(parecer|interconsulta)\b/.test(n)) return state.data.documentos.itens.find(x => /parecer/i.test(x.nome))?.id || null;
  let melhor = null, nota = 0;
  for (const it of state.data.documentos.itens) {
    const nome = norm(it.nome), cat = norm(catOf('documentos', it.categoria)?.nome || '');
    let sc = 0; for (const t of new Set(termos)) { if (nome.includes(t)) sc += t.length >= 4 ? 3 : 2; else if (cat.includes(t)) sc += 1; }
    if (sc > nota) { nota = sc; melhor = it.id; }
  }
  return nota >= 2 ? melhor : null;
}

/* ---------- passagem de plantão ---------- */
const LIXO_CX = /^(=+|-{3,}|#|>>)|DEPARTAMENTO DE|PEDIDO DE|IDENTIFICA|^Nome:|^Idade:|^HDA:?$|^Hist[óo]ria da doen[çc]a atual:?$|^Queixa principal:?$/i;
function linhasUteis(t, n){ return String(t || '').split('\n').map(l => l.trim()).filter(l => l && !LIXO_CX.test(l)).slice(0, n); }
const limpaFim = t => String(t || '').trim().replace(/^[-•*]\s*|^\d+[.)]\s*/, '').replace(/[\s;,.:]+$/, '');
function hdCurta(l){
  let t = limpaFim(l);
  t = t.split(/,?\s+(?:pel[ao]s?|por|devido|associad[ao]s?|secund[áa]ri[ao] a|em raz[ãa]o)\s+/i)[0];
  return limpaFim(t).slice(0, 90);
}
function frasesCurtas(t, max = 240){
  const txt = String(t || '').replace(/\s+/g, ' ').trim(); if (txt.length <= max) return txt;
  const corte = txt.slice(0, max); const p = corte.lastIndexOf('. ');
  return (p > 80 ? corte.slice(0, p + 1) : corte.replace(/\s\S*$/, '') + '…');
}
const listaPassagem = so => so ? [so] : casos.filter(temConteudo).sort((a, b) => a.criado - b.criado);
function passagemLocal(so){
  const lista = listaPassagem(so);
  if (!lista.length) return '';
  const hh = t => new Date(t).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const blocos = lista.map(c => {
    const cx = c.out ? (i => (c.ed?.['pC' + i] ?? c.out['caixa' + i] ?? '')) : null;
    const idade = cx ? (String(cx(1)).match(/^Idade:\s*(.+)$/im)?.[1] || '').trim() : '';
    const hds = cx ? linhasUteis(cx(3), 4).map(hdCurta).filter(Boolean) : [];
    const hist = frasesCurtas((cx ? linhasUteis(cx(1), 6).join(' ') : c.notas || '').replace(/\b(HDA|Hist[óo]ria da doen[çc]a atual|QP|Queixa principal)\s*:\s*/gi, ''), 240);
    const ult = (c.evol || []).slice(-1)[0];
    const A = [...(c.escores || []).map(e => limpaFim(e.texto)), c.decisao ? `destino sugerido: ${DESTINOS[c.decisao.destino]?.l.toLowerCase()}` : '',
      ult ? `última evolução (${ult.tipo.toLowerCase()}, ${ult.hora}): ${frasesCurtas(linhasUteis(ult.texto, 4).join(' '), 160)}` : ''].filter(Boolean);
    const conds = cx ? linhasUteis(cx(4), 5).map(limpaFim).filter(Boolean) : [];
    const pa = pendAbertas(c), r = reavAte(c) - Date.now();
    const L = [`▸ ${c.iniciais || 'Sem iniciais'}${idade ? ', ' + idade : ''} · no PS há ${tempoTxt(Date.now() - c.criado)} (entrada ${hh(c.criado)})`];
    L.push(`S — ${hds.length ? 'Hipóteses: ' + hds.join('; ') : hdResumo(c)}`);
    if (hist) L.push(`B — ${hist}`);
    L.push(`A — ${A.length ? A.join('; ') : 'ainda sem reavaliação registrada'}`);
    L.push(`R — ${conds.length ? 'Conduta: ' + conds.join('; ') + '. ' : ''}${pa.length ? 'Pendente: ' + pa.map(p => p.t.charAt(0).toLowerCase() + p.t.slice(1)).join('; ') + '. ' : 'Sem pendências registradas. '}${r <= 0 ? `⚠️ Reavaliação atrasada desde ${hh(reavAte(c))}.` : `Reavaliar às ${hh(reavAte(c))}.`}`);
    return L.join('\n');
  });
  const n = lista.length;
  return `PASSAGEM DE PLANTÃO — ${new Date().toLocaleDateString('pt-BR')} ${horaAgora()}${so ? '' : ` — ${n} paciente${n > 1 ? 's' : ''}`}\n\n` + blocos.join('\n\n');
}
function abrirPassagem(so){
  guardarCaso();

  const t = passagemLocal(so);
  if (!t) { toast('Nenhum paciente aberto para passar'); return; }
  openModal(`<h3>🔁 Passagem de plantão${so ? ' · ' + esc(so.iniciais || 'paciente') : ''}</h3>
    <p class="hint" style="margin:0">Formato SBAR: S situação, B breve histórico, A avaliação, R recomendações e pendências. Confira e edite antes de enviar.</p>

    <div class="edit-actions"><button class="btn primary" id="psCopy">Copiar</button>${aiSample ? '<button class="btn" id="psIA">Resumir com IA</button>' : ''}<button class="btn" id="psLocal">Refazer sem IA</button><button class="btn" data-close-btn>Fechar</button></div>`);
  $('#layer .modal').classList.add('wide');

      const ctx = lista.map((c, i) => `=== PACIENTE ${i + 1} (entrada há ${tempoTxt(Date.now() - c.criado)}; reavaliação ${reavAte(c) <= Date.now() ? 'ATRASADA' : 'prevista às ' + new Date(reavAte(c)).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}) ===\n${contextoDe(c)}`).join('\n\n');
      const prompt = `Escreva a passagem de plantão destes pacientes do pronto-socorro, para outro médico, no formato SBAR, curta e objetiva (máximo 6 linhas por paciente).
Formato exato para cada um:
▸ Paciente N, <idade e sexo se houver> — <diagnóstico principal>
S — situação atual e hipóteses (só os nomes, sem justificativas)
B — história relevante e comorbidades, em 1 ou 2 frases
A — avaliação: gravidade, exames alterados, escores, resposta ao tratamento
R — o que falta fazer, pendências e horário da reavaliação
Regras: use só o que está escrito; não invente; ignore cabeçalhos de formulário (linhas com ====, DEPARTAMENTO, IDENTIFICAÇÃO); destaque com ⚠️ pendências críticas e reavaliações atrasadas; sem Markdown (sem asteriscos ou #); deixe uma linha em branco entre os pacientes.

${ctx}`;
      try {
        const cab = `PASSAGEM DE PLANTÃO — ${new Date().toLocaleDateString('pt-BR')} ${horaAgora()}\n\n`;
        const r = await aiSample(prompt, {modelTier:'default', cache:false, onText:({text}) => { $('#psTxt').value = cab + text; }});
        let out = r.text.trim();
        lista.forEach((c, i) => { out = out.replace(new RegExp(`Paciente ${i + 1}(?!\\d)`, 'g'), c.iniciais || `Paciente ${i + 1}`); });
        $('#psTxt').value = `PASSAGEM DE PLANTÃO — ${new Date().toLocaleDateString('pt-BR')} ${horaAgora()}\n\n` + out;
      } catch (err) { toast(erroIA(err)); }
      b.disabled = false; b.textContent = 'Resumir com IA';
    }
  });
}

/* ---------- busca universal (Ctrl+K) ---------- */
let pal = {q:'', i:0, res:[]};
function palBuscar(qq){
  const terms = norm(qq).split(/\s+/).filter(Boolean); const out = [];
  for (const s of ['prescricoes', 'hdas', 'documentos']) {
    for (const it of state.data[s].itens) {
      const head = norm(`${it.nome} ${it.cid || ''} ${catOf(s, it.categoria)?.nome || ''}`);
      let sc = 0, ok = true;
      if (!terms.length) { if (!(s === 'prescricoes' && isFav(s, it.id))) continue; sc = 1; }
      for (const t of terms) { if (head.includes(t)) sc += head.startsWith(t) ? 14 : 10; else if (norm(it.abas.map(a => a.texto).join(' ')).includes(t)) sc += 1; else { ok = false; break; } }
      if (ok) out.push({s, it, sc: sc + (s === 'prescricoes' ? 0.5 : 0) + (isFav(s, it.id) ? 2 : 0)});
    }
  }
  return out.sort((a, b) => b.sc - a.sc).slice(0, 12);
}
function palTexto(s, it){ const t = comCid(s === 'documentos' ? cidDoModelo(it) : '', () => render(it.abas[0]?.texto || '')); return s === 'prescricoes' && !qtd ? semQtd(t) : t; }

function palRender(){
  const box = $('#palRes'); if (!box) return;
  pal.res = palBuscar(pal.q); pal.i = Math.min(pal.i, Math.max(0, pal.res.length - 1));
  box.innerHTML = pal.res.length ? pal.res.map((r, i) => `<div class="pal-it ${i === pal.i ? 'on' : ''}" data-pali="${i}" role="option" aria-selected="${i === pal.i}">
      <span class="pal-ico" aria-hidden="true">${SECS[r.s].ico}</span><div class="pal-nm"><b>${esc(r.it.nome)}</b><small>${SECS[r.s].label}${r.it.cid ? ' · CID ' + esc(r.it.cid) : ''}</small></div>
      <div class="pal-acts"><button class="mini" data-palcopy="${i}">Copiar</button>${r.s === 'prescricoes' && r.it.hda ? `<button class="mini" data-palhda="${i}">HDA</button>` : ''}<button class="mini" data-palopen="${i}">Abrir</button></div></div>`).join('')
    : `<div class="hint" style="padding:14px">${pal.q.trim() ? 'Nada encontrado.' : 'Digite uma doença, sintoma, CID ou documento. Sem texto, aparecem as suas prescrições favoritas.'}</div>`;
}
