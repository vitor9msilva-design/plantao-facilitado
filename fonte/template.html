<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style><title>Plantão Facilitado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de plantão — cabeçalho fixo com seções e busca, lista à esquerda, ficha à direita (empilha no celular) */
:root{
  --bg:#F3F5F5; --surface:#FFFFFF; --surface-2:#EAEFEE; --fg:#12201F; --muted:#5E6E6C; --line:#DDE3E2;
  --accent:#0B5C55; --accent-hover:#084843; --accent-soft:#E1EEEC; --accent-fg:#FFFFFF;
  --warn-bg:#FBE5E2; --warn-line:#F1C3BC; --warn-fg:#A3261B; --note-bg:#E2EFEC; --note-line:#C2DCD6; --note-fg:#0B4F4A;
  --star:#E8A33D; --paper:#FFFFFF; --paper-line:#E3EAE7; --field:#FDF0D9; --shadow:0 1px 2px rgba(11,40,36,.06),0 4px 14px rgba(11,40,36,.06);
  --f-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px; --accent-2:#16766C; --ok:#2E7D4F; --ok-bg:#E3F3E8; --mid:#B97412; --mid-bg:#FDF0D9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1413; --surface:#101D1B; --surface-2:#172825; --fg:#E1ECE9; --muted:#8BA19C; --line:#21342F;
  --accent:#3FB3A3; --accent-hover:#5CC6B7; --accent-soft:#12302B; --accent-fg:#04211D;
  --warn-bg:#3A1612; --warn-line:#5A231D; --warn-fg:#F2A096; --note-bg:#10291F; --note-line:#1D463E; --note-fg:#8FD3C6;
  --star:#F2B85A; --paper:#0D1917; --paper-line:#21342F; --field:#3A2A0C; --shadow:0 1px 2px rgba(0,0,0,.3);
  --accent-2:#2A8C7F; --ok:#7FD39B; --ok-bg:#16301F; --mid:#F2B85A; --mid-bg:#3A2A0C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1413; --surface:#101D1B; --surface-2:#172825; --fg:#E1ECE9; --muted:#8BA19C; --line:#21342F;
  --accent:#3FB3A3; --accent-hover:#5CC6B7; --accent-soft:#12302B; --accent-fg:#04211D;
  --warn-bg:#3A1612; --warn-line:#5A231D; --warn-fg:#F2A096; --note-bg:#10291F; --note-line:#1D463E; --note-fg:#8FD3C6;
  --star:#F2B85A; --paper:#0D1917; --paper-line:#21342F; --field:#3A2A0C; --shadow:0 1px 2px rgba(0,0,0,.3);
  --accent-2:#2A8C7F; --ok:#7FD39B; --ok-bg:#16301F; --mid:#F2B85A; --mid-bg:#3A2A0C;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- cabeçalho ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 8px 24px -18px rgba(15,40,34,.35)}
.top .wrap{display:grid;gap:12px;padding-block:14px 12px}
.brand-row{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--accent) 0%,var(--accent-2) 100%);box-shadow:0 4px 12px -4px var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:-.02em;flex:none}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.icon-btn{height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sections{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.sec-btn{height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.sec-btn .n{font-weight:500;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sec-btn{transition:background .15s,border-color .15s}
.sec-btn:hover{border-color:var(--accent)}
.sec-btn[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px -8px var(--accent)}
.sec-btn[aria-selected="true"] .n{color:var(--accent-fg);opacity:.85}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 44px 0 42px;font-size:16px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .clear{position:absolute;right:8px;top:50%;translate:0 -50%;border:0;background:none;color:var(--muted);height:32px;width:32px;border-radius:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip.add{border-style:dashed;color:var(--accent)}

/* ---------- corpo ---------- */
.main{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:20px;padding-block:16px calc(40px + var(--cart-h,0px));align-items:start}
.list-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,230px) + 12px);max-height:calc(100vh - var(--top-h,230px) - 28px);display:flex;flex-direction:column;min-height:0}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px}
.list-head span{color:var(--muted);font-size:13px;font-weight:500}
.add-btn{height:34px;padding:0 12px;border-radius:9px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:13px}
.list{overflow-y:auto;display:grid;gap:8px;padding:2px;min-height:0;align-content:start}
.card{display:grid;grid-template-columns:40px minmax(0,1fr) 32px;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.card{transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.card[aria-current="true"]{border:2px solid var(--accent);padding:11px;background:var(--surface)}
.card .ico{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:19px}
.card .t{font-weight:600;font-size:15px;line-height:1.25}
.card .s{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .vazio{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;vertical-align:1px}
.star{width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--line);display:grid;place-items:center;font-size:20px;line-height:1}
.star:hover{color:var(--star)}
.star.on{color:var(--star)}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 2px 10px;font-size:13px;color:var(--muted)}
.empty-list{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.detail{min-width:0;display:grid;gap:14px}
.d-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.d-head h2{margin:4px 0 8px;font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.back{display:none;border:0;background:none;color:var(--accent);font-weight:600;padding:0;margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{height:30px;padding:0 10px;border-radius:8px;background:var(--surface-2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:0;color:var(--muted)}
.badge.cid{background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.d-star{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;color:var(--muted);flex:none}
.d-star.on{color:var(--star);border-color:var(--star)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:8px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;flex:1 1 140px;max-width:100%}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tab.add{flex:0 0 auto;border-style:dashed;color:var(--accent)}

.paper{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.paper-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.paper-head b{font-size:14px}
.paper-head .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mini{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.mini:hover{border-color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(16px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.rx{display:block;width:100%;min-height:340px;max-height:70vh;resize:vertical;border:0;padding:16px 18px;background:var(--paper);font-family:var(--f-mono);font-size:13.5px;line-height:1.6;white-space:pre-wrap;tab-size:2}
.rx:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
.rx[readonly]{color:var(--muted)}
.paper-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{flex:1 1 220px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.save{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--warn-fg);border-color:var(--warn-line)}
.hint{font-size:12.5px;color:var(--muted);padding:0 4px}
.dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--star);margin-right:6px;vertical-align:1px}

.block{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;gap:8px}
.block .bh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.block .bh b{font-size:14px}
.block p{margin:0;white-space:pre-wrap}
.block.alarm{background:var(--warn-bg);border-color:var(--warn-line)}
.block.alarm .bh b{color:var(--warn-fg)}
.block.note{background:var(--note-bg);border-color:var(--note-line)}
.block.note .bh b{color:var(--note-fg)}
.block textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);resize:vertical;font-size:14px}

.editbar{border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);padding:14px;display:grid;gap:12px}
.editbar .row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr);gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.field input,.field select{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 10px;width:100%;min-width:0}
.edit-actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);font-size:14px;font-weight:500}

.welcome{border:1px dashed var(--line);border-radius:var(--r);padding:40px 24px;text-align:center;color:var(--muted)}

/* ---------- modal e aviso ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,20,16,.45);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:20px;display:grid;gap:14px}
.modal h3{margin:0;font-size:18px}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.cat-row input{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px;min-width:0;width:100%}
.cat-row .emo{text-align:center;font-size:18px}
.cat-row small{color:var(--muted);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.modal textarea{width:100%;min-height:140px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px;font-family:var(--f-mono);font-size:12px}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--accent)}
.status.warn i{background:var(--star)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--cart-h,0px) + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
mark{background:var(--field);color:inherit;border-radius:3px;padding:0 1px}

/* rascunho, blocos e receita montada */
.combo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.combo-bar select{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 10px;width:100%;min-width:0}
.card .rasc{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--star);border:1px solid var(--star);border-radius:5px;padding:0 5px;vertical-align:1px}
.draft-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--star);background:var(--field);font-size:14px}
.draft-banner b{font-weight:700}
.draft-banner span{flex:1 1 240px}
.blk-search{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.blk-list{display:grid;gap:6px;max-height:52vh;overflow:auto;padding-right:2px}
.blk-via{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:8px 2px 2px}
.blk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.blk b{font-size:14px;font-weight:600}
.blk small{grid-column:1;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .acts{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px}
.blk-form{display:grid;gap:8px;border:1px dashed var(--accent);border-radius:10px;padding:12px;background:var(--accent-soft)}
.blk-form input,.blk-form select{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 10px;width:100%;min-width:0}
.cartbar{position:fixed;left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 28px rgba(5,40,32,.28);max-width:calc(100% - 32px);font-weight:600;font-size:14px}
.cartbar button{height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--accent-fg);color:var(--accent);font-weight:700}
.cartbar .x{background:transparent;color:var(--accent-fg);padding:0 8px;font-size:16px}
.cart-src{display:flex;flex-wrap:wrap;gap:6px}
.cart-src span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--surface-2);font-size:13px;font-weight:500;max-width:100%}
.cart-src span button{border:0;background:none;color:var(--muted);height:24px;width:24px;border-radius:6px}
.modal .rx{min-height:300px;max-height:50vh;border:1px solid var(--line);border-radius:10px}
.modal.wide{width:min(860px,100%)}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .list-col{position:static;max-height:none}
  .main.has-sel .list-col{display:none}
  .main:not(.has-sel) .detail{display:none}
  .back{display:inline-block}
  .editbar .row{grid-template-columns:1fr}
  .brand p{display:none}
  .tools .lbl{display:none}
}
@media (max-width:480px){
  .sec-btn{font-size:14px;gap:4px}
  .sec-btn .n{display:none}
  .modal .row2{grid-template-columns:1fr}
  .cat-row{grid-template-columns:48px minmax(0,1fr) auto auto}
  .cat-row small{display:none}
}
/* prontuário com IA */
.pront{display:grid;grid-template-columns:250px minmax(0,1fr) 370px;grid-template-areas:'casos main side';gap:18px;align-items:start;max-width:1760px;margin:0 auto;padding-block:16px calc(40px + var(--cart-h,0px))}
#casos{grid-area:casos}#prontMain{grid-area:main}#prontSide{grid-area:side}
#prontSide{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,160px) + 12px);max-height:calc(100vh - var(--top-h,160px) - 28px);overflow:auto;display:grid;gap:12px;align-content:start;padding:2px;overscroll-behavior:contain}
.side-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:2px 4px}.side-head span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.side-head b{font-size:18px}

const store = {

  async init(onChange){

  },
  /* ----- Supabase (versão publicada fora do Claude) ----- */
  cofre:null, pend:{}, lsKey:'plantaorx:v1',
  async rpc(fn, body){
    const {url, key} = window.PLANTAO_CFG;
    const h = {'Content-Type':'application/json', apikey:key};
    if (key.startsWith('eyJ')) h.Authorization = 'Bearer ' + key;
    const r = await fetch(url.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {method:'POST', headers:h, body:JSON.stringify(body)});
    if (!r.ok) throw new Error(fn + ' ' + r.status + ' ' + (await r.text()).slice(0,200));
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  async initSupa(onChange){
    this.mode = 'supa';
    const h = decodeURIComponent(location.hash.slice(1));
    this.cofre = /^[A-Za-z0-9_-]{24,}$/.test(h) ? h : (lsGet('plantaorx:cofre', null));
    if (!this.cofre) { setStatus('semchave'); openKeyScreen(); return; }
    if (location.hash.slice(1) !== this.cofre) history.replaceState(null, '', '#' + this.cofre);
    this.lsKey = 'plantaorx:c:' + this.cofre.slice(0, 12);
    const local = lsGet(this.lsKey, {ov:{}, meta:{}}); this.ov = local.ov || {}; this.meta = local.meta || {};
    this.pend = lsGet(this.lsKey + ':pend', {});

    addEventListener('focus', () => this.pull());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.pull(); });
    setInterval(() => { if (!document.hidden) this.pull(); }, 60000);
  },
  async pull(){
    if (!this.cofre) return;
    try {
      await this.flush();
      const rows = await this.rpc('ler', {p_cofre:this.cofre});
      const ov = {}, meta = {};
      for (const r of rows || []) (r.colecao === 'itens' ? ov : meta)[r.id] = r.dados;
      for (const [k, v] of Object.entries(this.pend)) { const [c, ...rest] = k.split('/'); const id = rest.join('/'); const tgt = c === 'itens' ? ov : meta; if (v === null) delete tgt[id]; else tgt[id] = v; }
      const changed = JSON.stringify(ov) !== JSON.stringify(this.ov) || JSON.stringify(meta) !== JSON.stringify(this.meta);
      this.ov = ov; this.meta = meta; this.persistLocal();
      setStatus(Object.keys(this.pend).length ? 'pendente' : 'nuvem');

    } catch (e) { setStatus('erro'); }
  },
  async flush(){
    for (const [k, v] of Object.entries(this.pend)) {

  persistLocal(){ lsSet(this.lsKey, {ov:this.ov, meta:this.meta}); },
  write(coll, id, data){

        .catch(() => { setStatus('pendente'); toast('Sem conexão: a alteração ficou guardada neste navegador e será enviada depois.'); });
      return this.flushing;
    }
    if (!this.db) return Promise.resolve();
    const key = coll + '/' + id;
    const prev = this.queue[key] || Promise.resolve();
    const p = prev.then(() => { const ref = this.db.collection((this.pref || '') + coll).doc(id); return data === null ? ref.delete() : ref.set(data); })
      .catch(e => { toast('Não foi possível salvar na nuvem. A alteração ficou neste navegador.'); setStatus('erro'); });

  }

function filtered(s = sec, c = cat){

      const body = norm(it.abas.map(a => a.nome + ' ' + a.texto).join(' ') + ' ' + (it.orientacoes||''));

async function restoreBackup(txt){

function parseRx(text){
  const L = text.split('\n'); const vias = []; const viaMap = {}; const extras = []; const extMap = {};
  let via = null, item = null, extra = null, pending = [], depoisExtras = false;
  const getVia = name => { const key = norm(name); if (!viaMap[key]) { viaMap[key] = {nome:name, itens:[]}; vias.push(viaMap[key]); } return viaMap[key]; };
  const nextNonEmpty = i => { for (let j = i + 1; j < L.length; j++) if (L[j].trim()) return L[j].trim(); return ''; };
  for (let i = 0; i < L.length; i++) {
    const raw = L[i]; const l = raw.trim();
    if (!l) continue;
    if (VIA_RE.test(l)) { via = getVia(l); item = null; extra = null; continue; }
    if (/^(orienta|retorn|procurar|sinais de alarme)/i.test(l)) {
      const key = /^orienta/i.test(l) ? 'orient' : /^(retorn|procurar)/i.test(l) ? 'retorno' : norm(l);
      if (!extMap[key]) { extMap[key] = {titulo: key === 'retorno' ? 'Retorno ao PS, se:' : key === 'orient' ? 'Orientações' : l, linhas:[], vistos:new Set()}; extras.push(extMap[key]); }
      extra = extMap[key]; item = null; depoisExtras = true; continue;
    }
    if (extra && /^[-•–]/.test(l)) { const n = norm(l); if (!extra.vistos.has(n)) { extra.vistos.add(n); extra.linhas.push(l); } continue; }
    extra = null;
    if (depoisExtras) continue; // opções alternativas depois das orientações ficam de fora
    const m = l.match(ITEM_RE);
    if (m) { if (!via) via = getVia('USO ORAL'); item = {cab: m[2], pre: pending, linhas: []}; pending = []; via.itens.push(item); continue; }
    if (/:$/.test(l) && ITEM_RE.test(nextNonEmpty(i))) { pending.push(l); continue; }
    if (/^(no ps|para casa|em casa|prescri[cç][aã]o|receita m[eé]dica)\b/i.test(l)) continue;
    if (item) item.linhas.push(l); else pending.push(l);
  }
  return {vias, extras};
}
function combine(list, comOrient){
  const vias = []; const viaMap = {}; const extras = []; const extMap = {}; const vistos = new Set();
  for (const c of list) {
    const p = parseRx(c.texto);
    for (const v of p.vias) {
      const k = norm(v.nome); if (!viaMap[k]) { viaMap[k] = {nome:v.nome, itens:[]}; vias.push(viaMap[k]); }
      for (const it of v.itens) {
        const key = norm(it.cab.split(/-{3,}/)[0]).replace(/\[.*?\]|\(.*?\)/g,'').replace(/\s+/g,' ').trim();
        if (vistos.has(key)) continue; vistos.add(key); viaMap[k].itens.push(it);
      }
    }
    for (const e of p.extras) {
      const k = norm(e.titulo); if (!extMap[k]) { extMap[k] = {titulo:e.titulo, linhas:[], vistos:new Set()}; extras.push(extMap[k]); }
      for (const l of e.linhas) { const n = norm(l); if (!extMap[k].vistos.has(n)) { extMap[k].vistos.add(n); extMap[k].linhas.push(l); } }
    }
  }
  vias.sort((a,b) => { const ia = VIAS.findIndex(v => norm(a.nome).startsWith(norm(v))), ib = VIAS.findIndex(v => norm(b.nome).startsWith(norm(v))); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  const out = []; let n = 0;
  for (const v of vias) {
    if (!v.itens.length) continue;
    out.push(v.nome, '');
    for (const it of v.itens) { n++; out.push(...it.pre, `${n}) ${it.cab}`, ...it.linhas, ''); }
  }
  if (comOrient) for (const e of extras) { if (!e.linhas.length) continue; out.push(e.titulo, ...e.linhas, ''); }
  return out.join('\n').trim();
}

"caixa2": exame físico. EXAMES COMPLEMENTARES: só escreva "# Exames complementares" (ou linhas com ">>") se o médico escreveu RESULTADOS de exames nos dados do caso; os valores de exemplo das instruções (Hb 12,5, Leuco 10.900 etc.) são só formato e NUNCA podem aparecer; exame pedido e ainda sem resultado não entra aqui. Personalize o exame para a queixa: além do modelo padrão, inclua o exame dirigido ao sistema da queixa principal (ex.: cefaleia → pupilas, rigidez de nuca, sinais meníngeos, pares cranianos, força, coordenação e marcha; dor abdominal → descompressão brusca, Murphy, Rovsing, Giordano; dor de garganta → oroscopia e linfonodos cervicais; lombalgia → palpação, Lasègue, força e reflexos; ITU → Giordano; trauma → segmento acometido, pulsos e sensibilidade distais). Para o que não foi informado, descreva como normal; o que for alteração informada, descreva como informado; nunca invente alteração;
"caixa3": hipóteses diagnósticas, raciocinadas a partir do que o médico escreveu. Depois delas, se o quadro tiver escore validado aplicável (CURB-65 e qSOFA em pneumonia/infecção; HEART, Wells e PERC em dor torácica/dispneia/TEP; Wells TVP; Centor/McIsaac em faringite; ABCD2 em AIT; Alvarado em dor em FID; CHA2DS2-VASc em FA; Glasgow em TCE/rebaixamento), escreva "# Escores:" e, em uma linha cada, o nome, o resultado e os critérios que pontuaram, calculados SÓ com dados informados (ex.: "- CURB-65: 2 (idade ≥ 65 anos, FR ≥ 30); ureia não informada."). Se nenhum se aplicar ou não houver dados, omita a seção;
"caixa4": condutas, sucintas e específicas, em lista com "-". Parta do que o médico escreveu e DETALHE cada item: "sintomáticos" vira os medicamentos e doses da prescrição do PS informada (ex.: "- Dipirona 1 g EV e ondansetrona 4 mg EV."); "exames lab"/"laboratório" vira os exames pertinentes ao quadro, nomeados (ex.: "- Hemograma, PCR, ureia, creatinina, sódio e potássio."); "imagem"/"exame de imagem" vira o exame específico indicado ao quadro (ex.: "- TC de crânio sem contraste."). Não crie condutas de outro tipo que ele não escreveu, com uma exceção: se houver algo importante para a segurança (indicação de internação ou UTI, escore alto, sinal de alarme presente, exame alterado relevante), acrescente uma linha direta começando por "- Atenção:". Se ele não informou nenhuma conduta, escreva "- Prescrevo medicações conforme prescrição.";
"gravidade": objeto {"destino": "alta" | "observacao" | "internacao" | "uti", "motivo": "uma frase curta com os dados que justificam"}, a sua avaliação do destino mais seguro pelo quadro, sinais vitais, escores e exames informados;
"receita": o id da receita indicada abaixo, ou null.
Dentro de cada caixa, texto puro pronto para prontuário eletrônico: títulos no formato "# Título:", listas apenas com "-", quebras de linha como \n, sem negrito nem outro Markdown.
SEM LACUNAS: nunca escreva "[completar]", "completar", "___", colchetes ou campos para preencher. Use as informações fornecidas para construir o texto e o raciocínio; o que não foi informado é omitido ou escrito de forma neutra (ex.: comorbidades não informadas → "- Nega" só se o médico negou; senão omita a linha). Nunca invente dados.`;
/* ---------- HDA da biblioteca como estrutura do prontuário ---------- */
function hdaModelos(rxIt, notas){
  const H = state.data.hdas.itens, out = [];
  const add = id => { const h = id && H.find(x => x.id === id); if (h && !out.includes(h) && h.id !== HDA_GERAL) out.push(h); };
  if (rxIt?.hda) { add(rxIt.hda); return out; }
  const STOP = new Set(['dias','horas','anos','semana','semanas','paciente','refere','nega','sem','com','para','quadro','inicio','piora','melhora','hoje','ontem']);
  const terms = [...new Set(norm(notas).split(/[^a-z0-9]+/).filter(t => t.length > 3 && !STOP.has(t) && !/^\d/.test(t)).map(t => t.slice(0, 5)))];
  const pont = H.map(h => { const w = norm(h.nome).split(/[^a-z0-9]+/); let sc = 0; for (const t of terms) if (w.some(x => x.startsWith(t))) sc += 3; return [sc, h]; }).filter(x => x[0] >= 3).sort((a, b) => b[0] - a[0]);
  pont.slice(0, 2).forEach(([, h]) => add(h.id));
  const rc = rxCandidatas(notas, 1); if (rc.length === 1 && out.length < 3 && rc[0].hda) add(rc[0].hda); // rxCandidatas devolve a lista inteira quando nada combina
  return out.slice(0, 3);
}

function temResultadoExame(c){
  const t = [c.notas, c.exames?.out, c.exames?.lab, c.exames?.img, ...(c.evol || []).map(e => e.texto)].filter(Boolean).join('\n');
  return RE_LAB.test(t) || RE_IMG.test(t);
}
function semExamesInventados(t){
  const L = String(t || '').split('\n'); const out = []; let pula = false;
  for (const l of L) {
    if (/^\s*#+\s*Exames complementares/i.test(l)) { pula = true; continue; }
    if (pula && /^\s*#/.test(l) && !/^\s*#+\s*Exames/i.test(l)) pula = false;
    if (pula || /^\s*>>/.test(l)) continue;
    out.push(l);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

}

function orientSimples(t){
  const L = String(t || '').split('\n'); const out = []; let sec = '';
  const simp = s => s.replace(/,?\s*via oral,?/gi, '').replace(/de (\d+)\/\1 horas/g, 'de $1 em $1 horas').replace(/\s+/g, ' ').trim();
  for (let raw of L) {
    const l = raw.trim(); if (!l) continue;
    if (/^USO\s|^(no ps|para casa|em casa|receita m)/i.test(l)) continue;
    if (/^orienta/i.test(l)) { out.push('', '🏠 Cuidados em casa:'); sec = 'o'; continue; }
    if (/^(retorn|procurar|volte)/i.test(l)) { out.push('', '⚠️ Volte ao pronto-socorro se:'); sec = 'r'; continue; }
    const m = l.match(/^\d+\)\s*(.+?)(\s*\[.*?\])?\s*-{3,}.*$/) || l.match(/^(.+?)(\s*\[.*?\])?\s*-{3,}.*$/);
    if (m) { out.push('', '💊 ' + m[1].replace(/^\[[^\]]*\]\s*/, '').replace(/\s*\([^)]*®\)/g, '').trim()); continue; }
    if (/^OU$/i.test(l)) { out.push('   ou'); continue; }
    if (sec) out.push(l.startsWith('-') ? '• ' + l.replace(/^-\s*/, '') : l);
    else out.push('   ' + simp(l));
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* IA da versão Netlify: passa pela função do Supabase (a chave da API fica lá).
   Streaming com rede de segurança: se o fluxo não começar em 25 s ou falhar, refaz sem streaming
   e desliga o streaming por 12 h neste navegador. */
const STREAM_OFF = 'plantaorx:streamOff';
const streamLiberado = () => window.PLANTAO_CFG?.stream !== false && !(Date.now() - (lsGet(STREAM_OFF, 0) || 0) < 12 * 3600e3);
async function iaServidor(input, opts = {}){
  if (typeof opts.onText === 'function' && streamLiberado()) {
    try { return await iaChamada(input, opts, true); }
    catch (e) { if (!e.tentarSemStream) throw e; lsSet(STREAM_OFF, Date.now()); console.warn('[plantao] streaming falhou, refazendo sem streaming:', e.message); }
  }
  for (let tentativa = 1; ; tentativa++) {
    try { return await iaChamada(input, opts, false); }
    catch (e) { if (tentativa >= 2 || !e.repetir) throw e; await new Promise(r => setTimeout(r, 1500)); }
  }
}
function textoDoEvento(ev){
  if (ev?.error) { const e = new Error(ev.error.message || 'erro da IA'); throw e; }
  if (ev?.candidates) return (ev.candidates[0]?.content?.parts || []).filter(p => !p.thought && p.text).map(p => p.text).join('');
  if (ev?.type === 'content_block_delta' && ev.delta?.type === 'text_delta') return ev.delta.text || '';
  return '';
}
async function iaChamada(input, opts, stream){
  const {url, key} = window.PLANTAO_CFG;

  const h = {'Content-Type':'application/json', apikey:key};
  if (key.startsWith('eyJ')) h.Authorization = 'Bearer ' + key;
  const ctl = new AbortController();
  const limite = opts.modelTier === 'complex' ? 150000 : 90000;
  let motivo = '';
  let t = setTimeout(() => { motivo = stream ? 'sem-inicio' : 'tempo'; ctl.abort(); }, stream ? 25000 : limite);
  const vigia = () => { clearTimeout(t); t = setTimeout(() => { motivo = 'parado'; ctl.abort(); }, 45000); };
  let texto = '';
  try {
    const r = await fetch(url.replace(/\/$/,'') + '/functions/v1/' + (window.PLANTAO_CFG.fn || 'plantao-ia'), {method:'POST', headers:h, signal:ctl.signal,
      body:JSON.stringify({cofre:store.cofre, messages, tier:opts.modelTier || 'default', nivel:opts.nivel || '', stream})});
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const err = new Error(r.status === 403 && /chave/i.test(j.erro || '') ? 'A IA não reconheceu o seu código. Abra o site pelo seu link pessoal (com o código depois do #). Se for a prévia de teste, cole o link da prévia seguido do mesmo código.' : (j.erro || ('IA indisponível (' + r.status + ')')));
      err.tentarSemStream = stream && ![400, 401, 403].includes(r.status); err.repetir = r.status >= 500 && !j.erro; throw err;
    }
    const tipo = r.headers.get('content-type') || '';
    if (stream && r.body && /event-stream|text\/plain/.test(tipo)) {
      vigia();
      const leitor = r.body.getReader(), dec = new TextDecoder(); let resto = '';
      let sse = null; // descobre pelo conteúdo: SSE (data: …) ou texto puro
      while (true) {
        const {value, done} = await leitor.read(); if (done) break;
        vigia();
        const pedaco = dec.decode(value, {stream:true}); if (!pedaco) continue;
        let delta = '';
        if (sse === null) sse = /^\s*(data:|event:|:)/.test(pedaco);
        if (sse) {
          resto += pedaco; const linhas = resto.split(/\r?\n/); resto = linhas.pop() || '';
          for (const l of linhas) { if (!l.startsWith('data:')) continue; const d = l.slice(5).trim(); if (!d || d === '[DONE]') continue; let ev; try { ev = JSON.parse(d); } catch { continue; } delta += textoDoEvento(ev); }
        } else delta = pedaco;
        if (!delta) continue;
        texto += delta;
        try { opts.onText({text:texto, delta}); } catch (e) { console.warn(e); }
      }
      if (sse && resto.startsWith('data:')) { try { const d = textoDoEvento(JSON.parse(resto.slice(5).trim())); if (d) { texto += d; opts.onText({text:texto, delta:d}); } } catch {} }
      if (!texto.trim()) { const err = new Error('A IA não respondeu.'); err.tentarSemStream = true; throw err; }
      return {text:texto};
    }
    const j = await r.json().catch(() => ({}));
    const text = String(j.text || '');
    if (!text.trim()) { const err = new Error(j.erro || 'A IA não respondeu. Tente de novo.'); err.repetir = true; throw err; }
    return {text};
  } catch (e) {
    if (e.tentarSemStream !== undefined || e.repetir !== undefined) throw e;

/* leitura parcial de JSON enquanto a resposta chega: extrai "chave": "valor…" mesmo incompleto */
function jsonParcial(txt, chaves){
  const out = {};
  for (const k of chaves) {
    const m = txt.match(new RegExp('"' + k + '"\\s*:\\s*"'));
    if (!m) continue;
    let i = m.index + m[0].length, v = '';
    while (i < txt.length) {
      const ch = txt[i];
      if (ch === '\\') {
        const nx = txt[i + 1]; if (nx === undefined) break;
        if (nx === 'n') v += '\n'; else if (nx === 't') v += '\t'; else if (nx === 'r') {} else if (nx === 'u') { const hx = txt.slice(i + 2, i + 6); if (hx.length < 4) break; v += String.fromCharCode(parseInt(hx, 16)); i += 4; } else v += nx;
        i += 2; continue;
      }
      if (ch === '"') break;
      v += ch; i++;
    }
    out[k] = v;
  }
  return out;
}

O médico envia SINTOMAS/QUADRO do paciente ou PEDIDOS de prescrição (lista do que quer prescrever). Você devolve a prescrição pronta para copiar.

REGRAS CLÍNICAS
- Doses usuais de adulto. Use SOMENTE medicamentos registrados e comercializados no Brasil (ANVISA), com nome genérico + concentração + marca brasileira entre colchetes. Não use marcas ou apresentações que só existem fora do Brasil.
- PREFERÊNCIAS DO MÉDICO: anti-inflamatório oral = Naproxeno 500 ou 550 mg [Flanax®] OU Cetorolaco 10 mg sublingual [Toragesic®]; anti-inflamatório no PS = Cetorolaco 30 mg/mL [Toragesic®] EV ou IM. Corticoide nasal = Furoato de mometasona 50 mcg/jato [Nasonex®] OU Azelastina + Fluticasona [Dymista®]. Não use outros AINEs nem outros corticoides nasais, salvo pedido do médico.
- Respeite alergias, peso, idade, gestação, função renal e comorbidades informados. Se algo informado contraindica uma droga, troque por alternativa e explique em "obs".
- Quando o médico fizer PEDIDOS explícitos, prescreva exatamente o que foi pedido, completando dose, diluição, via, velocidade e posologia. Não acrescente outras drogas além do pedido, exceto a opção de dor intensa (ver abaixo) e antiemético quando houver opioide.
- Quando vier apenas SINTOMAS, escolha o tratamento sintomático e/ou etiológico mais adequado e conservador. Não presuma diagnóstico que dependa de exame; se um antibiótico depender de confirmação, diga isso em "obs".
- Prefira as escolhas dos MODELOS DO MÉDICO enviados abaixo, quando se aplicarem ao caso.
- Não invente dados do paciente.

OPÇÃO PARA DOR AGUDA INTENSA (sempre que houver dor no quadro ou quando o médico pedir analgesia)
- Na receita de alta, inclua um bloco "Se dor intensa, apesar da dipirona (escolher uma opção):" com Paracetamol 500 mg + Codeína 30 mg [Tylex® 30 mg] OU Tramadol 50 mg [Tramal®], por até 3 dias, e a orientação de receituário de controle especial (2 vias).
- Na prescrição do PS, inclua tramadol EV diluído (e morfina titulada se dor refratária) com ondansetrona.
- Não use esses opioides se houver contraindicação informada.

FORMATO (igual aos modelos do médico)
- Seções por via: "USO ORAL", "USO ENDOVENOSO", "USO INTRAMUSCULAR", "USO TÓPICO", "USO NASAL", "USO INALATÓRIO", "USO OFTÁLMICO", "OUTROS".
- Itens numerados "1) Medicamento dose [Marca®] ------------------------ quantidade", e na linha de baixo a posologia por extenso ("Tomar 1 comprimido, via oral, de 6/6 horas, se dor."). Alternativas com "OU" em linha própria.
- No PS: diluição, volume, tempo de infusão e via. Pode começar com "Medidas gerais:" (monitorização, exames, dieta) quando fizer sentido.
- Na alta: quantidades em caixas/comprimidos suficientes para o tempo de uso; depois "Orientações" (linhas com "- ") e "Retorno ao PS, se:" (linhas com "- ") com sinais de alarme do quadro.
- Texto puro, sem Markdown, sem negrito.`;
const GX_FMT = `SAÍDA: responda SOMENTE com um objeto JSON válido, sem texto antes ou depois e sem crases, com as chaves:
"titulo": nome curto do quadro (ex.: "Lombalgia aguda intensa");
"ps": prescrição para uso no PS (string; "" se não foi pedida);
"alta": receita de alta (string; "" se não foi pedida);
"obs": observações curtas para o médico (alergias consideradas, ajustes, alertas, o que confirmar); "" se nada.
Quebras de linha como \\n.`;

function rxCandidatas(texto, n = 25){
  const STOP = new Set(['dias','horas','anos','semana','semanas','paciente','refere','nega','sem','com','para','quadro','inicio','piora','melhora','hoje','ontem','fiz','feito']);
  const terms = [...new Set(norm(texto).split(/[^a-z0-9]+/).filter(t => t.length > 3 && !STOP.has(t) && !/^\d/.test(t)).map(t => t.slice(0, 5)))];
  const itens = state.data.prescricoes.itens;
  const pont = itens.map(it => { const w = norm(it.nome + ' ' + (it.cid || '') + ' ' + (catOf('prescricoes', it.categoria)?.nome || '')).split(/[^a-z0-9]+/); let sc = 0; for (const t of terms) if (w.some(x => x.startsWith(t))) sc += 3; return [sc + (isFav('prescricoes', it.id) ? 1 : 0), it]; });
  const achou = pont.filter(x => x[0] >= 3).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  return achou.length ? achou.slice(0, n) : itens;
}
function gxRefs(texto){
  const STOP = new Set(['dias','horas','anos','semana','semanas','paciente','refere','alergico','alergica','peso','quadro','inicio','sem','com','para','pedidos','pedido','prescrever','tomar','alta']);
  const terms = [...new Set(norm(texto).split(/[^a-z0-9]+/).filter(t => t.length > 3 && !STOP.has(t) && !/^\d/.test(t)).map(t => t.slice(0, 5)))];
  if (!terms.length) return [];
  return state.data.prescricoes.itens.map(it => {
    const words = norm(it.nome + ' ' + (it.cid||'')).split(/[^a-z0-9]+/); let sc = 0;
    for (const t of terms) if (words.some(w => w.startsWith(t))) sc += 3;
    return [sc, it];
  }).filter(x => x[0] > 0).sort((a,b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);
}

async function gerarRx(ajuste){
  if (!gx.texto.trim()) { $('#gxTexto')?.focus(); toast('Escreva os sintomas ou os pedidos'); return; }
  const refs = gxRefs(gx.texto);
  const pedir = {ambos:'Gere a prescrição no PS E a receita de alta.', ps:'Gere SOMENTE a prescrição no PS ("alta" vazio).', alta:'Gere SOMENTE a receita de alta ("ps" vazio).'}[gx.modo];
  let ctx = (store.meta.iaRx?.instrucoes ?? GX_PROMPT) + estiloTxt() + '\n\n' + GX_FMT + '\n\n' + pedir + '\n'
    + (gx.dor ? 'Inclua SEMPRE a opção para dor aguda intensa descrita acima, salvo contraindicação.\n' : 'Não inclua opioides, a menos que o médico peça.\n');
  const exemplo = state.data.prescricoes.itens.find(x => x.id === 'dor-aguda-intensa');
  if (exemplo) ctx += '\nEXEMPLO DE FORMATO DO MÉDICO (Dor aguda intensa):\n' + exemplo.abas.map(a => '[' + a.nome + ']\n' + a.texto).join('\n\n') + '\n';
  if (refs.length) ctx += '\nMODELOS DO MÉDICO PARA QUADROS PARECIDOS (prefira estas escolhas quando se aplicarem):\n' + refs.map(r => '### ' + r.nome + '\n' + r.abas.map(a => '[' + a.nome + ']\n' + a.texto).join('\n\n')).join('\n\n') + '\n';
  ctx += '\nSOLICITAÇÃO DO MÉDICO:\n' + gx.texto.trim();
  let msgs = [{role:'user', content:ctx}];
  if (ajuste && gx.msgs) msgs = [...gx.msgs, {role:'user', content:'Refaça aplicando este ajuste, no mesmo formato JSON: ' + ajuste}];
  gx.loading = 'Gerando a receita…'; gx.erro = null; renderGerar();
  const outAntes = gx.out; let quadro = 0, ultimo = '', mostrou = false, acabou = false;
  const pinta = () => { quadro = 0; if (acabou) return; const p = jsonParcial(ultimo, ['titulo','ps','alta','obs']); if (!p.ps && !p.alta) return; mostrou = true;
    gx.out = {titulo:p.titulo || '', ps:p.ps || '', alta:p.alta || '', obs:p.obs || ''}; gx.ed = {}; gx.loading = 'Escrevendo…';
    const y = scrollY; renderGerar(); scrollTo({top:y}); };
  try {
    const r = await aiSample(msgs, {modelTier:'default', nivel:'medium', cache:false, onText:({text}) => { ultimo = text; if (!quadro) quadro = requestAnimationFrame(pinta); }});
    acabou = true; if (quadro) cancelAnimationFrame(quadro);
    const j = parseJsonLoose(r.text);
    gx.out = {titulo:String(j.titulo||''), ps:String(j.ps||'').trim(), alta:String(j.alta||'').trim(), obs:String(j.obs||'').trim()};
    gx.msgs = [...msgs, {role:'assistant', content:r.text}]; gx.ed = {}; gx.ajuste = ''; gx.salvar = false;
  } catch (e) { acabou = true; if (quadro) cancelAnimationFrame(quadro); gx.erro = erroIA(e); if (mostrou) gx.out = outAntes; }
  gx.loading = false; renderGerar();
}
document.addEventListener('click', e => {
  const b = e.target.closest('#gerarSec button'); if (!b) return;
  if (b.id === 'gxGo') gerarRx();
  if (b.id === 'gxAjGo') { const a = $('#gxAjuste').value.trim(); if (!a) { $('#gxAjuste').focus(); toast('Escreva o ajuste'); return; } gx.ajuste = a; gerarRx(a); }
  if (b.id === 'gxClear') { gx = novoGx(); renderGerar(); $('#gxTexto')?.focus(); }
  if (b.id === 'gxSalvarAbrir') { gx.salvar = true; renderGerar(); $('#gxNome')?.focus(); }
  if (b.id === 'gxSalvarCancel') { gx.salvar = false; renderGerar(); }
  if (b.id === 'gxSalvar') {
    const nome = $('#gxNome').value.trim(); if (!nome) { $('#gxNome').focus(); toast('Dê um nome'); return; }

function calcEscore(e = pr.esc){
  const s = ESCORES.find(x => x.id === e.id) || ESCORES[0], v = e.v || {};
  let total;
  if (s.calc) total = s.calc(v);
  else {
    total = 0;
    for (const it of s.itens) {
      if (it.t === 'chk' && v[it.k]) total += it.p;
      if (it.t === 'sel') { if (v[it.k] == null) return {s, total:null, falta:true}; total += +v[it.k]; }
    }
  }
  if (total == null) return {s, total:null, falta:true};
  const r = s.interp(total, v);
  const pos = s.itens.filter(it => it.t === 'chk' && v[it.k] && it.p).map(it => /^[A-ZÀ-Ú][a-zà-ú]/.test(it.l) ? it.l.charAt(0).toLowerCase() + it.l.slice(1) : it.l);
  const texto = s.texto ? s.texto(s, total, r, pos, v)
    : `${s.nome} = ${fmtN(total)}${pos.length ? ' (' + pos.join(', ') + ')' : ''}: ${r.faixa}${r.conduta ? '; ' + r.conduta : ''}.`;

}

const LIXO_CX = /^(=+|-{3,}|#|>>)|DEPARTAMENTO DE|PEDIDO DE|IDENTIFICA|^Nome:|^Idade:|^HDA:?$|^Hist[óo]ria da doen[çc]a atual:?$|^Queixa principal:?$/i;

const limpaFim = t => String(t || '').trim().replace(/^[-•*]\s*|^\d+[.)]\s*/, '').replace(/[\s;,.:]+$/, '');
function hdCurta(l){
  let t = limpaFim(l);
  t = t.split(/,?\s+(?:pel[ao]s?|por|devido|associad[ao]s?|secund[áa]ri[ao] a|em raz[ãa]o)\s+/i)[0];
  return limpaFim(t).slice(0, 90);
}
function frasesCurtas(t, max = 240){
  const txt = String(t || '').replace(/\s+/g, ' ').trim(); if (txt.length <= max) return txt;
  const corte = txt.slice(0, max); const p = corte.lastIndexOf('. ');
  return (p > 80 ? corte.slice(0, p + 1) : corte.replace(/\s\S*$/, '') + '…');

const listaPassagem = so => so ? [so] : casos.filter(temConteudo).sort((a, b) => a.criado - b.criado);

  const blocos = lista.map(c => {
    const cx = c.out ? (i => (c.ed?.['pC' + i] ?? c.out['caixa' + i] ?? '')) : null;
    const idade = cx ? (String(cx(1)).match(/^Idade:\s*(.+)$/im)?.[1] || '').trim() : '';
    const hds = cx ? linhasUteis(cx(3), 4).map(hdCurta).filter(Boolean) : [];
    const hist = frasesCurtas((cx ? linhasUteis(cx(1), 6).join(' ') : c.notas || '').replace(/\b(HDA|Hist[óo]ria da doen[çc]a atual|QP|Queixa principal)\s*:\s*/gi, ''), 240);
    const ult = (c.evol || []).slice(-1)[0];
    const A = [...(c.escores || []).map(e => limpaFim(e.texto)), c.decisao ? `destino sugerido: ${DESTINOS[c.decisao.destino]?.l.toLowerCase()}` : '',
      ult ? `última evolução (${ult.tipo.toLowerCase()}, ${ult.hora}): ${frasesCurtas(linhasUteis(ult.texto, 4).join(' '), 160)}` : ''].filter(Boolean);
    const conds = cx ? linhasUteis(cx(4), 5).map(limpaFim).filter(Boolean) : [];

    const L = [`▸ ${c.iniciais || 'Sem iniciais'}${idade ? ', ' + idade : ''} · no PS há ${tempoTxt(Date.now() - c.criado)} (entrada ${hh(c.criado)})`];
    L.push(`S — ${hds.length ? 'Hipóteses: ' + hds.join('; ') : hdResumo(c)}`);
    if (hist) L.push(`B — ${hist}`);
    L.push(`A — ${A.length ? A.join('; ') : 'ainda sem reavaliação registrada'}`);
    L.push(`R — ${conds.length ? 'Conduta: ' + conds.join('; ') + '. ' : ''}${pa.length ? 'Pendente: ' + pa.map(p => p.t.charAt(0).toLowerCase() + p.t.slice(1)).join('; ') + '. ' : 'Sem pendências registradas. '}${r <= 0 ? `⚠️ Reavaliação atrasada desde ${hh(reavAte(c))}.` : `Reavaliar às ${hh(reavAte(c))}.`}`);

/* ---------- busca universal (Ctrl+K) ---------- */
let pal = {q:'', i:0, res:[]};
function palBuscar(qq){
  const terms = norm(qq).split(/\s+/).filter(Boolean); const out = [];
  for (const s of ['prescricoes', 'hdas', 'documentos']) {
    for (const it of state.data[s].itens) {
      const head = norm(`${it.nome} ${it.cid || ''} ${catOf(s, it.categoria)?.nome || ''}`);
      let sc = 0, ok = true;
      if (!terms.length) { if (!(s === 'prescricoes' && isFav(s, it.id))) continue; sc = 1; }
      for (const t of terms) { if (head.includes(t)) sc += head.startsWith(t) ? 14 : 10; else if (norm(it.abas.map(a => a.texto).join(' ')).includes(t)) sc += 1; else { ok = false; break; } }
      if (ok) out.push({s, it, sc: sc + (s === 'prescricoes' ? 0.5 : 0) + (isFav(s, it.id) ? 2 : 0)});
    }
  }
  return out.sort((a, b) => b.sc - a.sc).slice(0, 12);
}
function palTexto(s, it){ const t = comCid(s === 'documentos' ? cidDoModelo(it) : '', () => render(it.abas[0]?.texto || '')); return s === 'prescricoes' && !qtd ? semQtd(t) : t; }

    : `<div class="hint" style="padding:14px">${pal.q.trim() ? 'Nada encontrado.' : 'Digite uma doença, sintoma, CID ou documento. Sem texto, aparecem as suas prescrições favoritas.'}</div>`;
